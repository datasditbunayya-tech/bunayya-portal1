        .lp-portal-label { font-size: 12px; font-weight: 700; color: #333; text-align: center; }

        /* ── Login Form (dropdown) ── */
        .lp-form-area {
          background: white;
          border-radius: 20px;
          padding: 18px;
          box-shadow: 0 2px 16px rgba(0,0,0,.07);
          animation: slideDown .25s ease;
        }
        @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        .lp-form-title { font-size: 15px; font-weight: 800; color: #1a1a1a; margin-bottom: 14px; }
        .lp-input, .lp-select {
          width: 100%;
          padding: 12px 16px;
          font-size: 14px;
          font-family: inherit;
          border: 1.5px solid #e8e8e8;
          border-radius: 12px;
          background: #f8f9fa;
          color: #1a1a1a;
          outline: none;
          transition: all .2s;
          appearance: none;
          margin-bottom: 10px;
        }
        .lp-input:focus, .lp-select:focus { border-color: #27ae60; background: white; box-shadow: 0 0 0 3px rgba(39,174,96,.1); }
        .lp-select-wrap { position: relative; margin-bottom: 0; }
        .lp-select-wrap::after { content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; color:#888; font-size:13px; }
        .lp-select-wrap .lp-select { margin-bottom: 10px; }
        .lp-btn {
          width: 100%;
          padding: 13px;
          font-size: 14px;
          font-weight: 800;
          font-family: inherit;
          border: none;
          border-radius: 12px;
          cursor: pointer;
          transition: all .2s;
          margin-top: 4px;
          letter-spacing: .3px;
        }
        .lp-btn-green { background: linear-gradient(135deg,#1e9e5e,#27ae60); color: white; }
        .lp-btn-green:hover { box-shadow: 0 4px 16px rgba(39,174,96,.4); transform: translateY(-1px); }
        .lp-btn-blue { background: linear-gradient(135deg,#1565c0,#1e88e5); color: white; }
        .lp-btn-blue:hover { box-shadow: 0 4px 16px rgba(30,136,229,.4); transform: translateY(-1px); }
        .lp-btn-orange { background: linear-gradient(135deg,#e65100,#fb8c00); color: white; }
        .lp-btn-orange:hover { box-shadow: 0 4px 16px rgba(251,140,0,.4); transform: translateY(-1px); }
        .lp-error { font-size: 12px; color: #e53935; margin-bottom: 8px; padding: 8px 12px; background: #ffebee; border-radius: 8px; }
        .lp-hint { font-size: 11px; color: #aaa; text-align: center; margin-top: 6px; }

        /* ── Banner ── */
        .lp-banner {
          border-radius: 20px;
          padding: 20px;
          display: flex; align-items: center; justify-content: space-between;
          position: relative;
          overflow: hidden;
          min-height: 90px;
          box-shadow: 0 4px 20px rgba(0,0,0,.15);
          transition: background .5s;
        }
        .lp-banner-text-title { font-size: 17px; font-weight: 800; color: white; }
        .lp-banner-text-sub { font-size: 12px; color: rgba(255,255,255,.8); margin-top: 2px; }
        .lp-banner-icon { font-size: 36px; opacity: .85; }
        .lp-banner-arrow {
          width: 32px; height: 32px; border-radius: 50%;
          background: rgba(255,255,255,.25);
          display: flex; align-items: center; justify-content: center;
          color: white; font-size: 14px; border: none; cursor: pointer;
        }
        .lp-dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
        .lp-dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; transition: all .2s; }
        .lp-dot.active { background: #27ae60; width: 18px; border-radius: 99px; }

        /* ── Link Cepat ── */
        .lp-section-title { font-size: 16px; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; }
        .lp-links-row { display: flex; gap: 10px; }
        .lp-link-item {
          flex: 1;
          background: white;
          border-radius: 16px;
          padding: 14px 10px;
          display: flex; flex-direction: column; align-items: center; gap: 8px;
          box-shadow: 0 2px 10px rgba(0,0,0,.07);
          text-decoration: none; cursor: pointer; border: none; font-family: inherit;
          transition: transform .15s, box-shadow .15s;
        }
        .lp-link-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
        .lp-link-icon-wrap {
          width: 50px; height: 50px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 22px;
        }
        .lp-link-label { font-size: 12px; font-weight: 700; color: #333; }

        /* ── Announcements ── */
        .lp-ann-item {
          background: white;
          border-radius: 16px;
          padding: 14px 16px;
          display: flex; align-items: center; gap: 12px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06);
          cursor: pointer;
          transition: box-shadow .15s;
        }
        .lp-ann-item + .lp-ann-item { margin-top: 8px; }
        .lp-ann-item:hover { box-shadow: 0 4px 18px rgba(0,0,0,.1); }
        .lp-ann-icon {
          width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
          font-size: 18px;
          background: #e8f5e9;
        }
        .lp-ann-title { font-size: 14px; font-weight: 700; color: #1a1a1a; }
        .lp-ann-sub { font-size: 12px; color: #888; margin-top: 1px; }
        .lp-ann-arrow { margin-left: auto; color: #bbb; font-size: 13px; }
      
  </style>
</head>

// ─── COMPONENTS ───────────────────────────────────────────────────────────────
function Select({ value, onChange, options, placeholder, disabled }) {
  return (
    <div className="select-wrap">
      <select className="select" value={value} onChange={e => onChange(e.target.value)} disabled={disabled}>
        {placeholder && <option value="">{placeholder}</option>}
        {options.map(o => (
          <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>
        ))}
      </select>
    </div>
  );
}

function ProgressBar({ value }) {
  return (
    <div className="progress-bar-wrap">
      <div className="progress-bar-fill" style={{ width: `${Math.min(100, Math.max(0, value))}%` }} />
    </div>
  );
}

function Badge({ children, variant = "gray" }) {
  return <span className={`badge badge-${variant}`}>{children}</span>;
}

function StatusBadge({ status }) {
  const map = { Hadir: "green", Sakit: "yellow", Izin: "blue", Alpa: "red", Aktif: "green", Nonaktif: "gray", "Sangat Baik": "green", "Sangat baik": "green", Baik: "blue", Cukup: "yellow", Kurang: "red", Berjalan: "blue", Selesai: "green", Lancar: "green", "Perlu Latihan": "red" };
  return <Badge variant={map[status] ?? "gray"}>{status}</Badge>;
}

function Dialog({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="dialog-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="dialog">
        <div className="dialog-header">
          <span className="dialog-title">{title}</span>
          <button className="btn-ghost btn btn-icon" onClick={onClose}><Icon.X /></button>
        </div>
        <div className="dialog-body">{children}</div>
        {footer && <div className="dialog-footer">{footer}</div>}
      </div>
    </div>
  );
}

function App() {

  const SCRIPT_URL = "";
  const GS_ENABLED = false;

  const FB_COLLECTIONS = {
    studentAttendance: "absensiSiswa",
    teacherAttendance: "absensiGuru",
    journals: "jurnal",
    dailyReports: "harian",
    grades: "nilai",
    activities: "kegiatan",
    targets: "target",
    ziyadah: "ziyadah",
    teachers: "guru",
    students: "siswa",
  };

  // ── Firebase realtime listeners ──────────────────────────────────────────
  React.useEffect(() => {
    const tryConnect = () => {
      if (!window.__firebase || !window.__firebase.ready) {
        setTimeout(tryConnect, 500);
        return;
      }
      const { db } = window.__firebase;
      const collMap = {
        absensiSiswa: "studentAttendance",
        absensiGuru:  "teacherAttendance",
        jurnal:       "journals",
        harian:       "dailyReports",
        nilai:        "grades",
        kegiatan:     "activities",
        target:       "targets",
        ziyadah:      "ziyadah",
        guru:         "teachers",
        siswa:        "students",
      };
      const unsubs = Object.entries(collMap).map(([fbColl, stateKey]) => {
        return db.collection(fbColl).onSnapshot((snap) => {
          const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          if (docs.length > 0) {
            setData(prev => ({ ...prev, [stateKey]: docs }));
          }
          setLastSync(new Date().toLocaleString("id-ID"));
          setSyncStatus("success");
          setTimeout(() => setSyncStatus("idle"), 2000);
        }, (err) => {
          console.error("Firebase listener error:", err);
        });
      });
      return () => unsubs.forEach(u => u());
    };
    const cleanup = tryConnect();
    return () => { if (typeof cleanup === "function") cleanup(); };
  }, []);
  // ─────────────────────────────────────────────────────────────────

  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | success | error
  const [syncMsg, setSyncMsg]       = useState("");
  const [lastSync, setLastSync]     = useState(null);

  // Data store

          teachers: parsed.teachers || MOCK_TEACHERS,
          students: parsed.students || MOCK_STUDENTS,
          subjects: parsed.subjects || MOCK_SUBJECTS,
          surahs: parsed.surahs || MOCK_SURAHS,

          targets: parsed.targets || [],
          ziyadah: parsed.ziyadah || [],

    return null;

  // Global form / UI state
  const [formData, setFormData] = useState({});
  const [selectedKelas, setSelectedKelas] = useState("Semua");
  const [searchQuery, setSearchQuery] = useState("");
  const [addDialog, setAddDialog] = useState(null);

  const patchData = (key, val) => {
    setData(d => ({ ...d, [key]: val }));
    const fbColl = FB_COLLECTIONS[key];
    if (!fbColl || !window.__firebase?.ready) return;
    const { db } = window.__firebase;
    (async () => {
      try {
        const snap = await db.collection(fbColl).get();
        const batch = db.batch();
        snap.docs.forEach(d => batch.delete(d.ref));
        val.forEach(item => {
          const ref = db.collection(fbColl).doc(String(item.id));
          batch.set(ref, item);
        });
        await batch.commit();
        setSyncStatus("success");
        setSyncMsg("✅ Tersimpan ke Firebase");
        setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 2000);
      } catch(err) {
        console.error("Firebase write error:", err);
        setSyncStatus("error");
        setSyncMsg("❌ Gagal simpan: " + err.message);
        setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 4000);
      }
    })();
  };
  const patchForm = patch => setFormData(f => ({ ...f, ...patch }));
  const showLoading = () => setLoading(true);
  const hideLoading = () => setLoading(false);

        setUser({ role: "admin", name: "Administrator" });
        setPortal("guru");
        setMenu("dashboard");
      } else {
        setLoginError("Username atau password salah.");
      }
    } else if (loginRole === "teacher") {
      const t = data.teachers.find(t => t.id === loginForm.teacherId);
      if (t && (loginForm.password === t.nip || loginForm.password === "1234")) {
        setUser({ role: "teacher", name: t.nama, teacherId: t.id });
        setPortal("guru");
        setMenu("dashboard");
      } else {
        setLoginError("Password tidak sesuai. Silakan coba lagi.");
      }
    } else if (loginRole === "student") {
      const s = data.students.find(s => s.id === loginForm.studentId);
      if (s) {
        setUser({ role: "student", name: s.nama, studentId: s.id, nis: s.nis });
        setPortal("wali");
        setMenu("dashboard");
      } else {
        setLoginError("Pilih siswa terlebih dahulu");
      }
    }
  };

  const handleLogout = () => {
    setUser(null);
    setLoginRole(null);
    setLoginForm({ username: "", password: "", teacherId: "", studentClass: "", studentId: "" });
    setLoginError("");
  };

  const canAccess = (section) => {
    if (!user) return false;
    if (user.role === "admin") return true;
    if (user.role === "teacher") {
      return !["master-guru", "master-siswa", "kelola-pintasan", "google-sheets", "pengaturan-mapel"].includes(section);
    }
    return ["dashboard", "absensi", "harian", "nilai", "kegiatan", "target", "hafalan"].includes(section);
  };

  // ── SAVE HANDLERS ────────────────────────────────────────────────────────────
  const saveAbsensiSiswa = () => {
    if (!formData.abs_kelas) { alert("⚠️ Pilih kelas terlebih dahulu!"); return; }
    if (!formData.abs_students) { alert("⚠️ Klik tombol Muat Data terlebih dahulu!"); return; }
    const tanggal = formData.abs_tanggal || today();
    const newRecords = formData.abs_students.map(s => ({
      id: genId(), studentId: s.id, tanggal: tanggal,
      kelas: formData.abs_kelas, status: s.status || "Hadir",
      student: { nama: s.nama }
    }));
    const updatedAbsSiswa = [...data.studentAttendance, ...newRecords];
    patchData("studentAttendance", updatedAbsSiswa);
    syncCollection("absensiSiswa", newRecords).catch(() => {});
    patchForm({ abs_students: null, abs_kelas: "", abs_tanggal: "" });
    alert("✅ Absensi " + newRecords.length + " siswa berhasil disimpan!");
  };

  const saveAbsensiGuru = () => {
    if (!formData.abs_teacherId) { alert("⚠️ Pilih guru terlebih dahulu!"); return; }
    if (!formData.abs_kelasGuru) { alert("⚠️ Pilih kelas terlebih dahulu!"); return; }
    const t = data.teachers.find(t => t.id === formData.abs_teacherId);
    if (!t) { alert("⚠️ Guru tidak ditemukan!"); return; }
    const tanggal = formData.abs_tanggalGuru || today();
    const kelas = formData.abs_kelasGuru;
    const status = formData.abs_statusGuru || "Hadir";
    const rec = { id: genId(), teacherId: t.id, tanggal: tanggal, kelas: kelas, status: status, teacher: { nama: t.nama } };
    patchData("teacherAttendance", [...data.teacherAttendance, rec]);
    syncCollection("absensiGuru", [rec]).catch(() => {});
    patchForm({ abs_teacherId: "", abs_kelasGuru: "", abs_tanggalGuru: "", abs_statusGuru: "Hadir" });
    alert("✅ Absensi guru berhasil disimpan!");
  };

  const saveJurnal = () => {
    const t = data.teachers.find(t => t.id === formData.j_teacher);
    if (!t || !formData.j_kelas || !formData.j_topik) return;
    const rec = { id: genId(), teacherId: t.id, tanggal: formData.j_tanggal || today(), kelas: formData.j_kelas, mataPelajaran: formData.j_mapel || "", topik: formData.j_topik, kegiatan: formData.j_kegiatan || "", catatan: formData.j_catatan || "", teacher: { nama: t.nama } };
    patchData("journals", [...data.journals, rec]);
    patchForm({ j_teacher: "", j_kelas: "", j_mapel: "", j_topik: "", j_kegiatan: "", j_catatan: "" });
    syncCollection("jurnal", [rec]).catch(() => {});
    alert("✅ Jurnal berhasil disimpan!");
  };

  const saveHarian = () => {
    const s = data.students.find(s => s.id === formData.h_siswa);
    if (!s || !formData.h_bahasan || !formData.h_hasil) return;
    const rec = { id: genId(), studentId: s.id, tanggal: formData.h_tanggal || today(), kelas: s.class_name, bahasan: formData.h_bahasan, halaman: formData.h_halaman || "", hasil: formData.h_hasil, catatan: formData.h_catatan || "" };
    patchData("dailyReports", [...data.dailyReports, rec]);
    syncCollection("harian", [rec]).catch(() => {});
    alert("✅ Laporan harian berhasil disimpan!");
  };

  const saveKegiatan = () => {
    // dipanggil dari saveKegiatanKelas di dalam PortalSiswa
  };
  const saveKegiatanKelas = (kelas) => {
    const mapel = formData[`kg_mapel_${kelas}`];
    const tanggal = formData[`kg_tanggal_${kelas}`] || today();
    if (!mapel) { alert("Pilih mata pelajaran terlebih dahulu!"); return; }
    const students = data.students.filter(s => s.class_name === kelas);
    const records = students
      .map(s => ({
        id: genId(), studentId: s.id, tanggal, kelas,
        kategori: mapel, mataPelajaran: mapel,
        penilaian: formData[`kg_p_${kelas}_${s.id}`] || "Sangat Baik",
        deskripsi: ""
      }));

    patchData("activities", [...data.activities, ...records]);
    syncCollection("kegiatan", records).catch(() => {});
    const patch = {};
    students.forEach(s => { patch[`kg_p_${kelas}_${s.id}`] = ""; });
    patchForm(patch);
    alert(`✅ ${records.length} laporan kegiatan berhasil disimpan!`);
  };

  const saveTarget = () => {
    const s = data.students.find(s => s.id === formData.tr_siswa);
    if (!s || !formData.tr_mapel) return;
    const rec = { id: genId(), studentId: s.id, tanggal: today(), kelas: s.class_name, mataPelajaran: formData.tr_mapel, progressSaatIni: parseInt(formData.tr_progress) || 0, progressTotal: parseInt(formData.tr_total) || 100, satuan: formData.tr_satuan || "", hasil: formData.tr_hasil || "Lulus", catatan: formData.tr_catatan || "" };
    patchData("targets", [...data.targets, rec]);
    syncCollection("target", [rec]).catch(() => {});
    alert("✅ Target berhasil disimpan!");
  };

  const saveZiyadah = () => {
    const s = data.students.find(s => s.id === formData.z_siswa);
    if (!s || !formData.z_juz || !formData.z_hasil) return;
    const rec = { id: genId(), studentId: s.id, tanggal: formData.z_tanggal || today(), kelas: s.class_name, juz: formData.z_juz, surat: formData.z_surat || "", progress: formData.z_progress || "", hasil: formData.z_hasil, catatan: formData.z_catatan || "" };
    patchData("ziyadah", [...data.ziyadah, rec]);
    syncCollection("ziyadah", [rec]).catch(() => {});
    alert("✅ Ziyadah berhasil disimpan!");
  };

  const saveNilaiKelas = (kelas) => {
    const mapel = formData[`nm_mapel_${kelas}`];
    const jenis = formData[`nm_jenis_${kelas}`];
    const tanggal = formData[`nm_tanggal_${kelas}`] || today();
    if (!mapel || !jenis) { alert("Pilih mapel dan jenis nilai!"); return; }
    const students = data.students.filter(s => s.class_name === kelas);
    const records = students.filter(s => formData[`nm_v_${kelas}_${s.id}`]).map(s => ({ id: genId(), studentId: s.id, tanggal, kelas, mataPelajaran: mapel, jenisNilai: jenis, skor: parseInt(formData[`nm_v_${kelas}_${s.id}`]) || 0, student: { nama: s.nama } }));
    if (!records.length) { alert("Masukkan nilai untuk minimal satu siswa!"); return; }
    patchData("grades", [...data.grades, ...records]);
    syncCollection("nilai", records).catch(() => {});
    const patch = {};
    students.forEach(s => { patch[`nm_v_${kelas}_${s.id}`] = ""; });
    patchForm(patch);
    alert(`✅ ${records.length} nilai berhasil disimpan untuk ${kelas}!`);
  };

  // ── Google Sheets Sync Functions ─────────────────────────────────────────
  const resolveNames = (records, collection) => records.map(r => {
    const student = data.students.find(s => s.id === r.studentId);
    const teacher = data.teachers.find(t => t.id === r.teacherId);
    return {
      ...r,
      namaSiswa: student?.nama || r.student?.nama || "",
      namaGuru:  teacher?.nama || r.teacher?.nama  || "",
    };
  });

  // ── Firebase sync helpers (menggantikan Google Sheets) ───────────────────
  const jsonpPost = () => Promise.resolve(); // legacy stub, tidak dipakai

  const syncCollection = async (fbColl, records) => {
    if (!window.__firebase?.ready) return;
    const { db } = window.__firebase;
    try {
      const snap = await db.collection(fbColl).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      records.forEach(item => {
        const ref = db.collection(fbColl).doc(String(item.id));
        batch.set(ref, item);
      });
      await batch.commit();
    } catch(e) { console.error("syncCollection error:", e); }
  };

  const syncDelete = async (fbColl, id) => {
    if (!window.__firebase?.ready) return;
    try {
      await window.__firebase.db.collection(fbColl).doc(String(id)).delete();
    } catch(e) { console.error("syncDelete error:", e); }
  };

  // ── Firebase: Sync semua data sekaligus ─────────────────────────────────
  const syncAllToSheets = async () => {
    if (!window.__firebase?.ready) {
      alert("⚠️ Firebase belum terhubung, tunggu sebentar lalu coba lagi.");
      return;
    }
    setSyncStatus("syncing");
    setSyncMsg("🔄 Menyinkronkan semua data ke Firebase...");
    const { db } = window.__firebase;
    try {
      for (const [stateKey, fbColl] of Object.entries(FB_COLLECTIONS)) {
        const items = data[stateKey] || [];
        const snap = await db.collection(fbColl).get();
        const batch = db.batch();
        snap.docs.forEach(d => batch.delete(d.ref));
        items.forEach(item => {
          const ref = db.collection(fbColl).doc(String(item.id));
          batch.set(ref, item);
        });
        await batch.commit();
      }
      setSyncStatus("success");
      setSyncMsg("✅ Semua data berhasil disinkronkan ke Firebase!");
      setLastSync(new Date().toLocaleString("id-ID"));
    } catch(err) {
      setSyncStatus("error");
      setSyncMsg("❌ Gagal sinkron: " + err.message);
    }
    setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 4000);
  };

  const loadFromSheets = () => {
    setSyncStatus("syncing");
    setSyncMsg("🔄 Memuat ulang data dari Firebase...");
    // Data sudah auto-load via onSnapshot listener, cukup trigger feedback
    setTimeout(() => {
      setSyncStatus("success");
      setSyncMsg("✅ Data diperbarui dari Firebase (realtime aktif)");
      setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 3000);
    }, 1000);
  };

  const [deleteConfirm, setDeleteConfirm] = useState(null); // { collection, id, label }
  const deleteItem = (collection, id, label = "") => {
    setDeleteConfirm({ collection, id, label });
  };
  const confirmDelete = () => {
    if (!deleteConfirm) return;
    const { collection: collKey, id } = deleteConfirm;
    patchData(collKey, data[collKey].filter(i => i.id !== id));
    setDeleteConfirm(null);
    const fbColl = FB_COLLECTIONS[collKey];
    if (fbColl && window.__firebase?.ready) {
      window.__firebase.db.collection(fbColl).doc(String(id)).delete()
        .catch(err => console.error("Delete error:", err));
    }
  };

  // ── RENDER ───────────────────────────────────────────────────────────────────
  if (!user) return <LoginPage loginRole={loginRole} setLoginRole={setLoginRole} loginForm={loginForm} setLoginForm={setLoginForm} loginError={loginError} handleLogin={handleLogin} data={data} />;

  // ── Custom delete confirm dialog ─────────────────────────────────────────
  const DeleteModal = () => deleteConfirm ? (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ background:"white", borderRadius:20, padding:28, maxWidth:360, width:"90%", boxShadow:"0 20px 60px rgba(0,0,0,.3)" }}>
        <div style={{ fontSize:40, textAlign:"center", marginBottom:12 }}>🗑️</div>
        <div style={{ fontWeight:800, fontSize:18, textAlign:"center", marginBottom:8 }}>Hapus Data?</div>
        <div style={{ fontSize:14, color:"#666", textAlign:"center", marginBottom:24 }}>
          {deleteConfirm.label ? `"${deleteConfirm.label}"` : "Data ini"} akan dihapus secara permanen dan tidak bisa dikembalikan.
        </div>
        <div style={{ display:"flex", gap:12 }}>
          <button className="btn btn-outline w-full" onClick={() => setDeleteConfirm(null)} style={{ flex:1 }}>Batal</button>
          <button className="btn btn-danger w-full" onClick={confirmDelete} style={{ flex:1 }}>Ya, Hapus</button>
        </div>
      </div>
    </div>
  ) : null;

  const guruMenus = [
    { id: "dashboard", label: "📈 Dashboard" },
    { id: "data-sheets", label: "📊 Data Siswa" },
    { id: "kontrol", label: "🎛️ Kontrol Data" },
    { id: "absensi-siswa", label: "📋 Absensi Siswa" },
    { id: "absensi-guru", label: "🗒️ Absensi Guru" },
    { id: "jurnal", label: "📝 Jurnal Mengajar" },
    { id: "rekap-nilai", label: "📈 Rekap Nilai" },
    { id: "cetak-rapor", label: "📄 Cetak Rapor" },
    ...(canAccess("master-guru") ? [{ id: "master-guru", label: "📚 Master Guru" }] : []),
    ...(canAccess("kelola-pintasan") ? [{ id: "kelola-pintasan", label: "🔗 Pintasan" }] : []),
    ...(canAccess("pengaturan-mapel") ? [{ id: "pengaturan-mapel", label: "⚙️ Mapel" }] : []),
  ];

  const siswaMenus = [
    { id: "dashboard", label: "📊 Dashboard" },
    { id: "harian", label: "📝 Laporan Harian" },
    { id: "kegiatan", label: "🎯 Laporan Kegiatan" },
    { id: "target", label: "📈 Target" },
    { id: "ziyadah", label: "📖 Ziyadah" },
    ...(canAccess("master-siswa") ? [{ id: "siswa", label: "📖 Master Siswa" }] : []),
  ];

  const waliMenus = [
    { id: "dashboard", label: "🏠 Dashboard" },
    { id: "absensi", label: "📋 Absensi" },
    { id: "harian", label: "📝 Harian" },
    { id: "nilai", label: "📊 Nilai" },
    { id: "kegiatan", label: "🎯 Kegiatan" },
    { id: "target", label: "🏆 Target" },
    { id: "hafalan", label: "📖 Hafalan" },
  ];

  const activeMenus = portal === "guru" ? guruMenus : portal === "siswa" ? siswaMenus : waliMenus;
  const menuActiveClass = portal === "guru" ? "active" : portal === "siswa" ? "active-blue" : "active-purple";

  return (
    <div className="app">
      {/* styles moved to head */}
      <DeleteModal />

      {/* Sync Status Banner */}
      {syncStatus !== "idle" && syncMsg && (
        <div style={{
          position:"fixed", top:0, left:0, right:0, zIndex:10000,
          background: syncStatus === "success" ? "#065f46" : syncStatus === "error" ? "#991b1b" : "#1d4ed8",
          color:"white", padding:"10px 20px", fontSize:13, fontWeight:600,
          display:"flex", alignItems:"center", justifyContent:"center", gap:10,
          boxShadow:"0 2px 12px rgba(0,0,0,.3)"
        }}>
          {syncStatus === "syncing" && <span style={{animation:"spin 1s linear infinite", display:"inline-block"}}>⟳</span>}
          {syncMsg}
        </div>
      )}

      {/* Header */}
      <header className="header">
        <div className="header-brand">
          <div className="header-logo">🕌</div>
          <div>
            <div className="header-title">Portal Pendidikan</div>
            <div className="header-sub">Bunayya Islamic School</div>
          </div>
        </div>
        <div className="header-user">
          <div className="header-user-info">
            <div className="header-user-name">{user.name}</div>
            <div className="header-user-role">{user.role}</div>
          </div>
          {(user?.role === "admin" || user?.role === "teacher") && (
            <div style={{ display:"flex", flexDirection:"column", gap:3, alignItems:"flex-start" }}>
              <button
                title="Sinkronkan semua data ke Firebase Firestore"
                onClick={syncAllToSheets}
                disabled={syncStatus === "syncing"}
                style={{
                  display:"flex", alignItems:"center", gap:3,
                  padding:"3px 8px", fontSize:10, fontWeight:700,
                  border:"none", borderRadius:7, cursor:"pointer",
                  background: syncStatus === "syncing" ? "#1d4ed8" : syncStatus === "success" ? "#065f46" : "rgba(255,255,255,.2)",
                  color:"white", whiteSpace:"nowrap", transition:"all .2s"
                }}
              >
                {syncStatus === "syncing"
                  ? <><span style={{display:"inline-block", animation:"spin 1s linear infinite"}}>⟳</span> Sinkron...</>
                  : <><span>🔥</span> Firebase</>
                }
              </button>
              <button
                title="Muat ulang data dari Firebase"
                onClick={loadFromSheets}
                disabled={syncStatus === "syncing"}
                style={{
                  display:"flex", alignItems:"center", gap:3,
                  padding:"3px 8px", fontSize:10, fontWeight:700,
                  border:"none", borderRadius:7, cursor:"pointer",
                  background:"rgba(255,255,255,.2)",
                  color:"white", whiteSpace:"nowrap", transition:"all .2s"
                }}
              >
                <span>📥</span> Muat
              </button>
            </div>
          )}
          {lastSync && (
            <div style={{fontSize:9, color:"rgba(255,255,255,.6)", textAlign:"left", whiteSpace:"nowrap", lineHeight:1.4}}>
              🔥 Realtime<br/>{lastSync.split(",")[1]?.trim() || lastSync}
            </div>
          )}
          <button className="btn-logout" onClick={handleLogout} title="Logout"><Icon.Logout /></button>
        </div>
      </header>

      {/* Portal tabs */}
      <div className="portal-bar">
        {(user.role === "admin" || user.role === "teacher") && (
          <button className={`portal-tab ${portal === "guru" ? "active-guru" : ""}`} onClick={() => { setPortal("guru"); setMenu("dashboard"); }}>
            📚 Portal Guru
          </button>
        )}
        {(user.role === "admin" || user.role === "teacher") && (
          <button className={`portal-tab ${portal === "siswa" ? "active-siswa" : ""}`} onClick={() => { setPortal("siswa"); setMenu("dashboard"); }}>
            🏫 Portal Siswa
          </button>
        )}
        <button className={`portal-tab ${portal === "wali" ? "active-wali" : ""}`} onClick={() => { setPortal("wali"); setMenu("dashboard"); }}>
          📋 Portal Wali
        </button>
      </div>

      {/* Menu bar */}
      <div className="menu-bar">
        <div className="flex scroll-x min-w-max" style={{ padding: "0 24px", gap: 2 }}>
          {activeMenus.map(m => (
            <button key={m.id} className={`menu-btn ${menu === m.id ? menuActiveClass : ""}`} onClick={() => setMenu(m.id)}>
              {m.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="content">
        {portal === "guru" && (
          <PortalGuru menu={menu} data={data} patchData={patchData} formData={formData} patchForm={patchForm} selectedKelas={selectedKelas} setSelectedKelas={setSelectedKelas} searchQuery={searchQuery} setSearchQuery={setSearchQuery} user={user} canAccess={canAccess} saveAbsensiSiswa={saveAbsensiSiswa} saveAbsensiGuru={saveAbsensiGuru} saveJurnal={saveJurnal} saveNilaiKelas={saveNilaiKelas} deleteItem={deleteItem} addDialog={addDialog} setAddDialog={setAddDialog} />
        )}
        {portal === "siswa" && (
          <PortalSiswa menu={menu} data={data} patchData={patchData} formData={formData} patchForm={patchForm} user={user} canAccess={canAccess} saveHarian={saveHarian} saveKegiatan={saveKegiatan} saveKegiatanKelas={saveKegiatanKelas} saveTarget={saveTarget} saveZiyadah={saveZiyadah} selectedKelas={selectedKelas} setSelectedKelas={setSelectedKelas} deleteItem={deleteItem} syncCollection={syncCollection} />
        )}
        {portal === "wali" && (
          <PortalWali menu={menu} data={data} formData={formData} patchForm={patchForm} user={user} />
        )}
      </div>

      {loading && (
        <div className="loading-overlay">
          <div className="loading-card">
            <div className="spinner" />
            <div>Memproses...</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── LOGIN PAGE ───────────────────────────────────────────────────────────────

  const [bannerSlide, setBannerSlide] = useState(0);

    { title: "Selamat Datang", sub: "Portal Pendidikan Bunayya", bg: "linear-gradient(135deg,#1a8a5a,#27ae60)", icon: "🕌" },
    { title: "Pantau Perkembangan", sub: "Anak Anda setiap hari", bg: "linear-gradient(135deg,#1565c0,#1e88e5)", icon: "📊" },
    { title: "Generasi Qur'ani", sub: "Berakhlak & Berprestasi", bg: "linear-gradient(135deg,#6a1b9a,#9c27b0)", icon: "📖" },
  ];

  // auto-slide
  useState(() => {
    const t = setInterval(() => setBannerSlide(s => (s + 1) % banners.length), 3000);
    return () => clearInterval(t);
  });

  const portals = [
    { role: "teacher", label: "Portal Guru", icon: "📚", color: "#e8f5e9", iconBg: "#43a047", iconColor: "#fff" },
    { role: "admin",   label: "Portal Admin", icon: "🖥️", color: "#e3f2fd", iconBg: "#1e88e5", iconColor: "#fff" },
    { role: "student", label: "Portal Wali",  icon: "📋", color: "#fff3e0", iconBg: "#fb8c00", iconColor: "#fff" },
  ];



  return (
    <div style={{ minHeight: "100vh", background: "#f0f0f0", display: "flex", alignItems: "flex-start", justifyContent: "center" }}>
      {/* login styles moved to head */}

      <div className="lp-phone">
        {/* ── Header ── */}
        <div className="lp-header">
          <div className="lp-tag">EDUCATION PORTAL</div>
          <div className="lp-school-name">Bunayya Islamic School</div>
          <div className="lp-school-sub">Menuju Generasi Qur'ani</div>
          <div className="lp-header-icon">🏫</div>
        </div>

        {/* ── Body ── */}
        <div className="lp-body">

          {/* Portal Selector */}
          <div className="lp-portal-card">
            <div className="lp-portals-row">
              {portals.map(p => (
                <button
                  key={p.role}
                  className={`lp-portal-btn ${loginRole === p.role ? "selected" : ""}`}
                  onClick={() => setLoginRole(loginRole === p.role ? null : p.role)}

}

// ─── PORTAL GURU ─────────────────────────────────────────────────────────────
function PortalGuru({ menu, data, patchData, formData, patchForm, selectedKelas, setSelectedKelas, searchQuery, setSearchQuery, user, canAccess, saveAbsensiSiswa, saveAbsensiGuru, saveJurnal, saveNilaiKelas, deleteItem }) {

  const todayStr = today();

  // Dashboard
  if (menu === "dashboard") {

    // ── BarChart vertikal SVG ─────────────────────────────────────────────
    const BarChart = ({ items, color = "#1d7a5f", maxOverride }) => {
      const W = 52, GAP = 10, H = 130, PAD_LEFT = 32, PAD_BOT = 72, PAD_TOP = 16;
      const maxVal = maxOverride || Math.max(...items.map(i => i.val), 1);
      const totalW = items.length * W + (items.length - 1) * GAP + PAD_LEFT + 16;
      const yLines = [0, 0.25, 0.5, 0.75, 1];

      if (items.length === 0) return <div className="empty-state">Belum ada data</div>;

      return (
        <svg width="100%" viewBox={"0 0 " + totalW + " " + (H + PAD_BOT + PAD_TOP)}
          style={{ overflow:"visible", display:"block" }}>

          {/* Grid lines horizontal */}
          {yLines.map(frac => {
            const y = PAD_TOP + H - frac * H;
            return (
              <g key={frac}>
                <line x1={PAD_LEFT} y1={y} x2={totalW} y2={y} stroke="#e8e8e8" strokeWidth="1" strokeDasharray={frac===0?"0":"4 3"} />
                <text x={PAD_LEFT-4} y={y+4} textAnchor="end" fontSize="9" fill="#999">{Math.round(frac*maxVal)}</text>
              </g>
            );
          })}

          {/* Bars */}
          {items.map((item, i) => {
            const x = PAD_LEFT + i * (W + GAP);
            const barH = maxVal > 0 ? Math.max((item.val/maxVal)*H, item.val>0?4:0) : 0;
            const barY = PAD_TOP + H - barH;
            return (
              <g key={i}>
                <rect x={x+3} y={barY+3} width={W} height={barH} rx="5" fill="rgba(0,0,0,.06)" />
                <rect x={x} y={barY} width={W} height={barH} rx="5" fill={color} />
                {item.val > 0 && (
                  <text x={x+W/2} y={barY-6} textAnchor="middle" fontSize="14" fontWeight="900" fill={color}>{item.val}</text>
                )}
                {/* Label miring -45 derajat */}
                <text x={x+W/2} y={PAD_TOP+H+8} textAnchor="end" fontSize="14" fontWeight="900" fill="#333"
                  transform={"rotate(-45,"+(x+W/2)+","+(PAD_TOP+H+8)+")"}>
                  {item.lbl}
                </text>
              </g>
            );
          })}

          {/* Baseline */}
          <line x1={PAD_LEFT} y1={PAD_TOP+H} x2={totalW} y2={PAD_TOP+H} stroke="#ccc" strokeWidth="1.5" />
        </svg>
      );
    };

    // ── Data chart ───────────────────────────────────────────────────────
    const kelasList = KELAS_LIST.filter(k => k !== "Semua");
    const absSiswaPerKelas  = kelasList.map(k => ({ lbl: k, val: data.studentAttendance.filter(a => a.kelas === k).length }));
    const absGuruPerNama    = data.teachers.map(t => ({ lbl: t.nama, val: data.teacherAttendance.filter(a => a.teacherId === t.id).length }));
    const jurnalPerGuru     = data.teachers.map(t => ({ lbl: t.nama, val: data.journals.filter(j => j.teacherId === t.id).length }));
    const harianPerKelas    = kelasList.map(k => ({ lbl: k, val: data.dailyReports.filter(r => r.kelas === k).length }));
    const nilaiPerKelas     = kelasList.map(k => ({ lbl: k, val: data.grades.filter(g => g.kelas === k).length }));
    const kegiatanPerKelas  = kelasList.map(k => ({ lbl: k, val: data.activities.filter(a => a.kelas === k).length }));
    const targetPerKelas    = kelasList.map(k => ({ lbl: k, val: data.targets.filter(t => t.kelas === k).length }));
    const ziyadahPerKelas   = kelasList.map(k => ({ lbl: k, val: data.ziyadah.filter(z => z.kelas === k).length }));

    const globalMax = Math.max(
      ...absSiswaPerKelas.map(x=>x.val), ...absGuruPerNama.map(x=>x.val),
      ...jurnalPerGuru.map(x=>x.val), ...harianPerKelas.map(x=>x.val),
      ...nilaiPerKelas.map(x=>x.val), ...kegiatanPerKelas.map(x=>x.val),
      ...targetPerKelas.map(x=>x.val), ...ziyadahPerKelas.map(x=>x.val), 1
    );

    const CHART_COLORS = {
      absSiswa:"#1d7a5f", absGuru:"#2563a8", jurnal:"#7c3aed",
      harian:"#d97706", kegiatan:"#0891b2", target:"#dc2626",
      ziyadah:"#059669", nilai:"#9333ea"
    };

    const ChartCard = ({ title, items, color, maxOverride }) => (
      <div className="card">
        <div className="card-header">
          <div className="card-title">{title}</div>
          <div className="flex gap-2 items-center">
            <span style={{ fontSize:12, color:"#888" }}>{items.reduce((a,i)=>a+i.val,0)} total</span>
          </div>
        </div>
        <div className="card-body" style={{ overflowX:"auto" }}>
          {items.length === 0
            ? <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>📭 Belum ada data</div>
            : <BarChart items={items} color={color} maxOverride={maxOverride} />
          }
        </div>
      </div>
    );

    return (
      <div>
        {/* Stat cards */}
        <div className="card mb-4">
          <div className="card-header">
            <div>
              <div className="card-title">📈 Dashboard Statistik</div>
              <div className="card-sub">Data dari database sekolah</div>
            </div>
          </div>
          <div className="card-body">
            <div className="grid grid-8" style={{ gap: 12 }}>
              {[
                { icon: "📖", label: "Total Siswa",   value: data.students.length,           bg:"#dbeafe", c:"#1e40af" },
                { icon: "✏️", label: "Total Guru",    value: data.teachers.length,            bg:"#d1fae5", c:"#065f46" },
                { icon: "📊", label: "Data Nilai",    value: data.grades.length,              bg:"#ede9fe", c:"#5b21b6" },
                { icon: "📋", label: "Absensi Siswa", value: data.studentAttendance.length,   bg:"#ecfdf5", c:"#065f46" },
                { icon: "🗒️", label: "Absensi Guru", value: data.teacherAttendance.length,   bg:"#eff6ff", c:"#1e40af" },
                { icon: "📝", label: "Lap. Harian",  value: data.dailyReports.length,        bg:"#fef3c7", c:"#92400e" },
                { icon: "📒", label: "Jurnal",        value: data.journals.length,            bg:"#f5f3ff", c:"#5b21b6" },
                { icon: "🎯", label: "Target",        value: data.targets.length,             bg:"#fee2e2", c:"#991b1b" },
              ].map(s => (
                <div key={s.label} style={{ background:s.bg, borderRadius:12, padding:"14px 8px", textAlign:"center" }}>
                  <div style={{ fontSize:22, marginBottom:4 }}>{s.icon}</div>
                  <div style={{ fontSize:22, fontWeight:800, color:s.c }}>{s.value}</div>
                  <div style={{ fontSize:11, color:s.c, opacity:.8, marginTop:2 }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* 8 diagram vertikal kebawah, full width */}
        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          <ChartCard title="📋 Absensi Siswa per Kelas"       items={absSiswaPerKelas} color={CHART_COLORS.absSiswa} />
          <ChartCard title="🗒️ Absensi Guru per Nama"        items={absGuruPerNama}   color={CHART_COLORS.absGuru} />
          <ChartCard title="📝 Jurnal per Guru"               items={jurnalPerGuru}    color={CHART_COLORS.jurnal} />
          <ChartCard title="📄 Laporan Harian per Kelas"      items={harianPerKelas}   color={CHART_COLORS.harian} />
          <ChartCard title="📊 Rekap Nilai per Kelas"         items={nilaiPerKelas}    color={CHART_COLORS.nilai} />
          <ChartCard title="🎯 Laporan Kegiatan per Kelas"    items={kegiatanPerKelas} color={CHART_COLORS.kegiatan} />
          <ChartCard title="🎯 Target Pencapaian per Kelas"   items={targetPerKelas}   color={CHART_COLORS.target} />
          <ChartCard title="📖 Ziyadah Hafalan per Kelas"     items={ziyadahPerKelas}  color={CHART_COLORS.ziyadah} />
        </div>


      </div>
    );
  }

  // Data Sheets
  if (menu === "data-sheets") {
    const filtered = data.students.filter(s =>
      (selectedKelas === "Semua" || s.class_name === selectedKelas) &&
      (!searchQuery || s.nama.toLowerCase().includes(searchQuery.toLowerCase()) || s.nis.includes(searchQuery))
    );
    return (
      <div className="card">
        <div className="card-header">
          <div className="card-title">📊 Data Siswa</div>
          <div className="flex gap-2 wrap">
            <div style={{ position: "relative" }}>
              <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#8a8a8a" }}><Icon.Search /></span>
              <input className="input" style={{ paddingLeft: 34, width: 220 }} placeholder="Cari nama / NIS..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
            </div>
            <div className="select-wrap" style={{ width: 140 }}>
              <select className="select" value={selectedKelas} onChange={e => setSelectedKelas(e.target.value)}>
                {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
              </select>
            </div>
          </div>
        </div>
        <div className="card-body">
          <div className="grid grid-4 mb-4" style={{ gap: 12 }}>
            {[
              { label: "Siswa", val: data.students.length, bg: "#dbeafe", c: "#1e40af" },
              { label: "Guru", val: data.teachers.length, bg: "#d1fae5", c: "#065f46" },
              { label: "Nilai", val: data.grades.length, bg: "#ede9fe", c: "#5b21b6" },
              { label: "Absensi", val: data.studentAttendance.length, bg: "#fef3c7", c: "#92400e" },
            ].map(s => (
              <div key={s.label} style={{ background: s.bg, borderRadius: 12, padding: 16, textAlign: "center" }}>
                <div style={{ fontSize: 26, fontWeight: 700, color: s.c }}>{s.val}</div>
                <div style={{ fontSize: 12, color: s.c, opacity: .8 }}>{s.label}</div>
              </div>
            ))}
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>No</th><th>NIS</th><th>Nama Lengkap</th><th>Kelas</th></tr></thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr><td colSpan={4} className="empty-state">Tidak ada data siswa</td></tr>
                ) : filtered.map((s, i) => (
                  <tr key={s.id}><td>{i + 1}</td><td>{s.nis}</td><td>{s.nama}</td><td><Badge variant="blue">{s.class_name}</Badge></td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

  // Kontrol Data
  if (menu === "kontrol") {
    const allItems = [
      ...data.studentAttendance.map(a => ({ type: "Absensi Siswa", desc: a.student?.nama, detail: a.status, date: a.tanggal, id: a.id, col: "studentAttendance", badgeVariant: "blue" })),
      ...data.teacherAttendance.map(a => ({ type: "Absensi Guru", desc: a.teacher?.nama, detail: a.status, date: a.tanggal, id: a.id, col: "teacherAttendance", badgeVariant: "green" })),
      ...data.journals.map(j => ({ type: "Jurnal", desc: j.topik, detail: j.mataPelajaran, date: j.tanggal, id: j.id, col: "journals", badgeVariant: "purple" })),
      ...data.grades.map(g => ({ type: "Nilai", desc: g.student?.nama, detail: `${g.mataPelajaran}: ${g.skor}`, date: g.tanggal, id: g.id, col: "grades", badgeVariant: "gold" })),
    ].slice(0, 30);
    return (
      <div className="card">
        <div className="card-header"><div className="card-title">🎛️ Dashboard Kontrol Data</div></div>
        <div className="card-body">
          <div className="grid grid-4 mb-4" style={{ gap: 12 }}>
            {[
              { label: "Absensi Siswa", val: data.studentAttendance.length, col: "blue" },
              { label: "Absensi Guru", val: data.teacherAttendance.length, col: "green" },
              { label: "Jurnal", val: data.journals.length, col: "purple" },
              { label: "Nilai", val: data.grades.length, col: "gold" },
            ].map(s => <div key={s.label} className="stat-card"><div className="stat-value">{s.val}</div><div className="stat-label">{s.label}</div></div>)}
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Tipe</th><th>Deskripsi</th><th>Detail</th><th>Tanggal</th><th>Aksi</th></tr></thead>
              <tbody>
                {allItems.map(item => (
                  <tr key={`${item.col}-${item.id}`}>
                    <td><Badge variant={item.badgeVariant}>{item.type}</Badge></td>
                    <td>{item.desc}</td>
                    <td>{item.detail}</td>
                    <td className="text-muted text-sm">{item.date}</td>
                    <td><button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem(item.col, item.id, item.desc)}><Icon.Trash /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

  if (menu === "absensi-siswa") {
    const loadStudents = () => {
      if (!formData.abs_kelas) return;
      const students = data.students.filter(s => s.class_name === formData.abs_kelas).map(s => ({ ...s, status: "Hadir" }));
      patchForm({ abs_students: students, abs_tanggal: formData.abs_tanggal || todayStr });

    return (
      <div className="card">
        <div className="card-header"><div className="card-title">📋 Absensi Siswa</div></div>
        <div className="card-body">

            <div className="form-group">
              <label className="label">Kelas *</label>

                  const students = kelas ? data.students.filter(s => s.class_name === kelas).map(s => ({ ...s, status: "Hadir" })) : null;

                <option value="">-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Tanggal *</label>
              <input className="input" type="date" value={formData.abs_tanggal || todayStr} onChange={e => patchForm({ abs_tanggal: e.target.value })} />

          </div>
          {formData.abs_students && (
            <div className="table-wrap">
              <table>
                <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Status</th></tr></thead>
                <tbody>
                  {formData.abs_students.map((s, i) => (
                    <tr key={s.id}>
                      <td>{i + 1}</td><td>{s.nis}</td><td style={{fontWeight:600}}>{s.nama}</td>
                      <td>
                        <div className="select-wrap" style={{ width: 130 }}>

                          </select>
                        </div>
                      </td>

                </select>
              </div>
              <div className="select-wrap" style={{width:150}}>

                  ))}
                </select>
              </div>
            </div>

                <thead><tr><th>Tanggal</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead>

                  {(() => { const filtered = data.studentAttendance.filter(a =>

            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showGuruDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveGuru}><Icon.Save /> {formData.editGuruId ? "Simpan Perubahan" : "Tambah Guru"}</button></>}>
            <div className="form-group">
              <label className="label">NIP *</label>
              <input className="input" placeholder="Nomor Induk Pegawai" value={formData.newGuruNip || ""} onChange={e => patchForm({ newGuruNip: e.target.value })} />

            <div className="form-group">
              <label className="label">Nama Lengkap *</label>
              <input className="input" placeholder="Nama lengkap guru" value={formData.newGuruNama || ""} onChange={e => patchForm({ newGuruNama: e.target.value })} />

            <div className="form-group">
              <label className="label">Email</label>
              <input className="input" type="email" placeholder="email@bunayya.sch.id" value={formData.newGuruEmail || ""} onChange={e => patchForm({ newGuruEmail: e.target.value })} />

            <div className="form-group">
              <label className="label">Kelas Pengampu</label>
              <div className="select-wrap"><select className="select" value={formData.newGuruKelas || ""} onChange={e => patchForm({ newGuruKelas: e.target.value })}>

                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Status</label>
              <div className="select-wrap"><select className="select" value={formData.newGuruStatus || "Aktif"} onChange={e => patchForm({ newGuruStatus: e.target.value })}>
                <option value="Aktif">Aktif</option>
                <option value="Nonaktif">Nonaktif</option>
              </select></div>
            </div>
          </Dialog>
        )}
      </div>
    );
  }

  // Pintasan & Pengumuman
  if (menu === "kelola-pintasan") {
    const openAddLink = () => patchForm({ showLinkDialog: true, editLinkId: null, newLinkTitle: "", newLinkUrl: "", newLinkIcon: "🔗" });
    const openEditLink = (l) => patchForm({ showLinkDialog: true, editLinkId: l.id, newLinkTitle: l.title, newLinkUrl: l.url, newLinkIcon: l.icon });
    const saveLink = () => {
      if (!formData.newLinkTitle) { alert("Judul link wajib diisi!"); return; }
      if (formData.editLinkId) {
        patchData("quickLinks", data.quickLinks.map(l => l.id === formData.editLinkId ? { ...l, title: formData.newLinkTitle, url: formData.newLinkUrl, icon: formData.newLinkIcon } : l));
      } else {
        patchData("quickLinks", [...data.quickLinks, { id: genId(), title: formData.newLinkTitle, url: formData.newLinkUrl || "#", icon: formData.newLinkIcon || "🔗" }]);
      }
      patchForm({ showLinkDialog: false });
    };
    const openAddAnn = () => patchForm({ showAnnDialog: true, editAnnId: null, newAnnJudul: "", newAnnDeskripsi: "", newAnnIcon: "📢" });
    const openEditAnn = (a) => patchForm({ showAnnDialog: true, editAnnId: a.id, newAnnJudul: a.judul, newAnnDeskripsi: a.deskripsi, newAnnIcon: a.icon });
    const saveAnn = () => {
      if (!formData.newAnnJudul) { alert("Judul pengumuman wajib diisi!"); return; }
      if (formData.editAnnId) {
        patchData("announcements", data.announcements.map(a => a.id === formData.editAnnId ? { ...a, judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi, icon: formData.newAnnIcon } : a));
      } else {
        patchData("announcements", [...data.announcements, { id: genId(), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" }]);
      }
      patchForm({ showAnnDialog: false });
    };
    const ICON_OPTS = ["🔗","📋","💰","❤️","📢","🏫","📖","🎓","✏️","🗓️","📌","⭐","🔔","📣","📝","🏆"];
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
        {/* Link Cepat */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🔗 Link Cepat</div>
            <button className="btn btn-primary btn-sm" onClick={openAddLink}><Icon.Plus /> Tambah Link</button>
          </div>
          <div className="card-body">
            {data.quickLinks.length === 0 ? <div className="empty-state">Belum ada link cepat</div> : (
              <div className="row-list">
                {data.quickLinks.map(l => (
                  <div key={l.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{l.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{l.title}</div>
                        <div className="text-xs text-muted">{l.url}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" title="Buka Link" onClick={() => window.open(l.url, "_blank")}>🔗</button>
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditLink(l)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("quickLinks", l.id, l.title)}><Icon.Trash /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Pengumuman */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">📢 Pengumuman</div>
            <button className="btn btn-primary btn-sm" onClick={openAddAnn}><Icon.Plus /> Tambah Pengumuman</button>
          </div>
          <div className="card-body">
            {data.announcements.length === 0 ? <div className="empty-state">Belum ada pengumuman</div> : (
              <div className="row-list">
                {data.announcements.map(a => (
                  <div key={a.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{a.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{a.judul}</div>
                        <div className="text-xs text-muted">{a.deskripsi}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditAnn(a)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("announcements", a.id, a.judul)}><Icon.Trash /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Dialog Link */}
        {formData.showLinkDialog && (
          <Dialog open title={formData.editLinkId ? "✏️ Edit Link Cepat" : "➕ Tambah Link Cepat"} onClose={() => patchForm({ showLinkDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showLinkDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveLink}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Pilih Ikon</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:4 }}>
                {ICON_OPTS.map(ic => <button key={ic} onClick={() => patchForm({ newLinkIcon: ic })} style={{ width:38, height:38, fontSize:20, border: formData.newLinkIcon===ic ? "2px solid #27ae60":"1.5px solid #e8e8e8", borderRadius:10, cursor:"pointer", background: formData.newLinkIcon===ic ? "#e8f5e9":"#f8f9fa" }}>{ic}</button>)}
              </div>
            </div>
            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Nama link" value={formData.newLinkTitle || ""} onChange={e => patchForm({ newLinkTitle: e.target.value })} /></div>
            <div className="form-group"><label className="label">URL</label><input className="input" placeholder="https://..." value={formData.newLinkUrl || ""} onChange={e => patchForm({ newLinkUrl: e.target.value })} /></div>
          </Dialog>
        )}

        {/* Dialog Pengumuman */}
        {formData.showAnnDialog && (
          <Dialog open title={formData.editAnnId ? "✏️ Edit Pengumuman" : "➕ Tambah Pengumuman"} onClose={() => patchForm({ showAnnDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showAnnDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveAnn}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Pilih Ikon</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:4 }}>
                {ICON_OPTS.map(ic => <button key={ic} onClick={() => patchForm({ newAnnIcon: ic })} style={{ width:38, height:38, fontSize:20, border: formData.newAnnIcon===ic ? "2px solid #27ae60":"1.5px solid #e8e8e8", borderRadius:10, cursor:"pointer", background: formData.newAnnIcon===ic ? "#e8f5e9":"#f8f9fa" }}>{ic}</button>)}
              </div>
            </div>
            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Judul pengumuman" value={formData.newAnnJudul || ""} onChange={e => patchForm({ newAnnJudul: e.target.value })} /></div>
            <div className="form-group"><label className="label">Deskripsi</label><textarea className="textarea" rows={3} placeholder="Keterangan pengumuman..." value={formData.newAnnDeskripsi || ""} onChange={e => patchForm({ newAnnDeskripsi: e.target.value })} /></div>
          </Dialog>
        )}
      </div>
    );
  }

  // Pengaturan Mapel
  if (menu === "pengaturan-mapel") {
    const openAddMapel = () => patchForm({ showMapelDialog: true, editMapelId: null, newMapelNama: "" });
    const openEditMapel = (s) => patchForm({ showMapelDialog: true, editMapelId: s.id, newMapelNama: s.name });
    const saveMapel = () => {
      if (!formData.newMapelNama) { alert("Nama mapel wajib diisi!"); return; }
      if (formData.editMapelId) {
        patchData("subjects", data.subjects.map(s => s.id === formData.editMapelId ? { ...s, name: formData.newMapelNama } : s));
      } else {
        patchData("subjects", [...data.subjects, { id: genId(), name: formData.newMapelNama }]);
      }
      patchForm({ showMapelDialog: false });
    };
    const MAPEL_COLORS = ["#e8f5e9","#e3f2fd","#fff3e0","#fce4ec","#ede7f6","#e0f7fa","#f3e5f5","#fff8e1"];
    return (
      <div>
        <div className="card">
          <div className="card-header">
            <div className="card-title">📖 Pengaturan Mata Pelajaran</div>
            <button className="btn btn-primary btn-sm" onClick={openAddMapel}><Icon.Plus /> Tambah Mapel</button>
          </div>
          <div className="card-body">
            <div className="flex gap-3 wrap">
              {data.subjects.map((s, i) => (
                <div key={s.id} style={{ display:"flex", alignItems:"center", gap:8, background: MAPEL_COLORS[i % MAPEL_COLORS.length], borderRadius:12, padding:"10px 16px", border:"1.5px solid rgba(0,0,0,.06)" }}>
                  <span style={{ fontSize:14, fontWeight:700 }}>{s.name}</span>
                  <div className="flex gap-1">
                    <button onClick={() => openEditMapel(s)} style={{ background:"rgba(0,0,0,.06)", border:"none", cursor:"pointer", borderRadius:6, padding:"3px 6px", fontSize:12, display:"flex", alignItems:"center" }}><Icon.Edit /></button>
                    <button onClick={() => deleteItem("subjects", s.id, s.name)} style={{ background:"#fee2e2", border:"none", cursor:"pointer", color:"#c0392b", borderRadius:6, padding:"3px 6px", fontSize:12, display:"flex", alignItems:"center" }}><Icon.Trash /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {formData.showMapelDialog && (
          <Dialog open title={formData.editMapelId ? "✏️ Edit Mata Pelajaran" : "➕ Tambah Mata Pelajaran"} onClose={() => patchForm({ showMapelDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showMapelDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveMapel}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Nama Mata Pelajaran *</label>
              <input className="input" placeholder="Contoh: Al-Qur'an, Matematika..." value={formData.newMapelNama || ""} onChange={e => patchForm({ newMapelNama: e.target.value })} onKeyDown={e => e.key === "Enter" && saveMapel()} />
            </div>
          </Dialog>
        )}
      </div>
    );
  }

  return null;
}


// ─── PORTAL SISWA ─────────────────────────────────────────────────────────────
function PortalSiswa({ menu, data, patchData, formData, patchForm, user, canAccess, saveHarian, saveKegiatan, saveKegiatanKelas, saveTarget, saveZiyadah, selectedKelas, setSelectedKelas, deleteItem, syncCollection }) {
  const todayStr = today();

  if (menu === "dashboard") {
    return (
      <div className="card">
        <div className="card-header"><div className="card-title">📊 Dashboard Siswa</div></div>
        <div className="card-body">
          <div className="grid grid-2 mb-4">
            <div className="form-group">
              <label className="label">Pilih Kelas</label>
              <div className="select-wrap"><select className="select" value={formData.siswa_kelas || ""} onChange={e => patchForm({ siswa_kelas: e.target.value, siswa_id: "" })}>
                <option value="">-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Pilih Siswa</label>
              <div className="select-wrap"><select className="select" value={formData.siswa_id || ""} onChange={e => patchForm({ siswa_id: e.target.value })} disabled={!formData.siswa_kelas}>
                <option value="">{formData.siswa_kelas ? "-- Pilih Siswa --" : "Pilih kelas dulu"}</option>
                {data.students.filter(s => s.class_name === formData.siswa_kelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
              </select></div>
            </div>
          </div>
          {!formData.siswa_id ? (
            <div className="empty-state">📊 Pilih kelas dan siswa untuk melihat perkembangan</div>
          ) : (() => {
            const sid = formData.siswa_id;
            const grades = data.grades.filter(g => g.studentId === sid);
            const avg = grades.length ? Math.round(grades.reduce((a, g) => a + g.skor, 0) / grades.length) : 0;
            const att = data.studentAttendance.filter(a => a.studentId === sid);
            return (
              <div>
                <div className="grid grid-4 mb-4" style={{ gap: 12 }}>
                  <div className="stat-card"><div className="stat-icon">📊</div><div className="stat-value">{avg}</div><div className="stat-label">Rata-rata Nilai</div></div>
                  <div className="stat-card"><div className="stat-icon">📋</div><div className="stat-value">{att.filter(a => a.status === "Hadir").length}</div><div className="stat-label">Hari Hadir</div></div>
                  <div className="stat-card"><div className="stat-icon">📝</div><div className="stat-value">{data.dailyReports.filter(r => r.studentId === sid).length}</div><div className="stat-label">Laporan Harian</div></div>
                  <div className="stat-card"><div className="stat-icon">📖</div><div className="stat-value">{data.ziyadah.filter(z => z.studentId === sid).length}</div><div className="stat-label">Ziyadah</div></div>
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    );
  }

  if (menu === "harian") {
    return (
      <div className="card">
        <div className="card-header"><div className="card-title">📝 Laporan Harian</div></div>
        <div className="card-body">
          <div className="grid grid-2 mb-4">
            {[["Kelas", "h_kelas", KELAS_LIST.filter(k => k !== "Semua"), "select"], ["Tanggal", "h_tanggal", null, "date"]].map(([label, key, opts, type]) => (
              <div key={key} className="form-group">
                <label className="label">{label} *</label>
                {type === "select" ? (
                  <div className="select-wrap"><select className="select" value={formData[key] || ""} onChange={e => patchForm({ [key]: e.target.value, h_siswa: "" })}>
                    <option value="">-- Pilih --</option>
                    {opts.map(o => <option key={o} value={o}>{o}</option>)}
                  </select></div>
                ) : (
                  <input className="input" type="date" value={formData[key] || todayStr} onChange={e => patchForm({ [key]: e.target.value })} />
                )}
              </div>
            ))}
            <div className="form-group">
              <label className="label">Nama Siswa *</label>
              <div className="select-wrap"><select className="select" value={formData.h_siswa || ""} onChange={e => patchForm({ h_siswa: e.target.value })} disabled={!formData.h_kelas}>
                <option value="">{formData.h_kelas ? "-- Pilih Siswa --" : "Pilih kelas dulu"}</option>
                {data.students.filter(s => s.class_name === formData.h_kelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Halaman</label>
              <input className="input" placeholder="Halaman buku/iqro" value={formData.h_halaman || ""} onChange={e => patchForm({ h_halaman: e.target.value })} />
            </div>
          </div>
          <div className="form-group">
            <label className="label">Bahasan *</label>
            <input className="input" placeholder="Topik pembelajaran hari ini" value={formData.h_bahasan || ""} onChange={e => patchForm({ h_bahasan: e.target.value })} />
          </div>
          <div className="form-group">
            <label className="label">Hasil *</label>
            <div className="select-wrap"><select className="select" value={formData.h_hasil || ""} onChange={e => patchForm({ h_hasil: e.target.value })}>
              <option value="">-- Pilih --</option>
              {HASIL_LIST.map(h => <option key={h} value={h}>{h}</option>)}
            </select></div>
          </div>
          <div className="form-group">
            <label className="label">Catatan</label>
            <textarea className="textarea" value={formData.h_catatan || ""} onChange={e => patchForm({ h_catatan: e.target.value })} />
          </div>
          <button className="btn btn-blue" onClick={saveHarian} disabled={!formData.h_siswa || !formData.h_bahasan || !formData.h_hasil}><Icon.Save /> Simpan Laporan</button>

          <div className="mt-6">
            <div style={{ fontWeight: 700, marginBottom: 12 }}>📝 Riwayat Laporan Harian</div>
            <div className="flex gap-2 items-center mb-3" style={{flexWrap:"wrap",gap:8}}>
              <div className="select-wrap" style={{width:140}}>
                <select className="select" style={{fontSize:13}} value={formData.hr_fkelas || "Semua"} onChange={e => patchForm({hr_fkelas: e.target.value, hr_fnama: ""})}>
                  {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{width:180}}>
                <select className="select" style={{fontSize:13}} value={formData.hr_fnama || ""} onChange={e => patchForm({hr_fnama: e.target.value})}>
                  <option value="">Semua Nama</option>
                  {data.students.filter(s => !formData.hr_fkelas || formData.hr_fkelas === "Semua" || s.class_name === formData.hr_fkelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{width:150}}>
                <select className="select" style={{fontSize:13}} value={formData.hr_fbulan || ""} onChange={e => patchForm({hr_fbulan: e.target.value})}>
                  <option value="">Semua Bulan</option>
                  {["01","02","03","04","05","06","07","08","09","10","11","12"].map(bln => (
                    <option key={bln} value={bln}>{["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][parseInt(bln)-1]}</option>
                  ))}
                </select>
              </div>
            </div>
            <div className="row-list">
              {(() => {
                const fhr = data.dailyReports.filter(r => {
                  const s = data.students.find(s => s.id === r.studentId);
                  return (!formData.hr_fkelas || formData.hr_fkelas === "Semua" || s?.class_name === formData.hr_fkelas)
                    && (!formData.hr_fnama || r.studentId === formData.hr_fnama)
                    && (!formData.hr_fbulan || (r.tanggal && r.tanggal.slice(5,7) === formData.hr_fbulan));
                });
                if (fhr.length === 0) return <div className="empty-state">Belum ada laporan harian</div>;
                return fhr.map(r => {
                  const s = data.students.find(s => s.id === r.studentId);
                  return (
                    <div key={r.id} className="row-item">
                      <div>
                        <div style={{ fontWeight: 600 }}>{r.bahasan}</div>
                        <div className="text-xs text-muted">{s?.nama} — {s?.class_name} — {r.tanggal}</div>
                      </div>
