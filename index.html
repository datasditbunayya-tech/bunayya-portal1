                      <td><Badge variant="gray">{g.jenisNilai}</Badge></td>
                      <td style={{ fontWeight: 700, color: g.skor >= 80 ? "#065f46" : g.skor >= 60 ? "#92400e" : "#991b1b" }}>{g.skor}</td>
                      <td><button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("grades", g.id, g.student?.nama || g.mataPelajaran)}><Icon.Trash /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Cetak Rapor
  if (menu === "cetak-rapor") {
    const handleDownloadPDF = () => {
      const el = document.getElementById("rapor-preview");
      if (!el) { alert("Pilih siswa terlebih dahulu!"); return; }

      const btn = document.getElementById("btn-download-rapor");
      if (btn) { btn.disabled = true; btn.innerText = "⏳ Memproses..."; }

      const waitReady = (cb, tries) => {
        tries = tries || 0;
        if (typeof html2canvas !== "undefined" && (typeof window.jspdf !== "undefined" || typeof jspdf !== "undefined")) return cb();
        if (tries > 40) { alert("Library belum siap, pastikan internet aktif lalu refresh."); if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; } return; }
        setTimeout(() => waitReady(cb, tries + 1), 200);
      };

      waitReady(() => {
        html2canvas(el, {
          scale: 3, useCORS: true, allowTaint: true,
          backgroundColor: "#ffffff", logging: false,
        }).then(canvas => {
          const jsPDFLib = (window.jspdf || jspdf).jsPDF;
          const pdf    = new jsPDFLib({ orientation: "portrait", unit: "mm", format: "a4" });
          const pageW  = pdf.internal.pageSize.getWidth();
          const pageH  = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const usableW = pageW - margin * 2;
          const imgW   = canvas.width;
          const imgH   = canvas.height;
          const scale  = usableW / (imgW / 3);
          const imgHmm = (imgH / 3) * scale;
          const imgData = canvas.toDataURL("image/jpeg", 0.97);

          const maxH = pageH - margin * 2;
          if (imgHmm <= maxH) {
            pdf.addImage(imgData, "JPEG", margin, margin, usableW, imgHmm);
          } else {
            let srcY = 0;
            let firstPage = true;
            while (srcY < imgH) {
              const sliceH = Math.min((maxH / scale) * 3, imgH - srcY);
              const sc = document.createElement("canvas");
              sc.width = imgW; sc.height = sliceH;
              sc.getContext("2d").drawImage(canvas, 0, srcY, imgW, sliceH, 0, 0, imgW, sliceH);
              if (!firstPage) { pdf.addPage(); }
              pdf.addImage(sc.toDataURL("image/jpeg", 0.97), "JPEG", margin, margin, usableW, (sliceH / 3) * scale);
              srcY += sliceH;
              firstPage = false;
            }
          }

          const s  = data.students.find(s => s.id === formData.rapor_siswa);
          const nm = (s?.nama || "siswa").replace(/ /g, "-");
          pdf.save(`Rapor-${nm}-${formData.rapor_semester || "Sem1"}-${formData.rapor_tahun || "2025-2026"}.pdf`);
          if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
        }).catch(err => {
          alert("Gagal: " + err.message);
          if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
        });
      });
    };

    return (
      <div className="card">
        <div className="card-header"><div className="card-title">📄 Cetak Rapor Semester</div></div>
        <div className="card-body">
          <div className="grid grid-2 mb-4">
            <div className="form-group">
              <label className="label">Kelas *</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_kelas || ""} onChange={e => patchForm({ rapor_kelas: e.target.value, rapor_siswa: "" })}>
                <option value="">-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Siswa *</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_siswa || ""} onChange={e => patchForm({ rapor_siswa: e.target.value })} disabled={!formData.rapor_kelas}>
                <option value="">{formData.rapor_kelas ? "-- Pilih Siswa --" : "Pilih kelas dulu"}</option>
                {data.students.filter(s => s.class_name === formData.rapor_kelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Semester</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_semester || "Semester 1 (Ganjil)"} onChange={e => patchForm({ rapor_semester: e.target.value })}>
                <option value="Semester 1 (Ganjil)">Semester 1 (Ganjil)</option>
                <option value="Semester 2 (Genap)">Semester 2 (Genap)</option>
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Tahun Ajaran</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_tahun || "2025/2026"} onChange={e => patchForm({ rapor_tahun: e.target.value })}>
                <option value="2024/2025">2024/2025</option>
                <option value="2025/2026">2025/2026</option>
              </select></div>
            </div>
          </div>

          <button id="btn-download-rapor" className="btn btn-primary" disabled={!formData.rapor_siswa} onClick={handleDownloadPDF} style={{ marginBottom:20 }}>
            <Icon.Download /> ⬇️ Download PDF Rapor
          </button>

          {formData.rapor_siswa && (() => {
            const s = data.students.find(s => s.id === formData.rapor_siswa);
            const grades = data.grades.filter(g => g.studentId === formData.rapor_siswa);
            const att    = data.studentAttendance.filter(a => a.studentId === formData.rapor_siswa);
            const hadirCount = att.filter(a => a.status === "Hadir").length;
            const avg = grades.length > 0 ? Math.round(grades.reduce((a, g) => a + g.skor, 0) / grades.length) : 0;
            const predikat = v => v >= 90 ? "A" : v >= 80 ? "B" : v >= 70 ? "C" : v >= 60 ? "D" : "E";
            const keterangan = v => v >= 90 ? "Sangat Baik" : v >= 80 ? "Baik" : v >= 70 ? "Cukup" : v >= 60 ? "Perlu Bimbingan" : "Kurang";

            return (
              <div id="rapor-preview" style={{ background:"#fff", borderRadius:16, padding:28, border:"2px solid #e0e0e0", maxWidth:620, margin:"0 auto", fontFamily:"Arial,sans-serif" }}>
                {/* Header Rapor */}
                <div style={{ textAlign:"center", borderBottom:"3px double #1d7a5f", paddingBottom:16, marginBottom:20 }}>
                  <div style={{ fontSize:28, marginBottom:4 }}>🕌</div>
                  <div style={{ fontSize:20, fontWeight:800, color:"#1d7a5f", letterSpacing:.5 }}>BUNAYYA ISLAMIC SCHOOL</div>
                  <div style={{ fontSize:12, color:"#666", marginTop:2 }}>Jl. Panaragan Jaya — Portal Pendidikan</div>
                  <div style={{ marginTop:10, fontSize:15, fontWeight:700, color:"#333", background:"#f0fdf4", borderRadius:8, padding:"6px 16px", display:"inline-block" }}>
                    RAPOR {(formData.rapor_semester || "Semester 1").toUpperCase()} — T.A {formData.rapor_tahun || "2025/2026"}
                  </div>
                </div>

                {/* Info Siswa */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20, background:"#f8fafc", borderRadius:10, padding:14 }}>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Nama Siswa</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.nama}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Kelas</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.class_name}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>NIS</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.nis || "-"}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Kehadiran</div><div style={{ fontWeight:700, fontSize:14, color:"#1d7a5f" }}>{hadirCount}/{att.length} hari</div></div>
                </div>

                {/* Tabel Nilai */}
                <div style={{ marginBottom:16 }}>
                  <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#333" }}>📊 Rekap Nilai Mata Pelajaran</div>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                    <thead>
                      <tr style={{ background:"#1d7a5f", color:"white" }}>
                        <th style={{ padding:"8px 10px", textAlign:"left", borderRadius:"6px 0 0 0" }}>Mata Pelajaran</th>
                        <th style={{ padding:"8px 10px", textAlign:"center" }}>Nilai</th>
                        <th style={{ padding:"8px 10px", textAlign:"center" }}>Predikat</th>
                        <th style={{ padding:"8px 10px", textAlign:"left", borderRadius:"0 6px 0 0" }}>Keterangan</th>
                      </tr>
                    </thead>
                    <tbody>
                      {data.subjects.map((subj, i) => {
                        const sg  = grades.filter(g => g.mataPelajaran === subj.name);
                        const val = sg.length > 0 ? Math.round(sg.reduce((a, g) => a + g.skor, 0) / sg.length) : null;
                        return (
                          <tr key={subj.id} style={{ background: i%2===0 ? "#f8fafc" : "#fff" }}>
                            <td style={{ padding:"7px 10px", fontWeight:500 }}>{subj.name}</td>
                            <td style={{ padding:"7px 10px", textAlign:"center", fontWeight:700, color: val >= 80 ? "#1d7a5f" : val >= 70 ? "#d97706" : val ? "#dc2626" : "#aaa" }}>{val ?? "-"}</td>
                            <td style={{ padding:"7px 10px", textAlign:"center", fontWeight:700 }}>{val ? predikat(val) : "-"}</td>
                            <td style={{ padding:"7px 10px", color:"#555", fontSize:11 }}>{val ? keterangan(val) : "-"}</td>
                          </tr>
                        );
                      })}
                      <tr style={{ background:"#d1fae5", fontWeight:700 }}>
                        <td style={{ padding:"8px 10px" }}>RATA-RATA</td>
                        <td style={{ padding:"8px 10px", textAlign:"center", color:"#065f46" }}>{avg}</td>
                        <td style={{ padding:"8px 10px", textAlign:"center" }}>{predikat(avg)}</td>
                        <td style={{ padding:"8px 10px", color:"#065f46", fontSize:11 }}>{keterangan(avg)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* TTD */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginTop:24, paddingTop:16, borderTop:"1px solid #e0e0e0" }}>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:11, color:"#666" }}>Orang Tua / Wali</div>
                    <div style={{ height:60, borderBottom:"1px solid #ccc", marginTop:8, marginBottom:4 }}></div>
                    <div style={{ fontSize:11, color:"#aaa" }}>( _________________ )</div>
                  </div>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:11, color:"#666" }}>Kepala Sekolah</div>
                    <div style={{ height:60, borderBottom:"1px solid #ccc", marginTop:8, marginBottom:4 }}></div>
                    <div style={{ fontSize:11, color:"#aaa" }}>( Hasnal Labibah )</div>
                  </div>
                </div>

                <div style={{ textAlign:"center", marginTop:16, fontSize:10, color:"#bbb" }}>
                  Dicetak melalui Portal Pendidikan Bunayya Islamic School • {new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    );
  }

  // Laporan Performa Guru
  if (menu === "performa-guru") {
    const pgTeacherId = formData.pg_teacherId ?? (user?.role === "teacher" ? user.teacherId : "");
    const pgDari   = formData.pg_dari   ?? "";
    const pgSampai = formData.pg_sampai ?? "";
    const inPgRange = tgl => (!pgDari || tgl >= pgDari) && (!pgSampai || tgl <= pgSampai);

    const selectedTeacher = data.teachers.find(t => t.id === pgTeacherId);

    const pgAbsensi = data.teacherAttendance.filter(a => (!pgTeacherId || a.teacherId === pgTeacherId) && inPgRange(a.tanggal));
    const pgJurnal   = data.journals.filter(j => (!pgTeacherId || j.teacherId === pgTeacherId) && inPgRange(j.tanggal));
    const pgKegiatan = data.activities.filter(a => (!pgTeacherId || a.teacherId === pgTeacherId) && inPgRange(a.tanggal));
    const pgZiyadah  = data.ziyadah.filter(z => (!pgTeacherId || z.teacherId === pgTeacherId) && inPgRange(z.tanggal));
    const pgTarget   = data.targets.filter(t => (!pgTeacherId || t.teacherId === pgTeacherId) && inPgRange(t.tanggal));
    const pgNilai    = data.grades.filter(g => (!pgTeacherId || g.teacherId === pgTeacherId) && inPgRange(g.tanggal));
    const pgHarian   = data.dailyReports.filter(r => (!pgTeacherId || r.teacherId === pgTeacherId) && inPgRange(r.tanggal));

    const hadirCountPg = pgAbsensi.filter(a => a.status === "Hadir").length;
    const absPctPg = pgAbsensi.length > 0 ? Math.round((hadirCountPg / pgAbsensi.length) * 100) : 0;

    const attColorsPg = { Hadir: "#065f46", Sakit: "#92400e", Izin: "#1e40af", Alpa: "#991b1b" };
    const attBgPg     = { Hadir: "#d1fae5", Sakit: "#fef3c7", Izin: "#dbeafe", Alpa: "#fee2e2" };

    const PG_CHART_COLORS = {
      absensi:"#1d7a5f", jurnal:"#7c3aed", kegiatan:"#0891b2",
      ziyadah:"#059669", target:"#dc2626", nilai:"#9333ea", harian:"#d97706"
    };

    // ── Data: perbandingan antar guru (ketika "Semua Guru") — dibangun 1x pass, bukan per-guru ──
    const guruListPg = data.teachers;
    const countByTeacher = (arr, dateKey = "tanggal") => {
      const m = new Map();
      for (const it of arr) {
        if (!inPgRange(it[dateKey])) continue;
        m.set(it.teacherId, (m.get(it.teacherId) || 0) + 1);
      }
      return m;
    };
    const absensiRecMap = new Map();   // teacherId -> { total, hadir }
    for (const a of data.teacherAttendance) {
      if (!inPgRange(a.tanggal)) continue;
      const cur = absensiRecMap.get(a.teacherId) || { total: 0, hadir: 0 };
      cur.total++; if (a.status === "Hadir") cur.hadir++;
      absensiRecMap.set(a.teacherId, cur);
    }
    const jurnalMap   = countByTeacher(data.journals);
    const kegiatanMap = countByTeacher(data.activities);
    const ziyadahMap  = countByTeacher(data.ziyadah);
    const targetMap   = countByTeacher(data.targets);
    const nilaiMap     = countByTeacher(data.grades);
    const harianMap    = countByTeacher(data.dailyReports);

    const absensiPctPerGuru = guruListPg.map(t => {
      const rec = absensiRecMap.get(t.id);
      return { lbl: t.nama, val: rec && rec.total ? Math.round((rec.hadir/rec.total)*100) : 0 };
    });
    const jurnalPerGuruPg   = guruListPg.map(t => ({ lbl: t.nama, val: jurnalMap.get(t.id) || 0 }));
    const kegiatanPerGuruPg = guruListPg.map(t => ({ lbl: t.nama, val: kegiatanMap.get(t.id) || 0 }));
    const ziyadahPerGuruPg  = guruListPg.map(t => ({ lbl: t.nama, val: ziyadahMap.get(t.id) || 0 }));
    const targetPerGuruPg   = guruListPg.map(t => ({ lbl: t.nama, val: targetMap.get(t.id) || 0 }));
    const nilaiPerGuruPg    = guruListPg.map(t => ({ lbl: t.nama, val: nilaiMap.get(t.id) || 0 }));
    const harianPerGuruPg   = guruListPg.map(t => ({ lbl: t.nama, val: harianMap.get(t.id) || 0 }));

    // ── Data: tren per tanggal (ketika guru tertentu dipilih) — 1x pass ────
    const trenMap = new Map();
    const bumpTren = arr => { for (const it of arr) trenMap.set(it.tanggal, (trenMap.get(it.tanggal) || 0) + 1); };
    bumpTren(pgAbsensi); bumpTren(pgJurnal); bumpTren(pgKegiatan); bumpTren(pgZiyadah); bumpTren(pgTarget); bumpTren(pgNilai); bumpTren(pgHarian);
    const pgTrenPerTanggal = Array.from(trenMap.keys()).sort().map(tgl => ({ lbl: tgl, val: trenMap.get(tgl) }));

    return (
      <div>
        {/* Selector & Filter */}
        <div className="card mb-4">
          <div className="card-header" style={{ flexWrap:"wrap", gap:10 }}>
            <div>
              <div className="card-title">🏆 Laporan Performa Guru</div>
              <div className="card-sub">Rekap aktivitas &amp; kinerja guru di seluruh aplikasi</div>
            </div>
            <button id="btn-pdf-performa-guru" onClick={() => downloadTablePDF("performa-guru-capture", `Laporan Performa Guru — ${selectedTeacher?.nama || "Semua Guru"}`, `Performa-Guru-${(selectedTeacher?.nama || "Semua").replace(/ /g,"-")}`)}
              style={{ padding:"5px 12px", fontSize:12, fontWeight:700, background:"#dc2626", color:"white", border:"none", borderRadius:8, cursor:"pointer" }}>⬇️ PDF</button>
          </div>
          <div className="card-body">
            <div className="grid grid-2 mb-3" style={{ gap:12 }}>
              <div className="form-group" style={{ margin:0 }}>
                <label className="label">Pilih Guru</label>
                <div className="select-wrap"><select className="select" value={pgTeacherId} onChange={e => patchForm({ pg_teacherId: e.target.value })}>
                  <option value="">-- Semua Guru --</option>
                  {data.teachers.map(t => <option key={t.id} value={t.id}>{t.nama}</option>)}
                </select></div>
              </div>
              <div className="flex gap-2 items-end" style={{ flexWrap:"wrap", gap:8 }}>
                <div>
                  <label className="label" style={{ display:"block", marginBottom:4 }}>Dari</label>
                  <input type="date" className="input" style={{ width:140, fontSize:13, padding:"5px 8px" }} value={pgDari} onChange={e => patchForm({ pg_dari: e.target.value })} />
                </div>
                <div>
                  <label className="label" style={{ display:"block", marginBottom:4 }}>Sampai</label>
                  <input type="date" className="input" style={{ width:140, fontSize:13, padding:"5px 8px" }} value={pgSampai} onChange={e => patchForm({ pg_sampai: e.target.value })} />
                </div>
                <button onClick={() => patchForm({ pg_dari: todayStr, pg_sampai: todayStr })}
                  style={{ padding:"5px 10px", fontSize:12, fontWeight:700, background:"#e0f2fe", color:"#0369a1", border:"none", borderRadius:8, cursor:"pointer" }}>Hari Ini</button>
                <button onClick={() => patchForm({ pg_dari: "", pg_sampai: "" })}
                  style={{ padding:"5px 10px", fontSize:12, fontWeight:700, background:"#f1f5f9", color:"#475569", border:"none", borderRadius:8, cursor:"pointer" }}>Semua</button>
              </div>
            </div>
            {!pgTeacherId && (
              <div style={{ fontSize:12, color:"#92400e", background:"#fef3c7", borderRadius:8, padding:"8px 12px" }}>
                ℹ️ Belum memilih guru — menampilkan rekap gabungan seluruh guru. Pilih nama guru di atas untuk melihat performa individual.
              </div>
            )}
          </div>
        </div>

        <div id="performa-guru-capture">
          {/* Ringkasan */}
          <div className="card mb-4">
            <div className="card-header"><div className="card-title">📊 Ringkasan — {selectedTeacher ? selectedTeacher.nama : "Semua Guru"}</div></div>
            <div className="card-body">
              <div className="grid" style={{ gap:12, gridTemplateColumns:"repeat(7, 1fr)" }}>
                {[
                  { icon:"🗒️", label:"Kehadiran Mengajar", value: pgAbsensi.length ? `${absPctPg}%` : "-", bg:"#eff6ff", c:"#1e40af" },
                  { icon:"📝", label:"Jurnal Mengajar",     value: pgJurnal.length,   bg:"#f5f3ff", c:"#5b21b6" },
                  { icon:"🎯", label:"Lap. Kegiatan",       value: pgKegiatan.length, bg:"#ecfeff", c:"#0e7490" },
                  { icon:"📖", label:"Ziyadah Diinput",     value: pgZiyadah.length,  bg:"#ecfdf5", c:"#065f46" },
                  { icon:"🏆", label:"Target Diinput",      value: pgTarget.length,   bg:"#fee2e2", c:"#991b1b" },
                  { icon:"📊", label:"Nilai Diinput",       value: pgNilai.length,    bg:"#ede9fe", c:"#5b21b6" },
                  { icon:"📄", label:"Lap. Harian",         value: pgHarian.length,   bg:"#fef3c7", c:"#92400e" },
                ].map(s => (
                  <div key={s.label} style={{ background:s.bg, borderRadius:12, padding:"14px 8px", textAlign:"center" }}>
                    <div style={{ fontSize:20, marginBottom:4 }}>{s.icon}</div>
                    <div style={{ fontSize:19, fontWeight:800, color:s.c }}>{s.value}</div>
                    <div style={{ fontSize:10, color:s.c, opacity:.8, marginTop:2 }}>{s.label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Ringkasan Absensi (breakdown status) */}
          <div className="card mb-4">
            <div className="card-header"><div className="card-title">🗒️ Ringkasan Absensi Mengajar</div></div>
            <div className="card-body">
              {pgAbsensi.length === 0 ? <div className="empty-state">Belum ada data absensi pada rentang ini</div> : (
                <div className="flex gap-4" style={{ justifyContent:"center", flexWrap:"wrap" }}>
                  {STATUS_ABSENSI.map(st => {
                    const count = pgAbsensi.filter(a => a.status === st).length;
                    return (
                      <div key={st} style={{ textAlign:"center", padding:"12px 20px", background:attBgPg[st], borderRadius:12 }}>
                        <div style={{ fontSize:26, fontWeight:700, color:attColorsPg[st] }}>{count}</div>
                        <div style={{ fontSize:12, color:attColorsPg[st] }}>{st}</div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          {!pgTeacherId ? (
            /* ── Mode: Semua Guru → diagram perbandingan antar guru per kategori ── */
            <>
              <PGChartCard title="🗒️ Kehadiran Mengajar per Guru (%)" items={absensiPctPerGuru} color={PG_CHART_COLORS.absensi} />
              <PGChartCard title="📝 Jurnal Mengajar per Guru"        items={jurnalPerGuruPg}    color={PG_CHART_COLORS.jurnal} />
              <PGChartCard title="🎯 Laporan Kegiatan per Guru"       items={kegiatanPerGuruPg}  color={PG_CHART_COLORS.kegiatan} />
              <PGChartCard title="📖 Ziyadah Hafalan per Guru"        items={ziyadahPerGuruPg}   color={PG_CHART_COLORS.ziyadah} />
              <PGChartCard title="🏆 Target Pencapaian per Guru"      items={targetPerGuruPg}    color={PG_CHART_COLORS.target} />
              <PGChartCard title="📊 Rekap Nilai per Guru"            items={nilaiPerGuruPg}     color={PG_CHART_COLORS.nilai} />
              <PGChartCard title="📄 Laporan Harian per Guru"         items={harianPerGuruPg}    color={PG_CHART_COLORS.harian} />
            </>
          ) : (
            /* ── Mode: Guru terpilih → diagram tren jumlah laporan per tanggal ── */
            <PGChartCard title={`📈 Tren Aktivitas Laporan — ${selectedTeacher?.nama || ""}`} items={pgTrenPerTanggal} color={PG_CHART_COLORS.jurnal} type="line" />
          )}
        </div>

        {pgTeacherId && (
          <div style={{ fontSize:11, color:"#92400e", background:"#fef3c7", borderRadius:8, padding:"10px 14px", marginTop:8 }}>
            ℹ️ Data Kegiatan, Ziyadah, Target, Nilai, dan Laporan Harian yang diinput sebelum fitur pencatatan guru ini aktif belum tercatat nama gurunya, sehingga tidak muncul di rekap per-guru. Data baru akan otomatis tercatat sesuai guru yang login.
          </div>
        )}
      </div>
    );
  }

  // Inputan Harian Guru per Tanggal (format halaman per bulan)
  if (menu === "diagram-kepatuhan") {
    const MONTH_NAMES = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const dkKelas = formData.dk_kelas ?? "Semua";
    const dkGuruId = formData.dk_guruId ?? "";
    const dkBulan = formData.dk_bulan ?? String(new Date().getMonth());
    const dkTahun = formData.dk_tahun ?? new Date().getFullYear();

    const dkTeachers = data.teachers.filter(t =>
      (dkKelas === "Semua" || t.kelas === dkKelas) &&
      (!dkGuruId || t.id === dkGuruId)
    );

    // ── Set lookup O(1) — dibangun sekali per render, bukan per-sel tabel ──
    const mkSet = (arr, keyFn) => { const s = new Set(); for (const it of arr) s.add(keyFn(it)); return s; };
    const setAbsensiSiswaById    = mkSet(data.studentAttendance, a => a.teacherId + "|" + a.tanggal);
    const setAbsensiSiswaByKelas = mkSet(data.studentAttendance, a => a.kelas + "|" + a.tanggal);
    const setAbsensiGuru  = mkSet(data.teacherAttendance, a => a.teacherId + "|" + a.tanggal);
    const setJurnal       = mkSet(data.journals,          j => j.teacherId + "|" + j.tanggal);
    const setHarian       = mkSet(data.dailyReports,      r => r.teacherId + "|" + r.tanggal);
    const setNilai        = mkSet(data.grades,            g => g.teacherId + "|" + g.tanggal);
    const setKegiatan     = mkSet(data.activities,        a => a.teacherId + "|" + a.tanggal);
    const setTarget       = mkSet(data.targets,           x => x.teacherId + "|" + x.tanggal);
    const setZiyadah      = mkSet(data.ziyadah,            z => z.teacherId + "|" + z.tanggal);

    const DK_CATEGORIES = [
      { key: "absensiSiswa",     label: "ABSENSI SISWA",    check: (t, tgl) => setAbsensiSiswaById.has(t.id + "|" + tgl) || setAbsensiSiswaByKelas.has(t.kelas + "|" + tgl) },
      { key: "absensiGuru",      label: "ABSENSI GURU",     check: (t, tgl) => setAbsensiGuru.has(t.id + "|" + tgl) },
      { key: "jurnalGuru",       label: "JURNAL GURU",      check: (t, tgl) => setJurnal.has(t.id + "|" + tgl) },
      { key: "laporanHarian",    label: "LAPORAN HARIAN",   check: (t, tgl) => setHarian.has(t.id + "|" + tgl) },
      { key: "rekapNilai",       label: "REKAP NILAI",      check: (t, tgl) => setNilai.has(t.id + "|" + tgl) },
      { key: "laporanKegiatan",  label: "LAPORAN KEGIATAN", check: (t, tgl) => setKegiatan.has(t.id + "|" + tgl) },
      { key: "targetPencapaian", label: "TARGET PENCAPAI",  check: (t, tgl) => setTarget.has(t.id + "|" + tgl) },
      { key: "ziyadah",          label: "ZIYADAH",          check: (t, tgl) => setZiyadah.has(t.id + "|" + tgl) },
    ];

    const pad2 = n => String(n).padStart(2, "0");
    const daysInMonth = (y, mIdx) => new Date(y, mIdx + 1, 0).getDate();
    const monthsToRender = dkBulan === "" ? MONTH_NAMES.map((_, i) => i) : [parseInt(dkBulan, 10)];

    const thStyle = { border:"1.5px solid #111", padding:"5px 4px", fontSize:9, fontWeight:800, textAlign:"center", background:"#fff", color:"#111", lineHeight:1.15 };
    const tdNameStyle = { border:"1.5px solid #111", padding:"4px 6px", fontSize:10, fontWeight:700, color:"#5b21b6", background:"#fff", whiteSpace:"nowrap" };
    const tdCountStyle = { border:"1.5px solid #111", padding:"4px 6px", fontSize:10, fontWeight:800, color:"#111", background:"#fff", textAlign:"center" };
    const tdCellStyle = filled => ({ border:"1.5px solid #111", padding:"4px 6px", background: filled ? "#16a34a" : "#dc2626" });

    // Susun tabel per tanggal, dipasangkan 2 tanggal per baris/layar
    const renderDateTable = (mIdx, day) => {
      const tgl = `${dkTahun}-${pad2(mIdx + 1)}-${pad2(day)}`;
      return (
        <div key={tgl} className="card" style={{ flex:"1 1 0", minWidth:0 }}>
          <div className="card-header" style={{ padding:"8px 12px" }}>
            <div className="card-title" style={{ fontSize:13 }}>{MONTH_NAMES[mIdx].toUpperCase()} — TANGGAL {day}</div>
          </div>
          <div className="card-body" style={{ overflowX:"auto", padding:10 }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead>
                <tr>
                  <th style={thStyle}>NAMA</th>
                  <th style={thStyle}>JUMLAH<br/>ISI FORM</th>
                  {DK_CATEGORIES.map(c => <th key={c.key} style={thStyle}>{c.label}</th>)}
                </tr>
              </thead>
              <tbody>
                {dkTeachers.map(t => {
                  const flags = DK_CATEGORIES.map(c => c.check(t, tgl));
                  const jumlahIsi = flags.filter(Boolean).length;
                  return (
                    <tr key={t.id}>
                      <td style={tdNameStyle}>{t.nama}</td>
                      <td style={tdCountStyle}>{jumlahIsi}</td>
                      {DK_CATEGORIES.map((c, i) => (
                        <td key={c.key} style={tdCellStyle(flags[i])}></td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    return (
      <div>
        {/* Filter */}
        <div className="card mb-4">
          <div className="card-header" style={{ flexWrap:"wrap", gap:10 }}>
            <div>
              <div className="card-title">📅 Inputan Harian Guru per Tanggal</div>
              <div className="card-sub">Hijau = sudah mengisi form, Merah = belum mengisi form. Kolom "Jumlah Isi Form" menunjukkan total kategori yang terisi. 2 tanggal ditampilkan berdampingan per layar/halaman.</div>
            </div>
            {dkBulan !== "" && (
              <button id="btn-pdf-dk" onClick={() => downloadTablePDF("dk-capture", `Inputan Harian Guru — ${MONTH_NAMES[parseInt(dkBulan,10)]} ${dkTahun}`, `Kepatuhan-Guru-${MONTH_NAMES[parseInt(dkBulan,10)]}-${dkTahun}`)}
                style={{ padding:"5px 12px", fontSize:12, fontWeight:700, background:"#dc2626", color:"white", border:"none", borderRadius:8, cursor:"pointer" }}>⬇️ PDF</button>
            )}
          </div>
          <div className="card-body">
            <div className="grid grid-3" style={{ gap:12 }}>
              <div className="form-group" style={{ margin:0 }}>
                <label className="label">Kelas</label>
                <div className="select-wrap"><select className="select" value={dkKelas} onChange={e => patchForm({ dk_kelas: e.target.value })}>
                  {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                </select></div>
              </div>
              <div className="form-group" style={{ margin:0 }}>
                <label className="label">Nama Guru</label>
                <div className="select-wrap"><select className="select" value={dkGuruId} onChange={e => patchForm({ dk_guruId: e.target.value })}>
                  <option value="">Semua Nama</option>
                  {data.teachers.map(t => <option key={t.id} value={t.id}>{t.nama}</option>)}
                </select></div>
              </div>
              <div className="form-group" style={{ margin:0 }}>
                <label className="label">Bulan</label>
                <div className="select-wrap"><select className="select" value={dkBulan} onChange={e => patchForm({ dk_bulan: e.target.value })}>
                  {MONTH_NAMES.map((m, i) => <option key={m} value={i}>{m}</option>)}
                  <option value="">Semua</option>
                </select></div>
              </div>
            </div>
            {dkBulan === "" && (
              <div style={{ fontSize:12, color:"#92400e", background:"#fef3c7", borderRadius:8, padding:"8px 12px", marginTop:12 }}>
                ℹ️ Menampilkan seluruh bulan dalam {dkTahun} — daftar bisa sangat panjang. Pilih satu bulan untuk tampilan lebih ringkas atau untuk export PDF.
              </div>
            )}
          </div>
        </div>

        {dkTeachers.length === 0 ? (
          <div className="card"><div className="card-body"><div className="empty-state">Tidak ada guru yang cocok dengan filter ini</div></div></div>
        ) : (
          <div id="dk-capture">
            {monthsToRender.map(mIdx => {
              const nDays = daysInMonth(dkTahun, mIdx);
              return (
                <div key={mIdx}>
                  {dkBulan === "" && (
                    <div style={{ fontSize:16, fontWeight:800, color:"#111", margin:"20px 0 10px" }}>{MONTH_NAMES[mIdx]} {dkTahun}</div>
                  )}
                  {(() => {
                    const days = Array.from({ length: nDays }, (_, i) => i + 1);
                    const pairs = [];
                    for (let i = 0; i < days.length; i += 2) pairs.push(days.slice(i, i + 2));
                    return pairs.map(pair => (
                      <div key={pair[0]} className="mb-4" style={{ display:"flex", gap:12, pageBreakAfter:"always" }}>
                        {pair.map(day => renderDateTable(mIdx, day))}
                      </div>
                    ));
                  })()}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // Master Guru
  if (menu === "master-guru") {
    const openAddGuru = () => patchForm({ showGuruDialog: true, editGuruId: null, newGuruNip: "", newGuruNama: "", newGuruEmail: "", newGuruKelas: "", newGuruStatus: "Aktif" });
    const openEditGuru = (t) => patchForm({ showGuruDialog: true, editGuruId: t.id, newGuruNip: t.nip, newGuruNama: t.nama, newGuruEmail: t.email, newGuruKelas: t.kelas, newGuruStatus: t.status });
    const saveGuru = () => {
      if (!formData.newGuruNip || !formData.newGuruNama) { alert("NIP dan Nama wajib diisi!"); return; }
      if (formData.editGuruId) {
        const editId = formData.editGuruId;
        const updated = { ...data.teachers.find(t => t.id === editId), nip: formData.newGuruNip, nama: formData.newGuruNama, email: formData.newGuruEmail, kelas: formData.newGuruKelas, status: formData.newGuruStatus };
        setData(d => {
          const next = { ...d, teachers: d.teachers.map(t => t.id === editId ? updated : t) };
          persistDataAsync(next);
          return next;
        });
        writeDoc("teachers", updated);
      } else {
        const rec = { id: genId(), nip: formData.newGuruNip, nama: formData.newGuruNama, email: formData.newGuruEmail, kelas: formData.newGuruKelas, status: formData.newGuruStatus || "Aktif" };
        setData(d => {
          const next = { ...d, teachers: [...d.teachers, rec] };
          persistDataAsync(next);
          return next;
        });
        writeDoc("teachers", rec);
      }
      patchForm({ showGuruDialog: false });
    };
    return (
      <div>
        <div className="card">
          <div className="card-header">
            <div className="card-title">📚 Master Data Guru</div>
            <div className="flex gap-2">
              <button className="btn btn-outline btn-sm"><Icon.Download /> Export</button>
              <button className="btn btn-primary btn-sm" onClick={openAddGuru}><Icon.Plus /> Tambah Guru</button>
            </div>
          </div>
          <div className="card-body">
            <div className="table-wrap">
              <table>
                <thead><tr><th>NIP</th><th>Nama</th><th>Email</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody>
                  {data.teachers.length === 0 ? <tr><td colSpan={6} className="empty-state">Belum ada data guru</td></tr> : data.teachers.map(t => (
                    <tr key={t.id}>
                      <td className="text-sm">{t.nip}</td>
                      <td style={{fontWeight:600}}>{t.nama}</td>
                      <td className="text-sm text-muted">{t.email}</td>
                      <td><Badge variant="blue">{t.kelas}</Badge></td>
                      <td><StatusBadge status={t.status} /></td>
                      <td>
                        <div className="flex gap-2">
                          <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditGuru(t)}><Icon.Edit /></button>
                          <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("teachers", t.id, t.nama)}><Icon.Trash /></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        {formData.showGuruDialog && (
          <Dialog open title={formData.editGuruId ? "✏️ Edit Data Guru" : "➕ Tambah Guru Baru"} onClose={() => patchForm({ showGuruDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showGuruDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveGuru}><Icon.Save /> {formData.editGuruId ? "Simpan Perubahan" : "Tambah Guru"}</button></>}>
            <div className="form-group">
              <label className="label">NIP *</label>
              <input className="input" placeholder="Nomor Induk Pegawai" value={formData.newGuruNip || ""} onChange={e => patchForm({ newGuruNip: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="label">Nama Lengkap *</label>
              <input className="input" placeholder="Nama lengkap guru" value={formData.newGuruNama || ""} onChange={e => patchForm({ newGuruNama: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="label">Email</label>
              <input className="input" type="email" placeholder="email@bunayya.sch.id" value={formData.newGuruEmail || ""} onChange={e => patchForm({ newGuruEmail: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="label">Kelas Pengampu</label>
              <div className="select-wrap"><select className="select" value={formData.newGuruKelas || ""} onChange={e => patchForm({ newGuruKelas: e.target.value })}>
                <option value="">-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Status</label>
              <div className="select-wrap"><select className="select" value={formData.newGuruStatus || "Aktif"} onChange={e => patchForm({ newGuruStatus: e.target.value })}>
                <option value="Aktif">Aktif</option>
                <option value="Nonaktif">Nonaktif</option>
              </select></div>
            </div>
          </Dialog>
        )}
      </div>
    );
  }

  // Pintasan & Pengumuman
  if (menu === "kelola-pintasan") {
    // Kompres gambar ke max 400px, kualitas 0.7 agar muat di Firestore (<1MB)
    const compressImage = (file, maxW = 400, quality = 0.7) => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width  = img.width  * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    const openAddLink = () => patchForm({ showLinkDialog: true, editLinkId: null, newLinkTitle: "", newLinkUrl: "", newLinkIcon: "🔗" });
    const openEditLink = (l) => patchForm({ showLinkDialog: true, editLinkId: l.id, newLinkTitle: l.title, newLinkUrl: l.url, newLinkIcon: l.icon });
    const saveLink = () => {
      if (!formData.newLinkTitle) { alert("Judul link wajib diisi!"); return; }
      if (formData.editLinkId) {
        const editId = formData.editLinkId;
        const updated = {
          ...data.quickLinks.find(l => l.id === editId),
          title: formData.newLinkTitle,
          url:   formData.newLinkUrl || "#",
          icon:  formData.newLinkIcon || "🔗"
        };
        setData(d => {
          const next = { ...d, quickLinks: d.quickLinks.map(l => l.id === editId ? updated : l) };
          persistDataAsync(next);
          return next;
        });
        writeDoc("quickLinks", updated);
      } else {
        const rec = { id: genId(), title: formData.newLinkTitle, url: formData.newLinkUrl || "#", icon: formData.newLinkIcon || "🔗" };
        setData(d => {
          const next = { ...d, quickLinks: [...d.quickLinks, rec] };
          persistDataAsync(next);
          return next;
        });
        writeDoc("quickLinks", rec);
      }
      patchForm({ showLinkDialog: false });
    };
    const openAddAnn = () => patchForm({ showAnnDialog: true, editAnnId: null, newAnnJudul: "", newAnnDeskripsi: "", newAnnIcon: "📢" });
    const openEditAnn = (a) => patchForm({ showAnnDialog: true, editAnnId: a.id, newAnnJudul: a.judul, newAnnDeskripsi: a.deskripsi, newAnnIcon: a.icon });
    const saveAnn = () => {
      if (!formData.newAnnJudul) { alert("Judul pengumuman wajib diisi!"); return; }
      if (formData.editAnnId) {
        const editId = formData.editAnnId;
        const updated = { ...data.announcements.find(a => a.id === editId), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: d.announcements.map(a => a.id === editId ? updated : a) };
          persistDataAsync(next);
          return next;
        });
        writeDoc("announcements", updated);
      } else {
        const rec = { id: genId(), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: [...d.announcements, rec] };
          persistDataAsync(next);
          return next;
        });
        writeDoc("announcements", rec);
      }
      patchForm({ showAnnDialog: false });
    };
    const ICON_OPTS = ["🔗","📋","💰","❤️","📢","🏫","📖","🎓","✏️","🗓️","📌","⭐","🔔","📣","📝","🏆","🌙","👍","🕌","🌟","📱","💻","🎯","🌿"];
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
        {/* Link Cepat */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🔗 Link Cepat</div>
            <button className="btn btn-primary btn-sm" onClick={openAddLink}><Icon.Plus /> Tambah Link</button>
          </div>
          <div className="card-body">
            {data.quickLinks.length === 0 ? <div className="empty-state">Belum ada link cepat</div> : (
              <div className="row-list">
                {data.quickLinks.map(l => (
                  <div key={l.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{l.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{l.title}</div>
                        <div className="text-xs text-muted">{l.url}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" title="Buka Link" onClick={() => window.open(l.url, "_blank")}>🔗</button>
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditLink(l)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("quickLinks", l.id, l.title)}><Icon.Trash /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Pengumuman */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">📢 Pengumuman</div>
            <button className="btn btn-primary btn-sm" onClick={openAddAnn}><Icon.Plus /> Tambah Pengumuman</button>
          </div>
          <div className="card-body">
            {data.announcements.length === 0 ? <div className="empty-state">Belum ada pengumuman</div> : (
              <div className="row-list">
                {data.announcements.map(a => (
                  <div key={a.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{a.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{a.judul}</div>
                        <div className="text-xs text-muted">{a.deskripsi}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditAnn(a)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("announcements", a.id, a.judul)}><Icon.Trash /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Dialog Link */}
        {formData.showLinkDialog && (
          <Dialog open title={formData.editLinkId ? "✏️ Edit Link Cepat" : "➕ Tambah Link Cepat"} onClose={() => patchForm({ showLinkDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showLinkDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveLink}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Pilih Ikon</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:4 }}>
                {ICON_OPTS.map(ic => <button key={ic} onClick={() => patchForm({ newLinkIcon: ic })} style={{ width:38, height:38, fontSize:20, border: formData.newLinkIcon===ic ? "2px solid #27ae60":"1.5px solid #e8e8e8", borderRadius:10, cursor:"pointer", background: formData.newLinkIcon===ic ? "#e8f5e9":"#f8f9fa" }}>{ic}</button>)}

    const saveMapel = () => {
      if (!formData.newMapelNama) { alert("Nama mapel wajib diisi!"); return; }
      if (formData.editMapelId) {
        const editId = formData.editMapelId;
        const updated = { ...data.subjects.find(s => s.id === editId), name: formData.newMapelNama };
        setData(d => {
          const next = { ...d, subjects: d.subjects.map(s => s.id === editId ? updated : s) };
          persistDataAsync(next);
          return next;
        });
        writeDoc("subjects", updated);
      } else {
        const rec = { id: genId(), name: formData.newMapelNama };
        setData(d => {
          const next = { ...d, subjects: [...d.subjects, rec] };
          persistDataAsync(next);
          return next;
        });
        writeDoc("subjects", rec);
      }
      patchForm({ showMapelDialog: false });

      <div>

            <div className="card-title">📖 Pengaturan Mata Pelajaran</div>
            <button className="btn btn-primary btn-sm" onClick={openAddMapel}><Icon.Plus /> Tambah Mapel</button>

                    <button onClick={() => deleteItem("subjects", s.id, s.name)} style={{ background:"#fee2e2", border:"none", cursor:"pointer", color:"#c0392b", borderRadius:6, padding:"3px 6px", fontSize:12, display:"flex", alignItems:"center" }}><Icon.Trash /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {formData.showMapelDialog && (
          <Dialog open title={formData.editMapelId ? "✏️ Edit Mata Pelajaran" : "➕ Tambah Mata Pelajaran"} onClose={() => patchForm({ showMapelDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showMapelDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveMapel}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Nama Mata Pelajaran *</label>
              <input className="input" placeholder="Contoh: Al-Qur'an, Matematika..." value={formData.newMapelNama || ""} onChange={e => patchForm({ newMapelNama: e.target.value })} onKeyDown={e => e.key === "Enter" && saveMapel()} />
            </div>
          </Dialog>
        )}
      </div>
    );
  }

  return null;
}

// ─── Tombol Download JPG (capture elemen ke gambar) ────────────────────────
function DownloadJpgButton({ elementId, filename, label = "Download JPG" }) {
  const [downloading, setDownloading] = React.useState(false);
  const handleDownload = () => {
    const el = document.getElementById(elementId);
    if (!el) { alert("Konten belum siap, coba lagi."); return; }
    if (typeof html2canvas === "undefined") { alert("Library belum siap, tunggu sebentar lalu coba lagi."); return; }
    setDownloading(true);
    html2canvas(el, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#ffffff",
      logging: false,
      onclone: (doc) => {
        const cloneEl = doc.getElementById(elementId);
        if (cloneEl) cloneEl.style.display = "block";
      }
    }).then(canvas => {
      const link = document.createElement("a");
      link.download = filename;
      link.href = canvas.toDataURL("image/jpeg", 0.95);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setDownloading(false);
    }).catch(err => {
      console.error("Download error:", err);
      alert("Gagal download: " + err.message);
      setDownloading(false);
    });
  };
  return (
    <button onClick={handleDownload} disabled={downloading}
      style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 16px", fontSize: 13, fontWeight: 700, background: downloading ? "#aaa" : "#1d7a5f", color: "white", border: "none", borderRadius: 10, cursor: downloading ? "not-allowed" : "pointer", transition: "all .2s" }}>
      {downloading ? <><span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>⟳</span> Memproses...</> : <>⬇️ {label}</>}
    </button>
  );
}

      })()}

      {menu === "target" && (() => {
        const targetMode  = formData.wali_target_mode  ?? "2bulan";
        const targetBulan = formData.wali_target_bulan ?? currentMonthStr;
        const fTarget = studentTargetsAll.filter(t => filterByDateMode(t.tanggal, targetMode, targetBulan, todayStr));
        return (
        <div>
          <div className="card mb-4">
            <div className="card-header" style={{ flexWrap: "wrap", gap: 10 }}>
              <div className="card-title">📅 Bulan</div>
              <WaliBulanFilter
                mode={targetMode}
                bulan={targetBulan}
                onModeChange={m => patchForm({ wali_target_mode: m })}
                onBulanChange={b => patchForm({ wali_target_bulan: b })}
              />
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
            <DownloadJpgButton elementId="wali-capture-target" filename={`rekap-target-${(studentData?.nama || "siswa").replace(/ /g, "-")}-${todayStr}.jpg`} />
          </div>
          <div id="wali-capture-target" className="card" style={{ padding: 0 }}>
            <div className="card-header"><div className="card-title">🏆 Target Pencapaian</div></div>
            <div className="card-body">
              {fTarget.length === 0 ? <div className="empty-state">Tidak ada target</div> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  {fTarget.map(t => (
                    <div key={t.id} style={{ background: "#f8fafc", borderRadius: 12, padding: 16 }}>
                      <div className="flex justify-between items-center mb-2">
                        <div style={{ fontWeight: 700 }}>{t.mataPelajaran}</div>
                        <Badge variant="outline">{t.progressSaatIni}/{t.progressTotal} {t.satuan}</Badge>
                      </div>
                      <ProgressBar value={(t.progressSaatIni / t.progressTotal) * 100} />
                      <div className="flex justify-between mt-2">
                        <StatusBadge status={t.hasil} />
                        <span className="text-xs text-muted">{t.tanggal}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
        );
      })()}

      {menu === "hafalan" && (() => {
        const hafalanMode  = formData.wali_hafalan_mode  ?? "2bulan";
        const hafalanBulan = formData.wali_hafalan_bulan ?? currentMonthStr;
        const fHafalan = studentZiyadahAll.filter(z => filterByDateMode(z.tanggal, hafalanMode, hafalanBulan, todayStr));
        return (
        <div>
          <div className="card mb-4">
            <div className="card-header" style={{ flexWrap: "wrap", gap: 10 }}>
              <div className="card-title">📅 Bulan</div>
              <WaliBulanFilter
                mode={hafalanMode}
                bulan={hafalanBulan}
                onModeChange={m => patchForm({ wali_hafalan_mode: m })}
                onBulanChange={b => patchForm({ wali_hafalan_bulan: b })}
              />
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
            <DownloadJpgButton elementId="wali-capture-hafalan" filename={`rekap-hafalan-${(studentData?.nama || "siswa").replace(/ /g, "-")}-${todayStr}.jpg`} />
          </div>
          <div id="wali-capture-hafalan" className="card" style={{ padding: 0 }}>
            <div className="card-header"><div className="card-title">📖 Surat yang Dihafal</div></div>
            <div className="card-body">
              {fHafalan.length === 0 ? <div className="empty-state">Tidak ada hafalan</div> : (
                <div className="row-list">
                  {fHafalan.map(z => (
                    <div key={z.id} className="row-item">
                      <div><div style={{ fontWeight: 600 }}>{z.surat}</div><div className="text-sm text-muted">{z.juz} — {z.tanggal}</div>{z.progress && <div className="text-xs text-muted">{z.progress}</div>}</div>
                      <StatusBadge status={z.hasil} />
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
        );
      })()}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
    var loadEl = document.getElementById("app-loading");
    if (loadEl) loadEl.style.display = "none";
  </script>
</body>
