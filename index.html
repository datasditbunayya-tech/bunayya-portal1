    /* ─── BUAT ICON 512x512 via Canvas (logo di atas bg putih) ──────── */
    function makeIconBlob(cb) {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement("canvas");
        c.width = c.height = 512;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 512, 512);
        // Gambar logo bulat di tengah
        var pad = 20;
        ctx.save();
        ctx.beginPath();
        ctx.arc(256, 256, 256 - pad, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, pad, pad, 512 - pad*2, 512 - pad*2);
        ctx.restore();
        c.toBlob(function(blob) { cb(URL.createObjectURL(blob), c.toDataURL("image/png")); }, "image/png");
      };
      img.onerror = function() { cb(LOGO, LOGO); };
      img.src = LOGO;
    }

    /* ─── MANIFEST + APPLE ICON ──────────────────────────────────────── */
    function registerManifest(iconUrl) {
      var manifest = {
        name: "Bunayya Abata",
        short_name: "Bunayya",
        description: "Portal Manajemen Pendidikan Bunayya Islamic School",
        start_url: location.href,
        display: "standalone",
        background_color: "#f5c800",
        theme_color: "#1d7a5f",
        orientation: "portrait-primary",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      var mb = new Blob([JSON.stringify(manifest)], {type:"application/json"});
      var ml = document.createElement("link");
      ml.rel = "manifest"; ml.href = URL.createObjectURL(mb);
      document.head.appendChild(ml);

      // Apple touch icon
      var al = document.createElement("link");
      al.rel = "apple-touch-icon"; al.href = iconUrl;
      document.head.appendChild(al);

      console.log("✅ Manifest registered with logo icon");
    }

    // Jalankan: buat icon dulu, lalu register manifest
    window.addEventListener("load", function () {
      setTimeout(function () {
        makeIconBlob(function(blobUrl) { registerManifest(blobUrl); });
      }, 300);
    });

        '    e.respondWith(fetch(e.request).catch(function(){return new Response("")}));',
        '  }',
        '});'
      ].join("\n");
      try {

    /* ─── FAB ────────────────────────────────────────────────────────── */
    function showFAB() {
      if (document.getElementById("_pwa_fab")) return;
      var fab = document.createElement("button");

      fab.style.cssText = [

        "background:#fff;cursor:pointer;overflow:hidden;",

        "animation:_pwa_pulse 2.5s ease-in-out infinite;"
      ].join("");
      fab.innerHTML = "<img src='" + LOGO + "' style='width:100%;height:100%;object-fit:cover;border-radius:50%;'>";
      fab.onclick = function() { doInstall(); };
      document.body.appendChild(fab);
    }

    /* ─── INSTALL ────────────────────────────────────────────────────── */
    function doInstall() {
      if (_prompt) {
        _prompt.prompt();
        _prompt.userChoice.then(function(r) {
          if (r.outcome === "accepted") removeInstallUI();
          _prompt = null;
        });
      } else {
        var ov = document.getElementById("_pwa_overlay");
        if (ov) ov.remove();
        showOverlay();
      }
    }

    /* ─── EVENTS ─────────────────────────────────────────────────────── */
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      _prompt = e;
      console.log("✅ beforeinstallprompt ready");
      var ov = document.getElementById("_pwa_overlay");
      if (ov) { ov.remove(); showOverlay(); }
      else { showOverlay(); }
    });

    window.addEventListener("appinstalled", function() {
      removeInstallUI();
      console.log("✅ PWA installed!");
    });

    window.__showPwaOverlay = showOverlay;
    window._pwaInstall = doInstall;

    window.addEventListener("load", function() {
      setTimeout(function() {
        showOverlay();
        setTimeout(showFAB, 500);
      }, 1500);
    });

  })();

  .app { min-height: 100vh; background: var(--sand); }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--emerald-dark) 0%, var(--emerald) 60%, var(--emerald-light) 100%);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.25);
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.25);
  }
  .header-title { font-family: 'Amiri', serif; font-size: 20px; color: white; font-weight: 700; }

  .header-user { display: flex; align-items: center; gap: 12px; }

  .header-user-name { font-size: 13px; font-weight: 600; color: white; }
  .header-user-role { font-size: 11px; color: rgba(255,255,255,0.7); text-transform: capitalize; }
  .btn-logout {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    color: white;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.25); }

  /* ── PORTAL TABS ── */
  .portal-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--sand-dark);
    padding: 0 24px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    position: sticky;
    top: 64px;
    z-index: 90;
  }
  .portal-tab {
    padding: 14px 20px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-muted);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all .2s;
  }
  .portal-tab:hover { color: var(--ink); }
  .portal-tab.active-guru { color: var(--emerald); border-color: var(--emerald); }
  .portal-tab.active-siswa { color: var(--blue); border-color: var(--blue); }
  .portal-tab.active-wali { color: var(--purple); border-color: var(--purple); }

  /* ── MENU BAR ── */
  .menu-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--sand-dark);
    padding: 0 24px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .menu-btn {
    padding: 11px 16px;
    font-size: 12.5px;
    font-weight: 500;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all .2s;
    border-radius: 6px 6px 0 0;
  }
  .menu-btn:hover { color: var(--ink); background: var(--sand); }
  .menu-btn.active { background: var(--sand); color: var(--emerald); border-color: var(--emerald); }
  .menu-btn.active-blue { background: var(--sand); color: var(--blue); border-color: var(--blue); }
  .menu-btn.active-purple { background: var(--sand); color: var(--purple); border-color: var(--purple); }

  /* ── LAYOUT ── */
  .content { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; gap: 20px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .grid-5 { grid-template-columns: repeat(5, 1fr); }
  .grid-8 { grid-template-columns: repeat(8, 1fr); }
  @media(max-width:1024px) { .grid-8 { grid-template-columns: repeat(4,1fr); } .grid-4 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } }
  @media(max-width:640px) { .grid-2,.grid-3,.grid-4,.grid-5,.grid-8 { grid-template-columns: 1fr 1fr; } }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--sand-dark);
    overflow: hidden;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--sand-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .card-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .card-body { padding: 20px 24px; }

  /* ── STATS CARD ── */
  .stat-card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--sand-dark);
    padding: 20px;
    text-align: center;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    transition: transform .2s, box-shadow .2s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .stat-icon { font-size: 28px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--ink); }
  .stat-label { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }

  /* ── FORM ── */
  .form-group { margin-bottom: 16px; }
  .label { font-size: 12px; font-weight: 600; color: var(--ink-light); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: .5px; }
  .input, .select, .textarea {
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    border: 1.5px solid var(--sand-dark);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
    appearance: none;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(29,122,95,.1); }
  .textarea { resize: vertical; min-height: 80px; }
  .select-wrap { position: relative; }
  .select-wrap::after { content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-muted); font-size: 12px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    font-family: inherit;
    transition: background-color .1s ease, border-color .1s ease, color .1s ease, box-shadow .1s ease, transform .08s ease;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn-primary { background: var(--emerald); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--emerald-dark); }
  .btn-blue { background: var(--blue); color: white; }
  .btn-blue:hover:not(:disabled) { background: #1e4d8a; }
  .btn-purple { background: var(--purple); color: white; }
  .btn-purple:hover:not(:disabled) { background: #4e2d75; }
  .btn-gold { background: var(--gold); color: white; }
  .btn-gold:hover:not(:disabled) { background: #a6793a; }
  .btn-outline { background: none; border: 1.5px solid var(--sand-dark); color: var(--ink); }
  .btn-outline:hover:not(:disabled) { border-color: var(--emerald); color: var(--emerald); }
  .btn-ghost { background: none; color: var(--ink-muted); padding: 6px 10px; border-radius: 8px; }
  .btn-ghost:hover { background: var(--sand); color: var(--ink); }
  .btn-danger { background: var(--red); color: white; padding: 6px 10px; }
  .btn-danger:hover:not(:disabled) { background: #a0281f; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon { padding: 6px; }
  button, .select, .input, .textarea { touch-action: manipulation; }

  /* ── BADGE ── */
  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; font-size: 11px; font-weight: 600;
    border-radius: 20px;
  }
  .badge-green { background: #d1fae5; color: #065f46; }
  .badge-yellow { background: #fef3c7; color: #92400e; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f3f4f6; color: #374151; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-gold { background: #fef9c3; color: #a16207; }
  .badge-outline { background: none; border: 1px solid var(--sand-dark); color: var(--ink-muted); }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 11px 14px; font-size: 11px; font-weight: 700; text-align: left; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-muted); background: var(--sand); border-bottom: 1px solid var(--sand-dark); }
  td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--sand-dark); color: var(--ink); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(240,237,232,.5); }

  /* ── PROGRESS ── */
  .progress-bar-wrap { background: var(--sand-dark); border-radius: 99px; height: 8px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 99px; background: var(--emerald); transition: width .4s ease; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  if (!el) {
    alert("Tabel tidak ditemukan.");
    return;
  }
  const btn = document.getElementById("btn-pdf-" + tableId);
  if (btn) {

  }

    tries = tries || 0;

    const jpdf = typeof window.jspdf !== "undefined" || typeof jspdf !== "undefined";
    if (h2c && jpdf) return cb();

      alert("Library PDF belum siap. Pastikan koneksi internet aktif lalu refresh halaman.");
      if (btn) {
        btn.disabled = false;
        btn.textContent = "⬇️ PDF";
      }
      return;
    }
    setTimeout(() => waitReady(cb, tries + 1), 200);
  };

    html2canvas(el, {

      useCORS: true,

      logging: false
    }).then(canvas => {
      const jsPDFLib = (window.jspdf || jspdf).jsPDF;
      const imgW = canvas.width;
      const imgH = canvas.height;
      const isLandscape = imgW > imgH;
      const pdf = new jsPDFLib({
        orientation: isLandscape ? "landscape" : "portrait",
        unit: "mm",
        format: "a4"
      });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const usableW = pageW - margin * 2;
      const scale = usableW / (imgW / 2);
      const imgHmm = imgH / 2 * scale;
      pdf.setFontSize(13);
      pdf.setFont("helvetica", "bold");
      pdf.text("BUNAYYA ISLAMIC SCHOOL", pageW / 2, margin + 4, {
        align: "center"
      });
      pdf.setFontSize(10);
      pdf.setFont("helvetica", "normal");
      pdf.text(judul, pageW / 2, margin + 9, {
        align: "center"
      });
      pdf.setFontSize(8);
      pdf.text("Dicetak: " + new Date().toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric"
      }), pageW / 2, margin + 13, {
        align: "center"
      });
      const startY = margin + 16;
      pdf.setDrawColor(29, 122, 95);
      pdf.setLineWidth(0.5);
      pdf.line(margin, startY, pageW - margin, startY);
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      let y = startY + 3;
      const maxH = pageH - y - margin;
      if (imgHmm <= maxH) {
        pdf.addImage(imgData, "JPEG", margin, y, usableW, imgHmm);
      } else {
        let srcY = 0;

          sliceCanvas.width = imgW;

            pdf.addPage();
            y = margin;
          }

      if (btn) {
        btn.disabled = false;
        btn.textContent = "⬇️ PDF";
      }

      return Promise.reject(new Error("Firebase belum siap / belum terhubung"));
    }
    return window.__firebase.db.collection(fbColl).doc(String(item.id)).set(item).then(() => {
      setSyncStatus("success");
      setSyncMsg("✅ Tersimpan");
      setTimeout(() => {
        setSyncStatus("idle");
        setSyncMsg("");
      }, 1500);
    }).catch(err => {
      console.error("writeDoc error:", err);
      setSyncStatus("error");
      setSyncMsg("❌ Gagal simpan: " + err.message);
      setTimeout(() => {
        setSyncStatus("idle");
        setSyncMsg("");
      }, 5000);
      throw err;
    });
  };
  const writeDocs = (collKey, items) => {
    const fbColl = FB_COLLECTIONS[collKey];
    if (!fbColl || !items.length) return;
    if (!window.__firebase?.ready) {
      setSyncStatus("error");
      setSyncMsg("❌ Gagal simpan: Firebase belum terhubung. Periksa internet lalu coba lagi.");
      setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 5000);
      return;
    }
    const {
      db
    } = window.__firebase;
    const batch = db.batch();
    items.forEach(item => batch.set(db.collection(fbColl).doc(String(item.id)), item));
    batch.commit().then(() => {
      setSyncStatus("success");
      setSyncMsg(`✅ ${items.length} data tersimpan`);
      setTimeout(() => {
        setSyncStatus("idle");
        setSyncMsg("");
      }, 1500);
    }).catch(err => {

      setSyncStatus("error");
      setSyncMsg("❌ Gagal simpan: " + err.message);
