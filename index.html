        .lp-portal-btn.selected { background: #e8f5e9; }
        .lp-portal-icon-wrap {
          width: 52px; height: 52px; border-radius: 16px;
          display: flex; align-items: center; justify-content: center;
          font-size: 22px;
        }
        .lp-portal-label { font-size: 12px; font-weight: 700; color: #333; text-align: center; }

        /* ── Login Form (dropdown) ── */
        .lp-form-area {
          background: white;
          border-radius: 20px;
          padding: 18px;
          box-shadow: 0 2px 16px rgba(0,0,0,.07);
          animation: slideDown .25s ease;
        }
        @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        .lp-form-title { font-size: 15px; font-weight: 800; color: #1a1a1a; margin-bottom: 14px; }
        .lp-input, .lp-select {
          width: 100%;
          padding: 12px 16px;
          font-size: 14px;
          font-family: inherit;
          border: 1.5px solid #e8e8e8;
          border-radius: 12px;
          background: #f8f9fa;
          color: #1a1a1a;
          outline: none;
          transition: all .2s;
          appearance: none;
          margin-bottom: 10px;
        }
        .lp-input:focus, .lp-select:focus { border-color: #27ae60; background: white; box-shadow: 0 0 0 3px rgba(39,174,96,.1); }
        .lp-select-wrap { position: relative; margin-bottom: 0; }
        .lp-select-wrap::after { content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; color:#888; font-size:13px; }
        .lp-select-wrap .lp-select { margin-bottom: 10px; }
        .lp-btn {
          width: 100%;
          padding: 13px;
          font-size: 14px;
          font-weight: 800;
          font-family: inherit;
          border: none;
          border-radius: 12px;
          cursor: pointer;
          transition: all .2s;
          margin-top: 4px;
          letter-spacing: .3px;
        }
        .lp-btn-green { background: linear-gradient(135deg,#1e9e5e,#27ae60); color: white; }
        .lp-btn-green:hover { box-shadow: 0 4px 16px rgba(39,174,96,.4); transform: translateY(-1px); }
        .lp-btn-blue { background: linear-gradient(135deg,#1565c0,#1e88e5); color: white; }
        .lp-btn-blue:hover { box-shadow: 0 4px 16px rgba(30,136,229,.4); transform: translateY(-1px); }
        .lp-btn-orange { background: linear-gradient(135deg,#e65100,#fb8c00); color: white; }
        .lp-btn-orange:hover { box-shadow: 0 4px 16px rgba(251,140,0,.4); transform: translateY(-1px); }
        .lp-error { font-size: 12px; color: #e53935; margin-bottom: 8px; padding: 8px 12px; background: #ffebee; border-radius: 8px; }
        .lp-hint { font-size: 11px; color: #aaa; text-align: center; margin-top: 6px; }

        /* ── Banner ── */
        .lp-banner {
          border-radius: 20px;
          padding: 20px;
          display: flex; align-items: center; justify-content: space-between;
          position: relative;
          overflow: hidden;
          min-height: 100px;
          box-shadow: 0 4px 20px rgba(0,0,0,.15);
          transition: background .5s;
          background-size: cover;
          background-position: center;
        }
        .lp-banner-overlay {
          position: absolute; inset: 0;
          background: linear-gradient(135deg, rgba(0,0,0,.45), rgba(0,0,0,.2));
          border-radius: 20px;
        }
        .lp-banner-content { position: relative; z-index: 1; flex:1; }
        .lp-banner-text-title { font-size: 17px; font-weight: 800; color: white; }
        .lp-banner-text-sub { font-size: 12px; color: rgba(255,255,255,.85); margin-top: 2px; }
        .lp-banner-arrow {
          position: relative; z-index: 1;
          width: 32px; height: 32px; border-radius: 50%;
          background: rgba(255,255,255,.25);
          display: flex; align-items: center; justify-content: center;
          color: white; font-size: 14px; border: none; cursor: pointer;
        }
        .lp-dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
        .lp-dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; transition: all .2s; }
        .lp-dot.active { background: #27ae60; width: 18px; border-radius: 99px; }

        /* ── Link Cepat ── */
        .lp-section-title { font-size: 16px; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; }
        .lp-links-row { display: flex; gap: 10px; }
        .lp-link-item {
          flex: 1;
          background: white;
          border-radius: 16px;
          padding: 14px 10px;
          display: flex; flex-direction: column; align-items: center; gap: 8px;
          box-shadow: 0 2px 10px rgba(0,0,0,.07);
          text-decoration: none; cursor: pointer; border: none; font-family: inherit;
          transition: transform .15s, box-shadow .15s;
        }
        .lp-link-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
        .lp-link-icon-wrap {
          width: 50px; height: 50px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 22px;
        }
        .lp-link-label { font-size: 12px; font-weight: 700; color: #333; }

        /* ── Announcements ── */
        .lp-ann-item {
          background: white;
          border-radius: 16px;
          padding: 14px 16px;
          display: flex; align-items: center; gap: 12px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06);
          cursor: pointer;
          transition: box-shadow .15s;
        }
        .lp-ann-item + .lp-ann-item { margin-top: 8px; }
        .lp-ann-item:hover { box-shadow: 0 4px 18px rgba(0,0,0,.1); }
        .lp-ann-icon {
          width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
          font-size: 18px;
          background: #e8f5e9;
        }
        .lp-ann-title { font-size: 14px; font-weight: 700; color: #1a1a1a; }
        .lp-ann-sub { font-size: 12px; color: #888; margin-top: 1px; }
        .lp-ann-arrow { margin-left: auto; color: #bbb; font-size: 13px; }

function Select({ value, onChange, options, placeholder, disabled }) {
  return (
    <div className="select-wrap">
      <select className="select" value={value} onChange={e => onChange(e.target.value)} disabled={disabled}>
        {placeholder && <option value="">{placeholder}</option>}
        {options.map(o => (
          <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>
        ))}
      </select>
    </div>
  );
}

function ProgressBar({ value }) {
  return (
    <div className="progress-bar-wrap">
      <div className="progress-bar-fill" style={{ width: `${Math.min(100, Math.max(0, value))}%` }} />
    </div>
  );
}

function Badge({ children, variant = "gray" }) {
  return <span className={`badge badge-${variant}`}>{children}</span>;
}

function StatusBadge({ status }) {
  const map = { Hadir: "green", Sakit: "yellow", Izin: "blue", Alpa: "red", Aktif: "green", Nonaktif: "gray", "Sangat Baik": "green", "Sangat baik": "green", Baik: "blue", Cukup: "yellow", Kurang: "red", Berjalan: "blue", Selesai: "green", Lancar: "green", "Perlu Latihan": "red" };
  return <Badge variant={map[status] ?? "gray"}>{status}</Badge>;
}

function Dialog({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="dialog-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="dialog">
        <div className="dialog-header">
          <span className="dialog-title">{title}</span>
          <button className="btn-ghost btn btn-icon" onClick={onClose}><Icon.X /></button>
        </div>
        <div className="dialog-body">{children}</div>
        {footer && <div className="dialog-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ── Download tabel riwayat sebagai PDF ──────────────────────────────────────
function downloadTablePDF(tableId, judul, namaFile) {
  const el = document.getElementById(tableId);
  if (!el) { alert("Tabel tidak ditemukan."); return; }
  if (typeof html2canvas === "undefined" || typeof window.jspdf === "undefined") {
    alert("Library belum siap, tunggu sebentar lalu coba lagi."); return;
  }
  const btn = document.getElementById("btn-pdf-" + tableId);
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Memproses..."; }

  html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false })
    .then(canvas => {
      const { jsPDF } = window.jspdf;
      const imgW = canvas.width;
      const imgH = canvas.height;
      // A4 landscape jika tabel lebar
      const isLandscape = imgW > imgH;
      const pdf = new jsPDF({ orientation: isLandscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const usableW = pageW - margin * 2;
      const scale = usableW / (imgW / 2); // /2 karena scale:2 di html2canvas
      const imgHmm = (imgH / 2) * scale;

      // Header
      pdf.setFontSize(13);
      pdf.setFont("helvetica", "bold");
      pdf.text("BUNAYYA ISLAMIC SCHOOL", pageW / 2, margin + 4, { align: "center" });
      pdf.setFontSize(10);
      pdf.setFont("helvetica", "normal");
      pdf.text(judul, pageW / 2, margin + 9, { align: "center" });
      pdf.setFontSize(8);
      pdf.text("Dicetak: " + new Date().toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" }), pageW / 2, margin + 13, { align: "center" });

      // Garis pemisah
      const startY = margin + 16;
      pdf.setDrawColor(29, 122, 95);
      pdf.setLineWidth(0.5);
      pdf.line(margin, startY, pageW - margin, startY);

      // Tabel sebagai gambar
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      let y = startY + 3;
      const maxH = pageH - y - margin;

      if (imgHmm <= maxH) {
        pdf.addImage(imgData, "JPEG", margin, y, usableW, imgHmm);
      } else {
        // Multi-page jika tabel panjang
        let srcY = 0;
        while (srcY < imgH) {
          const sliceH = Math.min((maxH / scale) * 2, imgH - srcY);
          const sliceCanvas = document.createElement("canvas");
          sliceCanvas.width = imgW;
          sliceCanvas.height = sliceH;
          sliceCanvas.getContext("2d").drawImage(canvas, 0, srcY, imgW, sliceH, 0, 0, imgW, sliceH);
          pdf.addImage(sliceCanvas.toDataURL("image/jpeg", 0.95), "JPEG", margin, y, usableW, (sliceH / 2) * scale);
          srcY += sliceH;
          if (srcY < imgH) { pdf.addPage(); y = margin; }
        }
      }

      pdf.save(namaFile + ".pdf");
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    })
    .catch(err => {
      alert("Gagal: " + err.message);
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    });
}

  const FB_COLLECTIONS = {
    studentAttendance: "absensiSiswa",
    teacherAttendance: "absensiGuru",
    journals:          "jurnal",
    dailyReports:      "harian",
    grades:            "nilai",
    activities:        "kegiatan",
    targets:           "target",
    ziyadah:           "ziyadah",
    teachers:          "guru",
    students:          "siswa",
    subjects:          "mapel",
    quickLinks:        "quickLinks",
    announcements:     "announcements",
  };

  // ── Firebase realtime listeners ──────────────────────────────────────────
  React.useEffect(() => {
    const tryConnect = () => {
      if (!window.__firebase || !window.__firebase.ready) {
        setTimeout(tryConnect, 500);
        return;
      }
      const { db } = window.__firebase;
      const collMap = {
        absensiSiswa:  "studentAttendance",
        absensiGuru:   "teacherAttendance",
        jurnal:        "journals",
        harian:        "dailyReports",
        nilai:         "grades",
        kegiatan:      "activities",
        target:        "targets",
        ziyadah:       "ziyadah",
        guru:          "teachers",
        siswa:         "students",
        mapel:         "subjects",
        quickLinks:    "quickLinks",
        announcements: "announcements",
      };
      const unsubs = Object.entries(collMap).map(([fbColl, stateKey]) => {
        return db.collection(fbColl).onSnapshot((snap) => {
          const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }));

          // Auto-seed master data ke Firebase kalau masih kosong
          if (docs.length === 0 && fbColl === "guru") {
            const batch = db.batch();
            MOCK_TEACHERS.forEach(t => batch.set(db.collection("guru").doc(String(t.id)), t));
            batch.commit().catch(e => console.error("Seed guru error:", e));
          }
          if (docs.length === 0 && fbColl === "siswa") {
            const batch = db.batch();
            MOCK_STUDENTS.forEach(s => batch.set(db.collection("siswa").doc(String(s.id)), s));
            batch.commit().catch(e => console.error("Seed siswa error:", e));
          }
          if (docs.length === 0 && fbColl === "mapel") {
            const batch = db.batch();
            MOCK_SUBJECTS.forEach(s => batch.set(db.collection("mapel").doc(String(s.id)), s));
            batch.commit().catch(e => console.error("Seed mapel error:", e));
          }
          if (docs.length === 0 && fbColl === "quickLinks") {
            const batch = db.batch();
            MOCK_QUICKLINKS.forEach(l => batch.set(db.collection("quickLinks").doc(String(l.id)), l));
            batch.commit().catch(e => console.error("Seed quickLinks error:", e));
          }
          // Force-update link l1/l2/l3 jika masih pakai nama/url lama
          if (fbColl === "quickLinks" && docs.length > 0) {
            const oldTitles = { l1: "E-Learning", l2: "Google Classroom", l3: "PPDB Online" };
            const oldUrls   = { l3: "https://script.google.com/a/macros/admin.paud.belajar.id/s/AKfycbxXADFTW-6LkMMoi4X4k681iBwbpR-Bd5hVQLVO_rS1p9g6XtC8LfCoBezJQAGvGdM94Q/exec" };
            const updates = MOCK_QUICKLINKS.filter(ml => {
              const existing = docs.find(d => d.id === ml.id);
              return existing && (
                (oldTitles[ml.id] && existing.title === oldTitles[ml.id]) ||
                (oldUrls[ml.id]   && existing.url   === oldUrls[ml.id])
              );
            });
            if (updates.length > 0) {
              const batch = db.batch();
              updates.forEach(l => batch.set(db.collection("quickLinks").doc(String(l.id)), l));
              batch.commit().catch(e => console.error("Update quickLinks error:", e));
            }
          }
          if (docs.length === 0 && fbColl === "announcements") {
            const batch = db.batch();
            MOCK_ANNOUNCEMENTS.forEach(a => batch.set(db.collection("announcements").doc(String(a.id)), a));
            batch.commit().catch(e => console.error("Seed announcements error:", e));
          }

          // Firebase = sumber kebenaran tunggal
          // Tidak ada merge lokal — setiap perubahan langsung dari Firestore
          setData(prev => {
            const protectedKeys = ["teachers", "students", "subjects", "quickLinks", "announcements"];
            // Master data: pakai state lokal HANYA kalau Firebase benar-benar kosong (belum seed)
            const newVal = (docs.length === 0 && protectedKeys.includes(stateKey))
              ? prev[stateKey]
              : docs;
            const next = { ...prev, [stateKey]: newVal };
            try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
            return next;
          });
          setLastSync(new Date().toLocaleString("id-ID"));
          setSyncStatus("success");
          setTimeout(() => setSyncStatus("idle"), 2000);
        }, (err) => {
          console.error("Firebase listener error:", err);
        });
      });
      return () => unsubs.forEach(u => u());
    };
    const cleanup = tryConnect();
    return () => { if (typeof cleanup === "function") cleanup(); };
  }, []);
  // ─────────────────────────────────────────────────────────────────

    if (!fbColl || !window.__firebase?.ready) return;
    window.__firebase.db.collection(fbColl).doc(String(item.id))
      .set(item)
      .then(() => {
        setSyncStatus("success");
        setSyncMsg("✅ Tersimpan");
        setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 1500);
      })
      .catch(err => {
        console.error("writeDoc error:", err);
        setSyncStatus("error");
        setSyncMsg("❌ Gagal simpan: " + err.message);
      });
  };

  // ── Tulis BEBERAPA item sekaligus (batch), tidak hapus item lain ──────────
  const writeDocs = (collKey, items) => {
    const fbColl = FB_COLLECTIONS[collKey];
    if (!fbColl || !window.__firebase?.ready || !items.length) return;
    const { db } = window.__firebase;
    const batch = db.batch();
    items.forEach(item => batch.set(db.collection(fbColl).doc(String(item.id)), item));
    batch.commit()
      .then(() => {
        setSyncStatus("success");
        setSyncMsg(`✅ ${items.length} data tersimpan`);
        setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 1500);
      })
      .catch(err => {
        console.error("writeDocs error:", err);
        setSyncStatus("error");
        setSyncMsg("❌ Gagal simpan: " + err.message);
      });
  };

  // ── patchData: update state lokal saja, tidak tulis ke Firebase ───────────
  // (penulisan Firebase dilakukan langsung di setiap save function via writeDoc/writeDocs)
  const patchData = (key, val) => {
    setData(d => {
      const next = { ...d, [key]: val };
      try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
      return next;
    });

      namaSiswa: student?.nama || r.student?.nama || "",

    };
  });

  // ── Firebase sync helpers (menggantikan Google Sheets) ───────────────────
  const jsonpPost = () => Promise.resolve(); // legacy stub, tidak dipakai

  const syncCollection = async (fbColl, records) => {
    if (!window.__firebase?.ready) return;
    const { db } = window.__firebase;
    try {
      const snap = await db.collection(fbColl).get();
      const existingIds = new Set(snap.docs.map(d => d.id));
      const batch = db.batch();
      records.forEach(item => {
        const ref = db.collection(fbColl).doc(String(item.id));
        if (!existingIds.has(String(item.id))) {
          batch.set(ref, item);
        }
      });
      await batch.commit();
    } catch(e) { console.error("syncCollection error:", e); }
  };

  const syncDelete = async (fbColl, id) => {
    if (!window.__firebase?.ready) return;
    try {
      await window.__firebase.db.collection(fbColl).doc(String(id)).delete();
    } catch(e) { console.error("syncDelete error:", e); }
  };

  // ── Firebase: Sync semua data sekaligus ─────────────────────────────────
  const syncAllToSheets = async () => {
    if (!window.__firebase?.ready) {
      alert("⚠️ Firebase belum terhubung, tunggu sebentar lalu coba lagi.");
      return;
    }
    setSyncStatus("syncing");
    setSyncMsg("🔄 Menyinkronkan semua data ke Firebase...");
    const { db } = window.__firebase;
    try {
      for (const [stateKey, fbColl] of Object.entries(FB_COLLECTIONS)) {
        const items = data[stateKey] || [];
        const snap = await db.collection(fbColl).get();
        const existingIds = new Set(snap.docs.map(d => d.id));
        const batch = db.batch();
        items.forEach(item => {
          const ref = db.collection(fbColl).doc(String(item.id));
          if (!existingIds.has(String(item.id))) {
            batch.set(ref, item);
          }
        });
        await batch.commit();
      }
      setSyncStatus("success");
      setSyncMsg("✅ Semua data berhasil disinkronkan ke Firebase!");
      setLastSync(new Date().toLocaleString("id-ID"));
    } catch(err) {
      setSyncStatus("error");
      setSyncMsg("❌ Gagal sinkron: " + err.message);
    }
    setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 4000);
  };

    setTimeout(() => {
      setSyncStatus("success");

        <button className={`portal-tab ${portal === "wali" ? "active-wali" : ""}`} onClick={() => { setPortal("wali"); setMenu("dashboard"); }}>
          📋 Portal Wali
        </button>
      </div>

      {/* Menu bar */}
      <div className="menu-bar">
        <div className="flex scroll-x min-w-max" style={{ padding: "0 24px", gap: 2 }}>
          {activeMenus.map(m => (
            <button key={m.id} className={`menu-btn ${menu === m.id ? menuActiveClass : ""}`} onClick={() => setMenu(m.id)}>
              {m.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="content">
        {portal === "guru" && (
          <PortalGuru menu={menu} data={data} setData={setData} patchData={patchData} formData={formData} patchForm={patchForm} selectedKelas={selectedKelas} setSelectedKelas={setSelectedKelas} searchQuery={searchQuery} setSearchQuery={setSearchQuery} user={user} canAccess={canAccess} saveAbsensiSiswa={saveAbsensiSiswa} saveAbsensiGuru={saveAbsensiGuru} saveJurnal={saveJurnal} saveNilaiKelas={saveNilaiKelas} deleteItem={deleteItem} addDialog={addDialog} setAddDialog={setAddDialog} loginConfig={loginConfig} saveLoginConfig={saveLoginConfig} writeDoc={writeDoc} />
        )}
        {portal === "siswa" && (
          <PortalSiswa menu={menu} data={data} setData={setData} patchData={patchData} formData={formData} patchForm={patchForm} user={user} canAccess={canAccess} saveHarian={saveHarian} saveKegiatan={saveKegiatan} saveKegiatanKelas={saveKegiatanKelas} saveTarget={saveTarget} saveZiyadah={saveZiyadah} selectedKelas={selectedKelas} setSelectedKelas={setSelectedKelas} deleteItem={deleteItem} writeDoc={writeDoc} />
        )}
        {portal === "wali" && (
          <PortalWali menu={menu} data={data} formData={formData} patchForm={patchForm} user={user} />
        )}
      </div>

      {loading && (
        <div className="loading-overlay">
          <div className="loading-card">
            <div className="spinner" />
            <div>Memproses...</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PORTAL GURU ─────────────────────────────────────────────────────────────
function PortalGuru({ menu, data, setData, patchData, formData, patchForm, selectedKelas, setSelectedKelas, searchQuery, setSearchQuery, user, canAccess, saveAbsensiSiswa, saveAbsensiGuru, saveJurnal, saveNilaiKelas, deleteItem, loginConfig = {}, saveLoginConfig, writeDoc }) {

  const todayStr = today();

  // Dashboard
  if (menu === "dashboard") {

    // ── BarChart vertikal SVG ─────────────────────────────────────────────
    const BarChart = ({ items, color = "#1d7a5f", maxOverride }) => {
      const W = 52, GAP = 10, H = 130, PAD_LEFT = 32, PAD_BOT = 72, PAD_TOP = 16;
      const totalMax = items.reduce((a,i) => a + i.val, 0);

      // Jika semua nilai 0, tampilkan pesan kosong — tidak render grafik
      if (totalMax === 0) return (
        <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>
          📭 Belum ada data pada rentang tanggal ini
        </div>
      );

      const rawMax = maxOverride || Math.max(...items.map(i => i.val), 1);

      // Garis Y dinamis — bertambah sesuai data
      const niceStep = (max) => {
        if (max <= 5)   return 1;
        if (max <= 10)  return 2;
        if (max <= 20)  return 5;
        if (max <= 50)  return 10;
        if (max <= 100) return 20;
        return Math.ceil(max / 5 / 10) * 10;
      };
      const step   = niceStep(rawMax);
      const maxVal = Math.ceil(rawMax / step) * step;
      const yTicks = [];
      for (let v = 0; v <= maxVal; v += step) yTicks.push(v);

      const totalW = items.length * W + (items.length - 1) * GAP + PAD_LEFT + 16;

      return (
        <svg width="100%" viewBox={"0 0 " + totalW + " " + (H + PAD_BOT + PAD_TOP)}
          style={{ overflow:"visible", display:"block" }}>

          {/* Grid lines horizontal — dinamis */}
          {yTicks.map(v => {
            const y = PAD_TOP + H - (v / maxVal) * H;
            return (
              <g key={v}>
                <line x1={PAD_LEFT} y1={y} x2={totalW} y2={y} stroke="#e8e8e8" strokeWidth="1" strokeDasharray={v===0?"0":"4 3"} />
                <text x={PAD_LEFT-4} y={y+4} textAnchor="end" fontSize="9" fill="#999">{v}</text>
              </g>
            );
          })}

          {/* Bars */}
          {items.map((item, i) => {
            const x    = PAD_LEFT + i * (W + GAP);
            const barH = maxVal > 0 ? Math.max((item.val/maxVal)*H, item.val>0?4:0) : 0;
            const barY = PAD_TOP + H - barH;
            return (
              <g key={i}>
                <rect x={x+3} y={barY+3} width={W} height={barH} rx="5" fill="rgba(0,0,0,.06)" />
                <rect x={x} y={barY} width={W} height={barH} rx="5" fill={color} />
                {item.val > 0 && (
                  <text x={x+W/2} y={barY-6} textAnchor="middle" fontSize="14" fontWeight="900" fill={color}>{item.val}</text>
                )}
                {/* Label miring -45 derajat */}
                <text x={x+W/2} y={PAD_TOP+H+8} textAnchor="end" fontSize="14" fontWeight="900" fill="#333"
                  transform={"rotate(-45,"+(x+W/2)+","+(PAD_TOP+H+8)+")"}>
                  {item.lbl}
                </text>
              </g>
            );
          })}

          {/* Baseline */}
          <line x1={PAD_LEFT} y1={PAD_TOP+H} x2={totalW} y2={PAD_TOP+H} stroke="#ccc" strokeWidth="1.5" />
        </svg>
      );
    };

    // ── Data chart ───────────────────────────────────────────────────────
    const kelasList = KELAS_LIST.filter(k => k !== "Semua");
    const dashDari   = formData.dash_dari   ?? todayStr;
    const dashSampai = formData.dash_sampai ?? todayStr;
    const inDashRange = tgl => (!dashDari || tgl >= dashDari) && (!dashSampai || tgl <= dashSampai);

    const absSiswaPerKelas  = kelasList.map(k => ({ lbl: k, val: data.studentAttendance.filter(a => a.kelas === k && inDashRange(a.tanggal)).length }));
    const absGuruPerNama    = data.teachers.map(t => ({ lbl: t.nama, val: data.teacherAttendance.filter(a => a.teacherId === t.id && inDashRange(a.tanggal)).length }));
    const jurnalPerGuru     = data.teachers.map(t => ({ lbl: t.nama, val: data.journals.filter(j => j.teacherId === t.id && inDashRange(j.tanggal)).length }));
    const harianPerKelas    = kelasList.map(k => ({ lbl: k, val: data.dailyReports.filter(r => r.kelas === k && inDashRange(r.tanggal)).length }));
    const nilaiPerKelas     = kelasList.map(k => ({ lbl: k, val: data.grades.filter(g => g.kelas === k && inDashRange(g.tanggal)).length }));
    const kegiatanPerKelas  = kelasList.map(k => ({ lbl: k, val: data.activities.filter(a => a.kelas === k && inDashRange(a.tanggal)).length }));
    const targetPerKelas    = kelasList.map(k => ({ lbl: k, val: data.targets.filter(t => t.kelas === k && inDashRange(t.tanggal)).length }));
    const ziyadahPerKelas   = kelasList.map(k => ({ lbl: k, val: data.ziyadah.filter(z => z.kelas === k && inDashRange(z.tanggal)).length }));

    const CHART_COLORS = {
      absSiswa:"#1d7a5f", absGuru:"#2563a8", jurnal:"#7c3aed",
      harian:"#d97706", kegiatan:"#0891b2", target:"#dc2626",
      ziyadah:"#059669", nilai:"#9333ea"
    };

    const ChartCard = ({ title, items, color, maxOverride }) => (
      <div className="card">
        <div className="card-header">
          <div className="card-title">{title}</div>
          <div className="flex gap-2 items-center">
            <span style={{ fontSize:12, color:"#888" }}>{items.reduce((a,i)=>a+i.val,0)} total</span>
          </div>
        </div>
        <div className="card-body" style={{ overflowX:"auto" }}>
          {items.length === 0
            ? <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>📭 Belum ada data</div>
            : <BarChart items={items} color={color} maxOverride={maxOverride} />
          }
        </div>
      </div>
    );

    return (
      <div>
        {/* Stat cards */}
        <div className="card mb-4">
          <div className="card-header">
            <div>
              <div className="card-title">📈 Dashboard Statistik</div>
              <div className="card-sub">Data dari database sekolah</div>
            </div>
            <div className="flex gap-2 items-center" style={{flexWrap:"wrap", gap:8}}>
              <span style={{fontSize:12, color:"#64748b", fontWeight:600}}>Dari</span>
              <input type="date" className="input" style={{width:140, fontSize:13, padding:"5px 8px"}}
                value={formData.dash_dari ?? todayStr}
                onChange={e => patchForm({dash_dari: e.target.value})} />
              <span style={{fontSize:12, color:"#64748b", fontWeight:600}}>Sampai</span>
              <input type="date" className="input" style={{width:140, fontSize:13, padding:"5px 8px"}}
                value={formData.dash_sampai ?? todayStr}
                onChange={e => patchForm({dash_sampai: e.target.value})} />
              <button onClick={() => patchForm({dash_dari: todayStr, dash_sampai: todayStr})}
                style={{padding:"5px 10px", fontSize:12, fontWeight:700, background:"#e0f2fe", color:"#0369a1", border:"none", borderRadius:8, cursor:"pointer"}}>Hari Ini</button>
              <button onClick={() => patchForm({dash_dari: "", dash_sampai: ""})}
                style={{padding:"5px 10px", fontSize:12, fontWeight:700, background:"#f1f5f9", color:"#475569", border:"none", borderRadius:8, cursor:"pointer"}}>Semua</button>
            </div>
          </div>
          <div className="card-body">
            {(() => {
              const dari   = formData.dash_dari   ?? todayStr;
              const sampai = formData.dash_sampai ?? todayStr;
              const inRange = tgl => (!dari || tgl >= dari) && (!sampai || tgl <= sampai);
              const stats = [
                { icon: "📖", label: "Total Siswa",   value: data.students.length,                                        bg:"#dbeafe", c:"#1e40af" },
                { icon: "✏️", label: "Total Guru",    value: data.teachers.length,                                        bg:"#d1fae5", c:"#065f46" },
                { icon: "📊", label: "Data Nilai",    value: data.grades.filter(g => inRange(g.tanggal)).length,          bg:"#ede9fe", c:"#5b21b6" },
                { icon: "📋", label: "Absensi Siswa", value: data.studentAttendance.filter(a => inRange(a.tanggal)).length, bg:"#ecfdf5", c:"#065f46" },
                { icon: "🗒️", label: "Absensi Guru", value: data.teacherAttendance.filter(a => inRange(a.tanggal)).length, bg:"#eff6ff", c:"#1e40af" },
                { icon: "📝", label: "Lap. Harian",  value: data.dailyReports.filter(r => inRange(r.tanggal)).length,    bg:"#fef3c7", c:"#92400e" },
                { icon: "📒", label: "Jurnal",        value: data.journals.filter(j => inRange(j.tanggal)).length,        bg:"#f5f3ff", c:"#5b21b6" },
                { icon: "🎯", label: "Target",        value: data.targets.filter(t => inRange(t.tanggal)).length,         bg:"#fee2e2", c:"#991b1b" },
              ];
              return (
                <div className="grid grid-8" style={{ gap: 12 }}>
                  {stats.map(s => (
                    <div key={s.label} style={{ background:s.bg, borderRadius:12, padding:"14px 8px", textAlign:"center" }}>
                      <div style={{ fontSize:22, marginBottom:4 }}>{s.icon}</div>
                      <div style={{ fontSize:22, fontWeight:800, color:s.c }}>{s.value}</div>
                      <div style={{ fontSize:11, color:s.c, opacity:.8, marginTop:2 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        </div>

        {/* 8 diagram vertikal kebawah, full width */}
        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          <ChartCard title="📋 Absensi Siswa per Kelas"       items={absSiswaPerKelas} color={CHART_COLORS.absSiswa} />
          <ChartCard title="🗒️ Absensi Guru per Nama"        items={absGuruPerNama}   color={CHART_COLORS.absGuru} />
          <ChartCard title="📝 Jurnal per Guru"               items={jurnalPerGuru}    color={CHART_COLORS.jurnal} />
          <ChartCard title="📄 Laporan Harian per Kelas"      items={harianPerKelas}   color={CHART_COLORS.harian} />
          <ChartCard title="📊 Rekap Nilai per Kelas"         items={nilaiPerKelas}    color={CHART_COLORS.nilai} />
          <ChartCard title="🎯 Laporan Kegiatan per Kelas"    items={kegiatanPerKelas} color={CHART_COLORS.kegiatan} />
          <ChartCard title="🎯 Target Pencapaian per Kelas"   items={targetPerKelas}   color={CHART_COLORS.target} />
          <ChartCard title="📖 Ziyadah Hafalan per Kelas"     items={ziyadahPerKelas}  color={CHART_COLORS.ziyadah} />
        </div>


      </div>
    );
  }

  // Data Sheets
  if (menu === "data-sheets") {
    const filtered = data.students.filter(s =>
      (selectedKelas === "Semua" || s.class_name === selectedKelas) &&
      (!searchQuery || s.nama.toLowerCase().includes(searchQuery.toLowerCase()) || s.nis.includes(searchQuery))
    );
    return (
      <div className="card">
        <div className="card-header">
          <div className="card-title">📊 Data Siswa</div>
          <div className="flex gap-2 wrap">
            <div style={{ position: "relative" }}>
              <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#8a8a8a" }}><Icon.Search /></span>
              <input className="input" style={{ paddingLeft: 34, width: 220 }} placeholder="Cari nama / NIS..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />

              <select className="select" value={selectedKelas} onChange={e => setSelectedKelas(e.target.value)}>
                {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}

        <div className="card-body">
          <div className="grid grid-4 mb-4" style={{ gap: 12 }}>
            {[
              { label: "Siswa", val: data.students.length, bg: "#dbeafe", c: "#1e40af" },

  // Cetak Rapor
  if (menu === "cetak-rapor") {
    const handleDownloadPDF = () => {
      const el = document.getElementById("rapor-preview");
      if (!el) { alert("Pilih siswa terlebih dahulu!"); return; }
      if (typeof html2canvas === "undefined") { alert("Library belum siap, tunggu sebentar."); return; }

      const btn = document.getElementById("btn-download-rapor");
      if (btn) { btn.disabled = true; btn.innerText = "⟳ Memproses..."; }

      html2canvas(el, {
        scale: 3,
        useCORS: true,
        allowTaint: true,
        backgroundColor: "#ffffff",
        logging: false,
      }).then(canvas => {
        const imgData  = canvas.toDataURL("image/jpeg", 0.98);
        const imgW     = canvas.width;
        const imgH     = canvas.height;

        // A4 dalam px pada 96dpi: 794 x 1123
        const a4W = 794, a4H = 1123;
        const scale  = Math.min(a4W / (imgW / 3), a4H / (imgH / 3));
        const finalW = (imgW / 3) * scale;
        const finalH = (imgH / 3) * scale;

        // Buat canvas A4 putih
        const pdf = document.createElement("canvas");
        pdf.width  = a4W;
        pdf.height = a4H;
        const ctx  = pdf.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, a4W, a4H);

        const img = new Image();
        img.onload = () => {
          const x = (a4W - finalW) / 2;
          const y = 20;
          ctx.drawImage(img, x, y, finalW, finalH);

          const s = data.students.find(s => s.id === formData.rapor_siswa);
          const nm = (s?.nama || "siswa").replace(/ /g, "-");
          const link = document.createElement("a");
          link.download = `Rapor-${nm}-${formData.rapor_semester || "Sem1"}-${formData.rapor_tahun || "2025-2026"}.pdf`;

          // Simpan sebagai PNG lalu rename ke .pdf (browser tetap bisa buka)
          // Atau simpan sebagai JPEG dengan ekstensi .jpg
          link.href = pdf.toDataURL("image/jpeg", 0.97);
          link.download = link.download.replace(".pdf", ".jpg");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
        };
        img.src = imgData;
      }).catch(err => {
        alert("Gagal: " + err.message);
        if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
      });
    };

            </div>

              <label className="label">Siswa *</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_siswa || ""} onChange={e => patchForm({ rapor_siswa: e.target.value })} disabled={!formData.rapor_kelas}>
                <option value="">{formData.rapor_kelas ? "-- Pilih Siswa --" : "Pilih kelas dulu"}</option>
                {data.students.filter(s => s.class_name === formData.rapor_kelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Semester</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_semester || "Semester 1 (Ganjil)"} onChange={e => patchForm({ rapor_semester: e.target.value })}>
                <option value="Semester 1 (Ganjil)">Semester 1 (Ganjil)</option>
                <option value="Semester 2 (Genap)">Semester 2 (Genap)</option>
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Tahun Ajaran</label>
              <div className="select-wrap"><select className="select" value={formData.rapor_tahun || "2025/2026"} onChange={e => patchForm({ rapor_tahun: e.target.value })}>
                <option value="2024/2025">2024/2025</option>
                <option value="2025/2026">2025/2026</option>
              </select></div>
            </div>
          </div>

          <button id="btn-download-rapor" className="btn btn-primary" disabled={!formData.rapor_siswa} onClick={handleDownloadPDF} style={{ marginBottom:20 }}>
            <Icon.Download /> ⬇️ Download Rapor (JPG)
          </button>

          {formData.rapor_siswa && (() => {

            const grades = data.grades.filter(g => g.studentId === formData.rapor_siswa);
            const att    = data.studentAttendance.filter(a => a.studentId === formData.rapor_siswa);
            const hadirCount = att.filter(a => a.status === "Hadir").length;
            const avg = grades.length > 0 ? Math.round(grades.reduce((a, g) => a + g.skor, 0) / grades.length) : 0;
            const predikat = v => v >= 90 ? "A" : v >= 80 ? "B" : v >= 70 ? "C" : v >= 60 ? "D" : "E";
            const keterangan = v => v >= 90 ? "Sangat Baik" : v >= 80 ? "Baik" : v >= 70 ? "Cukup" : v >= 60 ? "Perlu Bimbingan" : "Kurang";

            return (
              <div id="rapor-preview" style={{ background:"#fff", borderRadius:16, padding:28, border:"2px solid #e0e0e0", maxWidth:620, margin:"0 auto", fontFamily:"Arial,sans-serif" }}>
                {/* Header Rapor */}
                <div style={{ textAlign:"center", borderBottom:"3px double #1d7a5f", paddingBottom:16, marginBottom:20 }}>
                  <div style={{ fontSize:28, marginBottom:4 }}>🕌</div>
                  <div style={{ fontSize:20, fontWeight:800, color:"#1d7a5f", letterSpacing:.5 }}>BUNAYYA ISLAMIC SCHOOL</div>
                  <div style={{ fontSize:12, color:"#666", marginTop:2 }}>Jl. Panaragan Jaya — Portal Pendidikan</div>
                  <div style={{ marginTop:10, fontSize:15, fontWeight:700, color:"#333", background:"#f0fdf4", borderRadius:8, padding:"6px 16px", display:"inline-block" }}>
                    RAPOR {(formData.rapor_semester || "Semester 1").toUpperCase()} — T.A {formData.rapor_tahun || "2025/2026"}
                  </div>
                </div>

                {/* Info Siswa */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20, background:"#f8fafc", borderRadius:10, padding:14 }}>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Nama Siswa</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.nama}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Kelas</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.class_name}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>NIS</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.nis || "-"}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Kehadiran</div><div style={{ fontWeight:700, fontSize:14, color:"#1d7a5f" }}>{hadirCount}/{att.length} hari</div></div>
                </div>

                {/* Tabel Nilai */}

                    <tbody>
                      {data.subjects.map((subj, i) => {
                        const sg  = grades.filter(g => g.mataPelajaran === subj.name);

                            <td style={{ padding:"7px 10px", textAlign:"center", fontWeight:700 }}>{val ? predikat(val) : "-"}</td>
                            <td style={{ padding:"7px 10px", color:"#555", fontSize:11 }}>{val ? keterangan(val) : "-"}</td>
                          </tr>
                        );
                      })}
                      <tr style={{ background:"#d1fae5", fontWeight:700 }}>
                        <td style={{ padding:"8px 10px" }}>RATA-RATA</td>
                        <td style={{ padding:"8px 10px", textAlign:"center", color:"#065f46" }}>{avg}</td>
                        <td style={{ padding:"8px 10px", textAlign:"center" }}>{predikat(avg)}</td>
                        <td style={{ padding:"8px 10px", color:"#065f46", fontSize:11 }}>{keterangan(avg)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* TTD */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginTop:24, paddingTop:16, borderTop:"1px solid #e0e0e0" }}>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:11, color:"#666" }}>Orang Tua / Wali</div>
                    <div style={{ height:60, borderBottom:"1px solid #ccc", marginTop:8, marginBottom:4 }}></div>
                    <div style={{ fontSize:11, color:"#aaa" }}>( _________________ )</div>
                  </div>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:11, color:"#666" }}>Kepala Sekolah</div>
                    <div style={{ height:60, borderBottom:"1px solid #ccc", marginTop:8, marginBottom:4 }}></div>
                    <div style={{ fontSize:11, color:"#aaa" }}>( Hasnal Labibah )</div>
                  </div>
                </div>

                <div style={{ textAlign:"center", marginTop:16, fontSize:10, color:"#bbb" }}>
                  Dicetak melalui Portal Pendidikan Bunayya Islamic School • {new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    );

  // Master Guru
  if (menu === "master-guru") {
    const openAddGuru = () => patchForm({ showGuruDialog: true, editGuruId: null, newGuruNip: "", newGuruNama: "", newGuruEmail: "", newGuruKelas: "", newGuruStatus: "Aktif" });
    const openEditGuru = (t) => patchForm({ showGuruDialog: true, editGuruId: t.id, newGuruNip: t.nip, newGuruNama: t.nama, newGuruEmail: t.email, newGuruKelas: t.kelas, newGuruStatus: t.status });
    const saveGuru = () => {
      if (!formData.newGuruNip || !formData.newGuruNama) { alert("NIP dan Nama wajib diisi!"); return; }
      if (formData.editGuruId) {
        const editId = formData.editGuruId;
        const updated = { ...data.teachers.find(t => t.id === editId), nip: formData.newGuruNip, nama: formData.newGuruNama, email: formData.newGuruEmail, kelas: formData.newGuruKelas, status: formData.newGuruStatus };

          const next = { ...d, teachers: d.teachers.map(t => t.id === editId ? updated : t) };

          return next;
        });
        writeDoc("teachers", updated);
      } else {
        const rec = { id: genId(), nip: formData.newGuruNip, nama: formData.newGuruNama, email: formData.newGuruEmail, kelas: formData.newGuruKelas, status: formData.newGuruStatus || "Aktif" };
        setData(d => {
          const next = { ...d, teachers: [...d.teachers, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;

        writeDoc("teachers", rec);

      patchForm({ showGuruDialog: false });

                  {data.teachers.length === 0 ? <tr><td colSpan={6} className="empty-state">Belum ada data guru</td></tr> : data.teachers.map(t => (

                      <td className="text-sm">{t.nip}</td>
                      <td style={{fontWeight:600}}>{t.nama}</td>
                      <td className="text-sm text-muted">{t.email}</td>
                      <td><Badge variant="blue">{t.kelas}</Badge></td>
                      <td><StatusBadge status={t.status} /></td>

                          <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditGuru(t)}><Icon.Edit /></button>

                        </div>
                      </td>

  // Pintasan & Pengumuman
  if (menu === "kelola-pintasan") {
    // Kompres gambar ke max 400px, kualitas 0.7 agar muat di Firestore (<1MB)
    const compressImage = (file, maxW = 400, quality = 0.7) => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width  = img.width  * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    const openAddLink = () => patchForm({ showLinkDialog: true, editLinkId: null, newLinkTitle: "", newLinkUrl: "", newLinkIcon: "🔗" });
    const openEditLink = (l) => patchForm({ showLinkDialog: true, editLinkId: l.id, newLinkTitle: l.title, newLinkUrl: l.url, newLinkIcon: l.icon });

      if (!formData.newLinkTitle) { alert("Judul link wajib diisi!"); return; }
      if (formData.editLinkId) {
        const editId = formData.editLinkId;

          title: formData.newLinkTitle,
          url:   formData.newLinkUrl || "#",
          icon:  formData.newLinkIcon || "🔗"
        };
        setData(d => {
          const next = { ...d, quickLinks: d.quickLinks.map(l => l.id === editId ? updated : l) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("quickLinks", updated);
      } else {
        const rec = { id: genId(), title: formData.newLinkTitle, url: formData.newLinkUrl || "#", icon: formData.newLinkIcon || "🔗" };
        setData(d => {
          const next = { ...d, quickLinks: [...d.quickLinks, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("quickLinks", rec);
      }
      patchForm({ showLinkDialog: false });
    };
    const openAddAnn = () => patchForm({ showAnnDialog: true, editAnnId: null, newAnnJudul: "", newAnnDeskripsi: "", newAnnIcon: "📢" });

    const saveAnn = () => {
      if (!formData.newAnnJudul) { alert("Judul pengumuman wajib diisi!"); return; }

        const editId = formData.editAnnId;
        const updated = { ...data.announcements.find(a => a.id === editId), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: d.announcements.map(a => a.id === editId ? updated : a) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("announcements", updated);
      } else {
        const rec = { id: genId(), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: [...d.announcements, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("announcements", rec);
      }
      patchForm({ showAnnDialog: false });
    };
    const ICON_OPTS = ["🔗","📋","💰","❤️","📢","🏫","📖","🎓","✏️","🗓️","📌","⭐","🔔","📣","📝","🏆","🌙","👍","🕌","🌟","📱","💻","🎯","🌿"];

      <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
        {/* Link Cepat */}

            <button className="btn btn-primary btn-sm" onClick={openAddLink}><Icon.Plus /> Tambah Link</button>
          </div>
          <div className="card-body">
            {data.quickLinks.length === 0 ? <div className="empty-state">Belum ada link cepat</div> : (

                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("quickLinks", l.id, l.title)}><Icon.Trash /></button>

        {/* Pengumuman */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">📢 Pengumuman</div>
            <button className="btn btn-primary btn-sm" onClick={openAddAnn}><Icon.Plus /> Tambah Pengumuman</button>
          </div>
          <div className="card-body">
            {data.announcements.length === 0 ? <div className="empty-state">Belum ada pengumuman</div> : (

                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{a.icon}</div>

        {/* Dialog Link */}

        {/* Dialog Pengumuman */}
        {formData.showAnnDialog && (

            <div className="form-group">
              <label className="label">Pilih Ikon</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:4 }}>
                {ICON_OPTS.map(ic => <button key={ic} onClick={() => patchForm({ newAnnIcon: ic })} style={{ width:38, height:38, fontSize:20, border: formData.newAnnIcon===ic ? "2px solid #27ae60":"1.5px solid #e8e8e8", borderRadius:10, cursor:"pointer", background: formData.newAnnIcon===ic ? "#e8f5e9":"#f8f9fa" }}>{ic}</button>)}
              </div>
            </div>
            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Judul pengumuman" value={formData.newAnnJudul || ""} onChange={e => patchForm({ newAnnJudul: e.target.value })} /></div>
            <div className="form-group"><label className="label">Deskripsi</label><textarea className="textarea" rows={3} placeholder="Keterangan pengumuman..." value={formData.newAnnDeskripsi || ""} onChange={e => patchForm({ newAnnDeskripsi: e.target.value })} /></div>
          </Dialog>

        {/* ── Pengaturan Tampilan Login ── */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🎨 Pengaturan Tampilan Login</div>
          </div>
          <div className="card-body" style={{ display:"flex", flexDirection:"column", gap:16 }}>

            {/* Preview */}
            <div style={{ background:"linear-gradient(135deg,#1a8a5a,#27ae60)", borderRadius:16, padding:"24px 20px", textAlign:"center", color:"white" }}>
              <div style={{ marginBottom:10 }}>
                {(loginConfig.logoUrl)
                  ? <img src={loginConfig.logoUrl} alt="Logo" style={{ width:72, height:72, borderRadius:"50%", objectFit:"cover", border:"3px solid rgba(255,255,255,.4)", display:"inline-block" }} />
                  : <div style={{ fontSize:48 }}>🏫</div>
                }
              </div>
              <div style={{ fontSize:11, opacity:.7, letterSpacing:2, marginBottom:2 }}>{loginConfig.eduTag || "EDUCATION PORTAL"}</div>

            <div className="form-group" style={{ margin:0 }}>
              <label className="label">📷 Logo Sekolah</label>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                {loginConfig.logoUrl && (
                  <img src={loginConfig.logoUrl} alt="Logo" style={{ width:52, height:52, borderRadius:"50%", objectFit:"cover", border:"2px solid #e0e0e0" }} />

                <label style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 16px", background:"#f0fdf4", border:"1.5px dashed #27ae60", borderRadius:10, cursor:"pointer", fontSize:13, fontWeight:600, color:"#27ae60" }}>

                  <input type="file" accept="image/*" style={{ display:"none" }} onChange={e => {

                {loginConfig.logoUrl && (
                  <button onClick={() => saveLoginConfig({ logoUrl: null })} style={{ padding:"6px 12px", fontSize:12, background:"#fee2e2", color:"#dc2626", border:"none", borderRadius:8, cursor:"pointer", fontWeight:600 }}>🗑️ Hapus</button>
                )}
              </div>
            </div>

            {/* Nama Sekolah */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">🏫 Nama Sekolah</label>
              <input className="input" placeholder="Bunayya Islamic School"
                value={formData.cfg_namaSekolah ?? (loginConfig.namaSekolah || "")}
                onChange={e => patchForm({ cfg_namaSekolah: e.target.value })} />
            </div>

            {/* Tagline */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">✨ Tagline / Slogan</label>
              <input className="input" placeholder="Menuju Generasi Qur'ani"
                value={formData.cfg_tagline ?? (loginConfig.tagline || "")}
                onChange={e => patchForm({ cfg_tagline: e.target.value })} />
            </div>

            {/* Education Tag */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">🏷️ Label Atas (Education Tag)</label>
              <input className="input" placeholder="EDUCATION PORTAL"
                value={formData.cfg_eduTag ?? (loginConfig.eduTag || "")}
                onChange={e => patchForm({ cfg_eduTag: e.target.value })} />
            </div>

            <button
              onClick={() => {
                saveLoginConfig({
                  namaSekolah: formData.cfg_namaSekolah ?? loginConfig.namaSekolah ?? "Bunayya Islamic School",
                  tagline:     formData.cfg_tagline     ?? loginConfig.tagline     ?? "Menuju Generasi Qur'ani",
                  eduTag:      formData.cfg_eduTag      ?? loginConfig.eduTag      ?? "EDUCATION PORTAL",
                });
                patchForm({ cfg_namaSekolah: undefined, cfg_tagline: undefined, cfg_eduTag: undefined });
                alert("✅ Pengaturan tampilan login berhasil disimpan!");
              }}
              className="btn btn-primary"
            >
              💾 Simpan Pengaturan

        </div>

        {/* ── Pengaturan Slide ── */}
        {(() => {

            { title: "Pantau Perkembangan", sub: "Anak Anda setiap hari",    bg: "linear-gradient(135deg,#1565c0,#1e88e5)", imgUrl: null },
            { title: "Generasi Qur'ani",   sub: "Berakhlak & Berprestasi",  bg: "linear-gradient(135deg,#6a1b9a,#9c27b0)", imgUrl: null },
          ];
          const slides = (loginConfig.slides && loginConfig.slides.length > 0) ? loginConfig.slides : defaultSlides;

          const updateSlide = (idx, patch) => {
            const next = slides.map((s, i) => i === idx ? { ...s, ...patch } : s);

          const uploadImage = (idx, file) => {
            if (!file) return;
            compressImage(file, 600, 0.75).then(dataUrl => updateSlide(idx, { imgUrl: dataUrl }));

                  <div key={idx} style={{ border:"1.5px solid #e8e8e8", borderRadius:14, overflow:"hidden" }}>
                    {/* Preview mini */}
                    <div style={{
                      height:80, background: slide.imgUrl ? `url(${slide.imgUrl}) center/cover` : slide.bg,
                      display:"flex", alignItems:"center", padding:"0 16px", position:"relative"

  // Pengaturan Mapel
  if (menu === "pengaturan-mapel") {

      if (!formData.newMapelNama) { alert("Nama mapel wajib diisi!"); return; }

        const editId = formData.editMapelId;
        const updated = { ...data.subjects.find(s => s.id === editId), name: formData.newMapelNama };

          const next = { ...d, subjects: d.subjects.map(s => s.id === editId ? updated : s) };

}

    const saveSiswa = () => {
      if (!formData.newSiswaNis || !formData.newSiswaNama || !formData.newSiswaKelas) {
        alert("NIS, Nama, dan Kelas wajib diisi!"); return;
      }
      if (formData.editSiswaId) {
        const editId = formData.editSiswaId;
        const updated = { ...data.students.find(s => s.id === editId), nis: formData.newSiswaNis, nama: formData.newSiswaNama, class_name: formData.newSiswaKelas };
        setData(d => {
          const next = { ...d, students: d.students.map(s => s.id === editId ? updated : s) };

function PortalWali({ menu, data, formData, patchForm, user }) {
  const studentData = user?.role === "student"
    ? data.students.find(s => s.nis === user.nis)
    : data.students.find(s => s.id === formData.wali_siswa);

  const sid = studentData?.id || formData.wali_siswa;

  const studentAtt = data.studentAttendance.filter(a => a.studentId === sid);
  const studentGrades = data.grades.filter(g => g.studentId === sid);
  const studentReports = data.dailyReports.filter(r => r.studentId === sid);
  const studentActs = data.activities.filter(a => a.studentId === sid);
  const studentTargets = data.targets.filter(t => t.studentId === sid);
  const studentZiyadah = data.ziyadah.filter(z => z.studentId === sid);

  const hadirCount = studentAtt.filter(a => a.status === "Hadir").length;
  const attPct = studentAtt.length > 0 ? Math.round((hadirCount / studentAtt.length) * 100) : 0;
  const avgGrade = studentGrades.length > 0 ? Math.round(studentGrades.reduce((a, g) => a + g.skor, 0) / studentGrades.length) : 0;

  const attColors = { Hadir: "#065f46", Sakit: "#92400e", Izin: "#1e40af", Alpa: "#991b1b" };
  const attBg = { Hadir: "#d1fae5", Sakit: "#fef3c7", Izin: "#dbeafe", Alpa: "#fee2e2" };

  return (
    <div>
      {/* Hero */}
      <div className="hero-card hero-card-purple" style={{ marginBottom: 20 }}>

        {user?.role !== "student" && (

                <option value="" style={{ color: "#1a1a1a" }}>-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k} style={{ color: "#1a1a1a" }}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group" style={{ margin: 0 }}>
              <label className="label" style={{ color: "rgba(255,255,255,.8)" }}>Siswa</label>
              <div className="select-wrap"><select className="select" style={{ background: "rgba(255,255,255,.15)", border: "1px solid rgba(255,255,255,.3)", color: "white" }} value={formData.wali_siswa || ""} onChange={e => patchForm({ wali_siswa: e.target.value })} disabled={!formData.wali_kelas}>
                <option value="" style={{ color: "#1a1a1a" }}>{formData.wali_kelas ? "-- Pilih Siswa --" : "Pilih kelas dulu"}</option>
                {data.students.filter(s => s.class_name === formData.wali_kelas).map(s => <option key={s.id} value={s.id} style={{ color: "#1a1a1a" }}>{s.nama}</option>)}
              </select></div>
            </div>
          </div>
        )}
        {studentData && (
          <div style={{ marginTop: user?.role !== "student" ? 12 : 0 }}>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,.75)" }}>{studentData.class_name}</div>
            <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "Amiri, serif" }}>{studentData.nama}</div>
          </div>
        )}
      </div>

      {/* Dashboard */}
      {menu === "dashboard" && (
        <div>
          {/* Tombol Download */}
          {(() => {
            const [downloading, setDownloading] = React.useState(false);
            const handleDownload = () => {
              const el = document.getElementById("wali-dashboard-capture");
              if (!el) { alert("Konten belum siap, coba lagi."); return; }
              if (typeof html2canvas === "undefined") { alert("Library belum siap, tunggu sebentar lalu coba lagi."); return; }
              setDownloading(true);
              html2canvas(el, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#ffffff",
                logging: false,
                onclone: (doc) => {
                  // Pastikan semua elemen visible di clone
                  doc.getElementById("wali-dashboard-capture").style.display = "block";
                }
              }).then(canvas => {
                const link = document.createElement("a");
                link.download = `rekap-${(studentData?.nama||"siswa").replace(/ /g,"-")}-${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setDownloading(false);
              }).catch(err => {
                console.error("Download error:", err);
                alert("Gagal download: " + err.message);
                setDownloading(false);
              });

            </div>
            <div className="card">
              <div className="card-header"><div className="card-title">📊 Nilai Terbaru</div></div>
              <div className="card-body">
                {studentGrades.length === 0 ? <div className="empty-state">Belum ada nilai</div> : (
                  <div className="grid grid-2" style={{ gap: 10 }}>
                    {studentGrades.slice(0, 4).map(g => (
                      <div key={g.id} style={{ background: "#f8fafc", borderRadius: 10, padding: 12, textAlign: "center" }}>
                        <div className="text-xs text-muted">{g.mataPelajaran}</div>
                        <div style={{ fontSize: 28, fontWeight: 700, color: g.skor >= 80 ? "#065f46" : g.skor >= 60 ? "#92400e" : "#991b1b" }}>{g.skor}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div className="card">
              <div className="card-header"><div className="card-title">🏆 Target Pencapaian</div></div>
              <div className="card-body">
                {studentTargets.length === 0 ? <div className="empty-state">Belum ada target</div> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {studentTargets.slice(0, 3).map(t => (
                      <div key={t.id}>
                        <div className="flex justify-between mb-1">
                          <span style={{ fontSize: 13, fontWeight: 600 }}>{t.mataPelajaran}</span>
                          <span className="text-xs text-muted">{t.progressSaatIni}/{t.progressTotal} {t.satuan}</span>
                        </div>
                        <ProgressBar value={(t.progressSaatIni / t.progressTotal) * 100} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div className="card">
              <div className="card-header"><div className="card-title">🎯 Kegiatan Terbaru</div></div>
              <div className="card-body">
                {studentActs.length === 0 ? <div className="empty-state">Belum ada kegiatan</div> : (
                  <div className="row-list">
                    {studentActs.slice(0, 4).map(a => (
                      <div key={a.id} className="row-item">
                        <div><div style={{ fontWeight: 600, fontSize: 13 }}>{a.kategori}</div><div className="text-xs text-muted">{a.tanggal}</div></div>
                        <StatusBadge status={a.penilaian} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div className="card">
              <div className="card-header"><div className="card-title">📖 Hafalan</div></div>
              <div className="card-body">
                {studentZiyadah.length === 0 ? <div className="empty-state">Belum ada hafalan</div> : (
                  <div className="row-list">
                    {studentZiyadah.slice(0, 4).map(z => (
                      <div key={z.id} className="row-item">
                        <div><div style={{ fontWeight: 600, fontSize: 13 }}>{z.surat}</div><div className="text-xs text-muted">{z.juz} — {z.tanggal}</div></div>
                        <StatusBadge status={z.hasil} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
          </div>{/* end wali-dashboard-capture */}
        </div>
      )}

      {menu === "notifikasi" && (
        <div>
          {/* Pengumuman Sekolah */}
          <div className="card mb-4">
            <div className="card-header">
              <div className="card-title">📢 Pengumuman Sekolah</div>
            </div>
            <div className="card-body">
              {data.announcements.length === 0
                ? <div className="empty-state">Belum ada pengumuman</div>
                : data.announcements.map((a, i) => (
                  <div key={a.id || i} style={{ display:"flex", gap:14, alignItems:"flex-start", padding:"14px 0", borderBottom: i < data.announcements.length-1 ? "1px solid #f0f0f0" : "none" }}>
                    <div style={{ width:44, height:44, borderRadius:12, background:"#eff6ff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0 }}>{a.icon || "📢"}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>{a.judul}</div>
                      <div style={{ fontSize:13, color:"#666", lineHeight:1.5 }}>{a.deskripsi}</div>
                      {a.tanggal && <div style={{ fontSize:11, color:"#aaa", marginTop:4 }}>📅 {a.tanggal}</div>}
                    </div>
                  </div>
                ))
              }
            </div>
          </div>

          {/* Aktivitas terbaru siswa */}
          {studentData && (
            <div className="card mb-4">
              <div className="card-header">
                <div className="card-title">🔔 Aktivitas Terbaru {studentData.nama}</div>
              </div>
              <div className="card-body">
                {(() => {
                  const items = [
                    ...studentAtt.map(a => ({ tanggal: a.tanggal, icon: a.status === "Hadir" ? "✅" : a.status === "Sakit" ? "🤒" : a.status === "Izin" ? "📄" : "❌", teks: `Absensi: ${a.status}`, bg:"#ecfdf5", warna:"#065f46" })),
                    ...studentGrades.map(g => ({ tanggal: g.tanggal, icon: "📊", teks: `Nilai ${g.mataPelajaran}: ${g.skor}`, bg:"#ede9fe", warna:"#5b21b6" })),
                    ...studentReports.map(r => ({ tanggal: r.tanggal, icon: "📝", teks: `Laporan Harian: ${r.bahasan || r.mataPelajaran || ""}`, bg:"#fef3c7", warna:"#92400e" })),
                    ...studentActs.map(a => ({ tanggal: a.tanggal, icon: "🎯", teks: `Kegiatan: ${a.kategori || a.mataPelajaran || ""}`, bg:"#eff6ff", warna:"#1e40af" })),
                    ...studentTargets.map(t => ({ tanggal: t.tanggal, icon: "🏆", teks: `Target: ${t.namaTarget || t.catatan || ""}`, bg:"#fee2e2", warna:"#991b1b" })),
                    ...studentZiyadah.map(z => ({ tanggal: z.tanggal, icon: "📖", teks: `Hafalan: ${z.surah || ""} ${z.ayat ? "ayat "+z.ayat : ""}`, bg:"#d1fae5", warna:"#065f46" })),
                  ].sort((a, b) => (b.tanggal || "").localeCompare(a.tanggal || "")).slice(0, 20);

                  if (items.length === 0) return <div className="empty-state">Belum ada aktivitas tercatat</div>;
                  return items.map((item, i) => (
                    <div key={i} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"10px 0", borderBottom: i < items.length-1 ? "1px solid #f5f5f5" : "none" }}>
                      <div style={{ width:36, height:36, borderRadius:10, background:item.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>{item.icon}</div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:13, fontWeight:600, color:item.warna }}>{item.teks}</div>
                        <div style={{ fontSize:11, color:"#aaa", marginTop:2 }}>📅 {item.tanggal || "-"}</div>
                      </div>
                    </div>
                  ));
                })()}
              </div>
            </div>
          )}
        </div>
      )}

      {menu === "absensi" && (
        <div className="card">
          <div className="card-header"><div className="card-title">📋 Laporan Absensi Siswa</div></div>
          <div className="card-body">
            <div className="flex gap-4 mb-4" style={{ justifyContent: "center" }}>
              {STATUS_ABSENSI.map(st => {
                const count = studentAtt.filter(a => a.status === st).length;
                return (
                  <div key={st} style={{ textAlign: "center", padding: "12px 20px", background: attBg[st], borderRadius: 12 }}>
                    <div style={{ fontSize: 28, fontWeight: 700, color: attColors[st] }}>{count}</div>
                    <div style={{ fontSize: 12, color: attColors[st] }}>{st}</div>
                  </div>
                );
              })}
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Tanggal</th><th>Status</th></tr></thead>
                <tbody>
                  {studentAtt.length === 0 ? <tr><td colSpan={2} className="empty-state">Tidak ada data</td></tr> : studentAtt.map(a => <tr key={a.id}><td>{a.tanggal}</td><td><StatusBadge status={a.status} /></td></tr>)}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {menu === "harian" && (
        <div className="card">
          <div className="card-header"><div className="card-title">📝 Laporan Harian</div></div>
          <div className="card-body">
            {studentReports.length === 0 ? <div className="empty-state">Tidak ada laporan harian</div> : (
              <div className="row-list">
                {studentReports.map(r => (
                  <div key={r.id} className="row-item">
                    <div>
                      <div style={{ fontWeight: 600 }}>{r.bahasan}</div>
                      <div className="text-sm text-muted">{r.tanggal}{r.halaman ? ` — Hal. ${r.halaman}` : ""}</div>
                      {r.catatan && <div className="text-xs text-muted">{r.catatan}</div>}
                    </div>
                    <StatusBadge status={r.hasil} />
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {menu === "nilai" && (
        <div className="card">
          <div className="card-header"><div className="card-title">📊 Nilai</div></div>
          <div className="card-body">
            {studentGrades.length > 0 && (
              <div className="grid grid-4 mb-4" style={{ gap: 12 }}>
                {studentGrades.slice(0, 8).map(g => (
                  <div key={g.id} style={{ background: "#f8fafc", borderRadius: 10, padding: 12, textAlign: "center" }}>
                    <div className="text-xs text-muted">{g.mataPelajaran}</div>
                    <div style={{ fontSize: 28, fontWeight: 700 }}>{g.skor}</div>
                  </div>
                ))}
              </div>
            )}
            <div className="table-wrap">
              <table>
                <thead><tr><th>Tanggal</th><th>Mapel</th><th>Jenis</th><th>Nilai</th></tr></thead>
                <tbody>
                  {studentGrades.length === 0 ? <tr><td colSpan={4} className="empty-state">Tidak ada data nilai</td></tr> : studentGrades.map(g => <tr key={g.id}><td className="text-sm">{g.tanggal}</td><td>{g.mataPelajaran}</td><td><Badge variant="gray">{g.jenisNilai}</Badge></td><td style={{ fontWeight: 700 }}>{g.skor}</td></tr>)}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {menu === "kegiatan" && (
        <div className="card">
          <div className="card-header"><div className="card-title">🎯 Laporan Kegiatan</div></div>
          <div className="card-body">
            {studentActs.length === 0 ? <div className="empty-state">Tidak ada kegiatan</div> : (
              <div className="row-list">
                {studentActs.map(a => (
                  <div key={a.id} className="row-item">
                    <div><div style={{ fontWeight: 600 }}>{a.kategori}</div><div className="text-sm text-muted">{a.tanggal}</div>{a.deskripsi && <div className="text-xs text-muted">{a.deskripsi}</div>}</div>
                    <StatusBadge status={a.penilaian} />
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {menu === "target" && (
        <div className="card">
          <div className="card-header"><div className="card-title">🏆 Target Pencapaian</div></div>
          <div className="card-body">
            {studentTargets.length === 0 ? <div className="empty-state">Tidak ada target</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                {studentTargets.map(t => (
                  <div key={t.id} style={{ background: "#f8fafc", borderRadius: 12, padding: 16 }}>
                    <div className="flex justify-between items-center mb-2">
                      <div style={{ fontWeight: 700 }}>{t.mataPelajaran}</div>
                      <Badge variant="outline">{t.progressSaatIni}/{t.progressTotal} {t.satuan}</Badge>
                    </div>
                    <ProgressBar value={(t.progressSaatIni / t.progressTotal) * 100} />
                    <div className="flex justify-between mt-2">
                      <StatusBadge status={t.hasil} />
                      <span className="text-xs text-muted">{t.tanggal}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {menu === "hafalan" && (
        <div className="card">
          <div className="card-header"><div className="card-title">📖 Surat yang Dihafal</div></div>
          <div className="card-body">
            {studentZiyadah.length === 0 ? <div className="empty-state">Tidak ada hafalan</div> : (
              <div className="row-list">
                {studentZiyadah.map(z => (
                  <div key={z.id} className="row-item">
                    <div><div style={{ fontWeight: 600 }}>{z.surat}</div><div className="text-sm text-muted">{z.juz} — {z.tanggal}</div>{z.progress && <div className="text-xs text-muted">{z.progress}</div>}</div>
                    <StatusBadge status={z.hasil} />
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
    var loadEl = document.getElementById("app-loading");
    if (loadEl) loadEl.style.display = "none";
  </script>
</body>
</html>
