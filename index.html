  <!-- PWA Meta Tags -->
  <meta name="application-name" content="Bunayya SMILE Hub" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bunayya" />

  <!-- PWA: Manifest + Service Worker + Install Otomatis -->
  <script>
  (function() {
    // Jangan jalankan jika sudah standalone (sudah terinstall)
    if (window.matchMedia("(display-mode:standalone)").matches || navigator.standalone) return;

    /* ── ICON via Canvas ─────────────────────────────────────────────────── */
    function makeIcon(size) {
      var c = document.createElement("canvas");
      c.width = c.height = size;
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#1d7a5f";
      ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.fill();
      ctx.font = Math.round(size*0.52)+"px serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🕌", size/2, size/2 + size*0.03);
      return c.toDataURL("image/png");
    }
    var icon = makeIcon(512);

    /* ── MANIFEST ────────────────────────────────────────────────────────── */
    var manifest = {
      name:"Bunayya SMILE Hub", short_name:"Bunayya",
      description:"Portal Manajemen Pendidikan Bunayya Islamic School",
      start_url: location.href,
      display:"standalone",
      background_color:"#1d7a5f", theme_color:"#1d7a5f",
      orientation:"portrait-primary",
      icons:[
        {src:icon,sizes:"192x192",type:"image/png",purpose:"any"},
        {src:icon,sizes:"512x512",type:"image/png",purpose:"maskable"}
      ]
    };
    var mb = new Blob([JSON.stringify(manifest)],{type:"application/json"});
    var ml = document.createElement("link"); ml.rel="manifest"; ml.href=URL.createObjectURL(mb);
    document.head.appendChild(ml);
    // Apple
    var al = document.createElement("link"); al.rel="apple-touch-icon"; al.href=icon;
    document.head.appendChild(al);

    /* ── SERVICE WORKER ──────────────────────────────────────────────────── */
    if ("serviceWorker" in navigator) {
      var swCode = [
        'const C="bny-v2";',
        'self.addEventListener("install",function(e){self.skipWaiting();});',
        'self.addEventListener("activate",function(e){',
        '  e.waitUntil(caches.keys().then(function(ks){',
        '    return Promise.all(ks.filter(function(k){return k!==C;}).map(function(k){return caches.delete(k);}));',
        '  }));self.clients.claim();',
        '});',
        'self.addEventListener("fetch",function(e){',
        '  if(e.request.mode==="navigate"){',
        '    e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request)||new Response("");}));',
        '  }',
        '});'
      ].join("\n");
      try {
        var swBlob = new Blob([swCode],{type:"text/javascript"});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob),{scope:"./"})
          .then(function(r){console.log("✅ SW ok:",r.scope);})
          .catch(function(e){console.warn("SW:",e);});
      } catch(e){console.warn("SW err:",e);}
    }

    /* ── STATE ───────────────────────────────────────────────────────────── */
    var _prompt = null;
    var _shown  = false;

    /* ── UI HELPERS ──────────────────────────────────────────────────────── */
    function removeAll() {
      ["_pwa_overlay","_pwa_fab","_pwa_topbar"].forEach(function(id){
        var el=document.getElementById(id); if(el)el.remove();
      });
    }

    // Overlay besar di tengah — muncul otomatis saat pertama buka
    function showOverlay() {
      if (document.getElementById("_pwa_overlay")) return;
      var isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase());
      var isSamsung = /SamsungBrowser/i.test(navigator.userAgent);
      var isMobile  = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
      if (!isMobile) return; // hanya tampilkan di HP

      var stepsHTML = "";
      if (_prompt) {
        stepsHTML = '<button id="_pwa_ol_install" style="width:100%;padding:16px;background:linear-gradient(135deg,#1d7a5f,#28a87e);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:sans-serif;box-shadow:0 4px 20px rgba(29,122,95,.4);">📲 Pasang Sekarang</button>';
      } else if (isIOS) {
        stepsHTML = [
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">1️⃣ Ketuk ikon <b>Bagikan ↑</b> di bawah Safari</div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">2️⃣ Pilih <b>Tambahkan ke Layar Utama</b></div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">3️⃣ Ketuk <b>Tambahkan</b> ✅</div>'
        ].join("");
      } else if (isSamsung) {
        stepsHTML = [
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">1️⃣ Ketuk <b>⋮ Menu</b> pojok kanan atas</div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">2️⃣ Pilih <b>Tambahkan halaman ke</b></div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">3️⃣ Pilih <b>Layar Utama</b></div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">4️⃣ Pilih <b>Tambah sebagai pintasan</b> ✅</div>'
        ].join("");
      } else {
        stepsHTML = [
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">1️⃣ Ketuk <b>⋮ Menu</b> pojok kanan atas Chrome</div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">2️⃣ Pilih <b>Tambahkan ke layar utama</b></div>',
          '<div style="background:#f0fdf4;border-left:4px solid #1d7a5f;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.7;">3️⃣ Ketuk <b>Tambahkan</b> ✅</div>'
        ].join("");
      }

      var ov = document.createElement("div");
      ov.id = "_pwa_overlay";
      ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;";
      ov.innerHTML = '<div style="background:#fff;border-radius:24px;padding:28px 24px 28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4);">'
        + '<div style="text-align:center;margin-bottom:20px;">'
        + '<div style="font-size:56px;margin-bottom:8px;">🕌</div>'
        + '<div style="font-weight:800;font-size:20px;color:#1d7a5f;">Bunayya SMILE Hub</div>'
        + '<div style="font-size:13px;color:#64748b;margin-top:4px;">Pasang di layar utama HP Anda</div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">'
        + stepsHTML
        + '</div>'
        + '<button id="_pwa_ol_skip" style="width:100%;padding:12px;background:#f1f5f9;color:#64748b;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:sans-serif;">Nanti saja</button>'
        + '</div>';
      document.body.appendChild(ov);

      var skipBtn = document.getElementById("_pwa_ol_skip");
      if (skipBtn) skipBtn.onclick = function(){ ov.remove(); showFAB(); };

      var instBtn = document.getElementById("_pwa_ol_install");
      if (instBtn) instBtn.onclick = function(){ doInstall(); ov.remove(); };

      _shown = true;
    }

    // Tombol FAB kecil di kanan bawah (fallback setelah overlay ditutup)
    function showFAB() {
      if (document.getElementById("_pwa_fab")) return;
      var fab = document.createElement("button");
      fab.id = "_pwa_fab";
      fab.innerHTML = "📲";
      fab.title = "Pasang di layar utama";
      fab.style.cssText = [
        "position:fixed;bottom:20px;right:16px;z-index:99999;",
        "width:52px;height:52px;border-radius:50%;border:none;",
        "background:linear-gradient(135deg,#1d7a5f,#28a87e);",
        "color:#fff;font-size:22px;cursor:pointer;",
        "box-shadow:0 4px 20px rgba(29,122,95,.6);",
        "animation:_pwa_pulse 2.5s ease-in-out infinite;"
      ].join("");
      fab.onclick = function(){ doInstall(); };
      document.body.appendChild(fab);
    }

    function doInstall() {
      if (_prompt) {
        _prompt.prompt();
        _prompt.userChoice.then(function(r){
          if (r.outcome==="accepted") removeAll();
          _prompt = null;
        });
      } else {
        showOverlay();
      }
    }

    /* ── EVENTS ──────────────────────────────────────────────────────────── */
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      _prompt = e;
      console.log("✅ beforeinstallprompt ready");
      // Jika overlay sudah muncul, update tombolnya langsung
      var ov = document.getElementById("_pwa_overlay");
      if (ov) {
        // Refresh overlay dengan tombol install
        ov.remove();
        _shown = false;
        showOverlay();
      } else {
        showOverlay();
      }
    });

    window.addEventListener("appinstalled", function() {
      removeAll();
      console.log("✅ PWA installed!");
    });

    /* ── AUTO SHOW setelah halaman siap ─────────────────────────────────── */
    window.__showPwaOverlay = showOverlay;
    window._pwaInstall = doInstall;

    window.addEventListener("load", function() {
      // Langsung tampilkan overlay setelah 1.5 detik
      setTimeout(function() {
        if (!_shown) showOverlay();
        // Fallback FAB jika bukan mobile
        setTimeout(showFAB, 500);
      }, 1500);
    });

  })();
  </script>
  <style>
    @keyframes _pwa_pulse {
      0%,100% { box-shadow:0 4px 20px rgba(29,122,95,.6); transform:scale(1); }
      50%      { box-shadow:0 4px 32px rgba(29,122,95,.9),0 0 0 8px rgba(29,122,95,.15); transform:scale(1.08); }
    }
  </style>

  <style>

  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f0ede8; color: #1a1a1a; }

  :root {
    --emerald: #1d7a5f;
    --emerald-light: #28a87e;
    --emerald-dark: #135544;
    --sand: #f0ede8;
    --sand-dark: #e6e2dc;
    --gold: #c8963e;
    --gold-light: #e8b55a;
    --ink: #1a1a1a;
    --ink-light: #4a4a4a;
    --ink-muted: #8a8a8a;
    --white: #fdfcfb;
    --blue: #2563a8;
    --purple: #6b3fa0;
    --red: #c0392b;
    --surface: #fdfcfb;
    --surface-raised: #ffffff;
  }

  .app { min-height: 100vh; background: var(--sand); }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--emerald-dark) 0%, var(--emerald) 60%, var(--emerald-light) 100%);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.25);
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .header-title { font-family: 'Amiri', serif; font-size: 20px; color: white; font-weight: 700; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 1px; }
  .header-user { display: flex; align-items: center; gap: 12px; }
  .header-user-info { text-align: right; }
  .header-user-name { font-size: 13px; font-weight: 600; color: white; }
  .header-user-role { font-size: 11px; color: rgba(255,255,255,0.7); text-transform: capitalize; }
  .btn-logout {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    color: white;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.25); }

  /* ── PORTAL TABS ── */
  .portal-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--sand-dark);
    padding: 0 24px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    position: sticky;
    top: 64px;
    z-index: 90;
  }
  .portal-tab {
    padding: 14px 20px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-muted);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all .2s;
  }
  .portal-tab:hover { color: var(--ink); }
  .portal-tab.active-guru { color: var(--emerald); border-color: var(--emerald); }
  .portal-tab.active-siswa { color: var(--blue); border-color: var(--blue); }
  .portal-tab.active-wali { color: var(--purple); border-color: var(--purple); }

  /* ── MENU BAR ── */
  .menu-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--sand-dark);
    padding: 0 24px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .menu-btn {
    padding: 11px 16px;
    font-size: 12.5px;
    font-weight: 500;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all .2s;
    border-radius: 6px 6px 0 0;
  }
  .menu-btn:hover { color: var(--ink); background: var(--sand); }
  .menu-btn.active { background: var(--sand); color: var(--emerald); border-color: var(--emerald); }
  .menu-btn.active-blue { background: var(--sand); color: var(--blue); border-color: var(--blue); }
  .menu-btn.active-purple { background: var(--sand); color: var(--purple); border-color: var(--purple); }

  /* ── LAYOUT ── */
  .content { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; gap: 20px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .grid-5 { grid-template-columns: repeat(5, 1fr); }
  .grid-8 { grid-template-columns: repeat(8, 1fr); }
  @media(max-width:1024px) { .grid-8 { grid-template-columns: repeat(4,1fr); } .grid-4 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } }
  @media(max-width:640px) { .grid-2,.grid-3,.grid-4,.grid-5,.grid-8 { grid-template-columns: 1fr 1fr; } }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--sand-dark);
    overflow: hidden;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--sand-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .card-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .card-body { padding: 20px 24px; }

  /* ── STATS CARD ── */
  .stat-card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--sand-dark);
    padding: 20px;
    text-align: center;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    transition: transform .2s, box-shadow .2s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .stat-icon { font-size: 28px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--ink); }
  .stat-label { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }

  /* ── FORM ── */
  .form-group { margin-bottom: 16px; }
  .label { font-size: 12px; font-weight: 600; color: var(--ink-light); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: .5px; }
  .input, .select, .textarea {
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    border: 1.5px solid var(--sand-dark);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
    appearance: none;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(29,122,95,.1); }
  .textarea { resize: vertical; min-height: 80px; }
  .select-wrap { position: relative; }
  .select-wrap::after { content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-muted); font-size: 12px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--emerald); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--emerald-dark); }
  .btn-blue { background: var(--blue); color: white; }
  .btn-blue:hover:not(:disabled) { background: #1e4d8a; }
  .btn-purple { background: var(--purple); color: white; }
  .btn-purple:hover:not(:disabled) { background: #4e2d75; }
  .btn-gold { background: var(--gold); color: white; }
  .btn-gold:hover:not(:disabled) { background: #a6793a; }
  .btn-outline { background: none; border: 1.5px solid var(--sand-dark); color: var(--ink); }
  .btn-outline:hover:not(:disabled) { border-color: var(--emerald); color: var(--emerald); }
  .btn-ghost { background: none; color: var(--ink-muted); padding: 6px 10px; border-radius: 8px; }
  .btn-ghost:hover { background: var(--sand); color: var(--ink); }
  .btn-danger { background: var(--red); color: white; padding: 6px 10px; }
  .btn-danger:hover:not(:disabled) { background: #a0281f; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

function Select({ value, onChange, options, placeholder, disabled }) {
  return (
    <div className="select-wrap">
      <select className="select" value={value} onChange={e => onChange(e.target.value)} disabled={disabled}>
        {placeholder && <option value="">{placeholder}</option>}
        {options.map(o => (
          <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>

}

function ProgressBar({ value }) {

      <div className="progress-bar-fill" style={{ width: `${Math.min(100, Math.max(0, value))}%` }} />
    </div>

}

function Badge({ children, variant = "gray" }) {

function Dialog({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="dialog-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="dialog">
        <div className="dialog-header">
          <span className="dialog-title">{title}</span>
          <button className="btn-ghost btn btn-icon" onClick={onClose}><Icon.X /></button>
        </div>
        <div className="dialog-body">{children}</div>
        {footer && <div className="dialog-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ── Download tabel riwayat sebagai PDF ──────────────────────────────────────
function downloadTablePDF(tableId, judul, namaFile) {
  const el = document.getElementById(tableId);
  if (!el) { alert("Tabel tidak ditemukan."); return; }

  const btn = document.getElementById("btn-pdf-" + tableId);
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Memproses..."; }

  // Tunggu html2canvas & jsPDF siap (maks 8 detik)
  const waitReady = (cb, tries) => {
    tries = tries || 0;
    const h2c  = typeof html2canvas !== "undefined";
    const jpdf = typeof window.jspdf !== "undefined" || typeof jspdf !== "undefined";
    if (h2c && jpdf) return cb();
    if (tries > 40) {
      alert("Library PDF belum siap. Pastikan koneksi internet aktif lalu refresh halaman.");
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
      return;
    }
    setTimeout(() => waitReady(cb, tries + 1), 200);
  };

  waitReady(() => {

  html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false })
    .then(canvas => {
      const jsPDFLib = (window.jspdf || jspdf).jsPDF;
      const imgW = canvas.width;
      const imgH = canvas.height;
      // A4 landscape jika tabel lebar
      const isLandscape = imgW > imgH;
      const pdf = new jsPDFLib({ orientation: isLandscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const usableW = pageW - margin * 2;
      const scale = usableW / (imgW / 2); // /2 karena scale:2 di html2canvas
      const imgHmm = (imgH / 2) * scale;

      // Header
      pdf.setFontSize(13);
      pdf.setFont("helvetica", "bold");
      pdf.text("BUNAYYA ISLAMIC SCHOOL", pageW / 2, margin + 4, { align: "center" });
      pdf.setFontSize(10);
      pdf.setFont("helvetica", "normal");
      pdf.text(judul, pageW / 2, margin + 9, { align: "center" });
      pdf.setFontSize(8);
      pdf.text("Dicetak: " + new Date().toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" }), pageW / 2, margin + 13, { align: "center" });

      // Garis pemisah
      const startY = margin + 16;
      pdf.setDrawColor(29, 122, 95);
      pdf.setLineWidth(0.5);
      pdf.line(margin, startY, pageW - margin, startY);

      // Tabel sebagai gambar
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      let y = startY + 3;
      const maxH = pageH - y - margin;

      if (imgHmm <= maxH) {
        pdf.addImage(imgData, "JPEG", margin, y, usableW, imgHmm);
      } else {
        // Multi-page jika tabel panjang
        let srcY = 0;
        while (srcY < imgH) {
          const sliceH = Math.min((maxH / scale) * 2, imgH - srcY);
          const sliceCanvas = document.createElement("canvas");
          sliceCanvas.width = imgW;
          sliceCanvas.height = sliceH;
          sliceCanvas.getContext("2d").drawImage(canvas, 0, srcY, imgW, sliceH, 0, 0, imgW, sliceH);
          pdf.addImage(sliceCanvas.toDataURL("image/jpeg", 0.95), "JPEG", margin, y, usableW, (sliceH / 2) * scale);
          srcY += sliceH;
          if (srcY < imgH) { pdf.addPage(); y = margin; }
        }
      }

      pdf.save(namaFile + ".pdf");
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    })
    .catch(err => {
      alert("Gagal: " + err.message);
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    });
  }); // end waitReady
}

  // ── Firebase Firestore Integration ───────────────────────────────────────
  const SCRIPT_URL = "";

  const FB_COLLECTIONS = {
    studentAttendance: "absensiSiswa",
    teacherAttendance: "absensiGuru",
    journals:          "jurnal",
    dailyReports:      "harian",
    grades:            "nilai",
    activities:        "kegiatan",
    targets:           "target",
    ziyadah:           "ziyadah",
    teachers:          "guru",
    students:          "siswa",
    subjects:          "mapel",
    quickLinks:        "quickLinks",
    announcements:     "announcements",
  };

  // ── Firebase realtime listeners ──────────────────────────────────────────
  React.useEffect(() => {
    const tryConnect = () => {
      if (!window.__firebase || !window.__firebase.ready) {
        setTimeout(tryConnect, 500);
        return;
      }
      const { db } = window.__firebase;
      const collMap = {
        absensiSiswa:  "studentAttendance",
        absensiGuru:   "teacherAttendance",
        jurnal:        "journals",
        harian:        "dailyReports",
        nilai:         "grades",
        kegiatan:      "activities",
        target:        "targets",
        ziyadah:       "ziyadah",
        guru:          "teachers",
        siswa:         "students",
        mapel:         "subjects",
        quickLinks:    "quickLinks",
        announcements: "announcements",
      };
      const unsubs = Object.entries(collMap).map(([fbColl, stateKey]) => {
        return db.collection(fbColl).onSnapshot((snap) => {
          const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }));

          // Auto-seed master data ke Firebase kalau masih kosong
          if (docs.length === 0 && fbColl === "guru") {
            const batch = db.batch();
            MOCK_TEACHERS.forEach(t => batch.set(db.collection("guru").doc(String(t.id)), t));
            batch.commit().catch(e => console.error("Seed guru error:", e));
          }
          if (docs.length === 0 && fbColl === "siswa") {
            const batch = db.batch();
            MOCK_STUDENTS.forEach(s => batch.set(db.collection("siswa").doc(String(s.id)), s));
            batch.commit().catch(e => console.error("Seed siswa error:", e));
          }
          if (docs.length === 0 && fbColl === "mapel") {
            const batch = db.batch();
            MOCK_SUBJECTS.forEach(s => batch.set(db.collection("mapel").doc(String(s.id)), s));
            batch.commit().catch(e => console.error("Seed mapel error:", e));
          }
          if (docs.length === 0 && fbColl === "quickLinks") {
            const batch = db.batch();
            MOCK_QUICKLINKS.forEach(l => batch.set(db.collection("quickLinks").doc(String(l.id)), l));
            batch.commit().catch(e => console.error("Seed quickLinks error:", e));
          }
          // Force-update link l1/l2/l3 jika masih pakai nama/url lama
          if (fbColl === "quickLinks" && docs.length > 0) {
            const oldTitles = { l1: "E-Learning", l2: "Google Classroom", l3: "PPDB Online" };
            const oldUrls   = { l3: "https://script.google.com/a/macros/admin.paud.belajar.id/s/AKfycbxXADFTW-6LkMMoi4X4k681iBwbpR-Bd5hVQLVO_rS1p9g6XtC8LfCoBezJQAGvGdM94Q/exec" };
            const updates = MOCK_QUICKLINKS.filter(ml => {
              const existing = docs.find(d => d.id === ml.id);
              return existing && (
                (oldTitles[ml.id] && existing.title === oldTitles[ml.id]) ||
                (oldUrls[ml.id]   && existing.url   === oldUrls[ml.id])
              );
            });
            if (updates.length > 0) {
              const batch = db.batch();
              updates.forEach(l => batch.set(db.collection("quickLinks").doc(String(l.id)), l));
              batch.commit().catch(e => console.error("Update quickLinks error:", e));
            }
          }
          if (docs.length === 0 && fbColl === "announcements") {
            const batch = db.batch();
            MOCK_ANNOUNCEMENTS.forEach(a => batch.set(db.collection("announcements").doc(String(a.id)), a));
            batch.commit().catch(e => console.error("Seed announcements error:", e));
          }

          // Firebase = sumber kebenaran tunggal
          // Tidak ada merge lokal — setiap perubahan langsung dari Firestore
          setData(prev => {
            const protectedKeys = ["teachers", "students", "subjects", "quickLinks", "announcements"];
            // Master data: pakai state lokal HANYA kalau Firebase benar-benar kosong (belum seed)
            const newVal = (docs.length === 0 && protectedKeys.includes(stateKey))
              ? prev[stateKey]
              : docs;
            const next = { ...prev, [stateKey]: newVal };
            try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
            return next;
          });
          setLastSync(new Date().toLocaleString("id-ID"));
          setSyncStatus("success");
          setTimeout(() => setSyncStatus("idle"), 2000);
        }, (err) => {
          console.error("Firebase listener error:", err);
        });
      });
      return () => unsubs.forEach(u => u());
    };
    const cleanup = tryConnect();
    return () => { if (typeof cleanup === "function") cleanup(); };
  }, []);
  // ─────────────────────────────────────────────────────────────────

  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | success | error
  const [syncMsg, setSyncMsg]       = useState("");
  const [lastSync, setLastSync]     = useState(null);

  // Data store
  // Load from localStorage or fallback to MOCK
  const loadStoredData = () => {
    try {
      const stored = localStorage.getItem("bunayya_data");
      if (stored) {
        const parsed = JSON.parse(stored);
        return {
          teachers:          parsed.teachers          || MOCK_TEACHERS,
          students:          parsed.students          || MOCK_STUDENTS,
          subjects: (() => {
            // Gabungkan MOCK_SUBJECTS (terbaru) dengan custom subjects dari localStorage
            const stored = parsed.subjects || [];
            const mockIds = new Set(MOCK_SUBJECTS.map(m => m.id));
            const customOnly = stored.filter(s => !mockIds.has(s.id));
            return [...MOCK_SUBJECTS, ...customOnly];
          })(),
          surahs:            parsed.surahs            || MOCK_SURAHS,
          quickLinks:        parsed.quickLinks        || MOCK_QUICKLINKS,
          announcements:     parsed.announcements     || MOCK_ANNOUNCEMENTS,
          studentAttendance: parsed.studentAttendance || MOCK_STUDENT_ATTENDANCE,
          teacherAttendance: parsed.teacherAttendance || MOCK_TEACHER_ATTENDANCE,

          ziyadah:           parsed.ziyadah           || [],
        };
      }
    } catch(e) {}
    return null;

  const [data, setData] = useState(loadStoredData() || {
    teachers:          MOCK_TEACHERS,
    students:          MOCK_STUDENTS,
    subjects:          MOCK_SUBJECTS,

  });

  // Listener Firebase untuk loginConfig (dokumen tunggal)

      if (!window.__firebase?.ready) { setTimeout(tryListen, 500); return; }

    if (user.role === "admin") return true;
    if (user.role === "teacher") {
      return !["master-guru", "master-siswa", "kelola-pintasan", "google-sheets", "pengaturan-mapel"].includes(section);
    }
    return ["dashboard", "absensi", "harian", "nilai", "kegiatan", "target", "hafalan"].includes(section);
  };

  // ── SAVE HANDLERS ────────────────────────────────────────────────────────────
  const saveAbsensiSiswa = () => {
    if (!formData.abs_kelas)    { alert("⚠️ Pilih kelas terlebih dahulu!"); return; }
    if (!formData.abs_students) { alert("⚠️ Klik tombol Muat Data terlebih dahulu!"); return; }
    const tanggal = formData.abs_tanggal || today();
    const newRecords = formData.abs_students.map(s => ({
      id: genId(), studentId: s.id, tanggal,
      kelas: formData.abs_kelas, status: s.status || "Hadir",
      student: { nama: s.nama }
    }));
    // Update state lokal (tambah ke array) - functional updater agar tidak stale
    setData(d => {
      const next = { ...d, studentAttendance: [...d.studentAttendance, ...newRecords] };
      try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
      return next;
    });
    // Tulis HANYA item baru ke Firebase
    writeDocs("studentAttendance", newRecords);
    patchForm({ abs_students: null, abs_kelas: "", abs_tanggal: "" });
    alert("✅ Absensi " + newRecords.length + " siswa berhasil disimpan!");
  };

  const saveAbsensiGuru = () => {
    if (!formData.abs_teacherId) { alert("⚠️ Pilih guru terlebih dahulu!"); return; }
    if (!formData.abs_kelasGuru) { alert("⚠️ Pilih kelas terlebih dahulu!"); return; }
    const t = data.teachers.find(t => t.id === formData.abs_teacherId);
    if (!t) { alert("⚠️ Guru tidak ditemukan!"); return; }
    const rec = {
      id: genId(),
      teacherId: t.id,
      tanggal: formData.abs_tanggalGuru || today(),
      kelas: formData.abs_kelasGuru,
      status: formData.abs_statusGuru || "Hadir",
      teacher: { nama: t.nama }
    };
    setData(d => {
      const next = { ...d, teacherAttendance: [...d.teacherAttendance, rec] };
      try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
      return next;
    });
    writeDoc("teacherAttendance", rec);
    patchForm({ abs_teacherId: "", abs_kelasGuru: "", abs_tanggalGuru: "", abs_statusGuru: "Hadir" });
    alert("✅ Absensi guru berhasil disimpan!");
  };

  const saveJurnal = () => {
    const t = data.teachers.find(t => t.id === formData.j_teacher);
    if (!t || !formData.j_kelas || !formData.j_topik) { alert("⚠️ Lengkapi data jurnal!"); return; }
    const rec = { id: genId(), teacherId: t.id, tanggal: formData.j_tanggal || today(), kelas: formData.j_kelas, mataPelajaran: formData.j_mapel || "", topik: formData.j_topik, kegiatan: formData.j_kegiatan || "", catatan: formData.j_catatan || "", teacher: { nama: t.nama } };
    setData(d => { const next = { ...d, journals: [...d.journals, rec] }; try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {} return next; });
    writeDoc("journals", rec);
    patchForm({ j_topik: "", j_kegiatan: "", j_catatan: "" });
    alert("✅ Jurnal berhasil disimpan!");
  };

  const saveHarian = () => {
    const s = data.students.find(s => s.id === formData.h_siswa);
    if (!s || !formData.h_bahasan || !formData.h_hasil) { alert("⚠️ Lengkapi data harian!"); return; }
    const rec = { id: genId(), studentId: s.id, tanggal: formData.h_tanggal || today(), kelas: s.class_name, bahasan: formData.h_bahasan, halaman: formData.h_halaman || "", hasil: formData.h_hasil, catatan: formData.h_catatan || "" };
    setData(d => { const next = { ...d, dailyReports: [...d.dailyReports, rec] }; try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {} return next; });
    writeDoc("dailyReports", rec);
    patchForm({ h_bahasan: "", h_halaman: "", h_catatan: "" });
    alert("✅ Laporan harian berhasil disimpan!");
  };

  const saveKegiatan = () => {};
  const saveKegiatanKelas = (kelas) => {
    const mapel   = formData[`kg_mapel_${kelas}`];
    const tanggal = formData[`kg_tanggal_${kelas}`] || today();
    if (!mapel) { alert("Pilih mata pelajaran terlebih dahulu!"); return; }
    const students = data.students.filter(s => s.class_name === kelas);
    const records  = students.map(s => ({
      id: genId(), studentId: s.id, tanggal, kelas,
      kategori: mapel, mataPelajaran: mapel,
      penilaian: formData[`kg_p_${kelas}_${s.id}`] || "Sangat Baik",
      deskripsi: ""
    }));
    setData(d => { const next = { ...d, activities: [...d.activities, ...records] }; try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {} return next; });
    writeDocs("activities", records);
    const patch = {};
    students.forEach(s => { patch[`kg_p_${kelas}_${s.id}`] = ""; });
    patchForm(patch);
    alert(`✅ ${records.length} laporan kegiatan berhasil disimpan!`);
  };

  const saveTarget = () => {
    if (!formData.tr_kelas || !formData.tr_siswa || !formData.tr_mapel || !formData.tr_hasil) {
      alert("⚠️ Kelas, Siswa, Mata Pelajaran, dan Hasil wajib diisi!"); return;
    }
    const s = data.students.find(s => s.id === formData.tr_siswa);
    const rec = {
      id: genId(),
      studentId: formData.tr_siswa,
      tanggal: today(),
      kelas: s?.class_name || formData.tr_kelas,
      mataPelajaran: formData.tr_mapel,
      progressSaatIni: parseInt(formData.tr_progress_val) || 0,
      progressTotal: parseInt(formData.tr_progress_total) || 100,
      satuan: formData.tr_satuan || "",
      hasil: formData.tr_hasil,
      catatan: formData.tr_catatan || ""
    };
    setData(d => { const next = { ...d, targets: [...d.targets, rec] }; try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {} return next; });
    writeDoc("targets", rec);
    patchForm({ tr_siswa: "", tr_mapel: "", tr_progress_val: "", tr_progress_total: "", tr_satuan: "", tr_hasil: "", tr_catatan: "" });
    alert("✅ Target berhasil disimpan!");
  };

  const saveZiyadah = () => {
    const s = data.students.find(s => s.id === formData.z_siswa);
    if (!s || !formData.z_juz || !formData.z_hasil) { alert("⚠️ Lengkapi data ziyadah!"); return; }
    const rec = { id: genId(), studentId: s.id, tanggal: formData.z_tanggal || today(), kelas: s.class_name, juz: formData.z_juz, surat: formData.z_surat || "", progress: formData.z_progress || "", hasil: formData.z_hasil, catatan: formData.z_catatan || "" };
    setData(d => { const next = { ...d, ziyadah: [...d.ziyadah, rec] }; try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {} return next; });
    writeDoc("ziyadah", rec);
    patchForm({ z_juz: "", z_surat: "", z_progress: "", z_catatan: "" });
    alert("✅ Ziyadah berhasil disimpan!");
  };

  const saveNilaiKelas = (kelas) => {
    const mapel   = formData[`nm_mapel_${kelas}`];
    const jenis   = formData[`nm_jenis_${kelas}`];
    const tanggal = formData[`nm_tanggal_${kelas}`] || today();
    if (!mapel || !jenis) { alert("Pilih mapel dan jenis nilai!"); return; }
    const students = data.students.filter(s => s.class_name === kelas);
    const records  = students
      .filter(s => formData[`nm_v_${kelas}_${s.id}`])
      .map(s => ({ id: genId(), studentId: s.id, tanggal, kelas, mataPelajaran: mapel, jenisNilai: jenis, skor: parseInt(formData[`nm_v_${kelas}_${s.id}`]) || 0, student: { nama: s.nama } }));
    if (!records.length) { alert("Masukkan nilai untuk minimal satu siswa!"); return; }
    setData(d => { const next = { ...d, grades: [...d.grades, ...records] }; try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {} return next; });
    writeDocs("grades", records);
    const patch = {};
    students.forEach(s => { patch[`nm_v_${kelas}_${s.id}`] = ""; });
    patchForm(patch);
    alert(`✅ ${records.length} nilai berhasil disimpan untuk ${kelas}!`);
  };

  // ── Google Sheets Sync Functions ─────────────────────────────────────────
  const resolveNames = (records, collection) => records.map(r => {
    const student = data.students.find(s => s.id === r.studentId);
    const teacher = data.teachers.find(t => t.id === r.teacherId);
    return {
      ...r,
      namaSiswa: student?.nama || r.student?.nama || "",
      namaGuru:  teacher?.nama || r.teacher?.nama  || "",
    };
  });

  // ── Firebase sync helpers (menggantikan Google Sheets) ───────────────────
  const jsonpPost = () => Promise.resolve(); // legacy stub, tidak dipakai

  const syncCollection = async (fbColl, records) => {
    if (!window.__firebase?.ready) return;
    const { db } = window.__firebase;
    try {
      const snap = await db.collection(fbColl).get();
      const existingIds = new Set(snap.docs.map(d => d.id));
      const batch = db.batch();
      records.forEach(item => {
        const ref = db.collection(fbColl).doc(String(item.id));
        if (!existingIds.has(String(item.id))) {
          batch.set(ref, item);
        }
      });
      await batch.commit();
    } catch(e) { console.error("syncCollection error:", e); }
  };

  const syncDelete = async (fbColl, id) => {
    if (!window.__firebase?.ready) return;
    try {
      await window.__firebase.db.collection(fbColl).doc(String(id)).delete();
    } catch(e) { console.error("syncDelete error:", e); }
  };

  // ── Firebase: Sync semua data sekaligus ─────────────────────────────────
  const syncAllToSheets = async () => {
    if (!window.__firebase?.ready) {
      alert("⚠️ Firebase belum terhubung, tunggu sebentar lalu coba lagi.");
      return;
    }
    setSyncStatus("syncing");
    setSyncMsg("🔄 Menyinkronkan semua data ke Firebase...");
    const { db } = window.__firebase;
    try {
      for (const [stateKey, fbColl] of Object.entries(FB_COLLECTIONS)) {
        const items = data[stateKey] || [];
        const snap = await db.collection(fbColl).get();
        const existingIds = new Set(snap.docs.map(d => d.id));
        const batch = db.batch();
        items.forEach(item => {
          const ref = db.collection(fbColl).doc(String(item.id));
          if (!existingIds.has(String(item.id))) {
            batch.set(ref, item);
          }
        });
        await batch.commit();
      }
      setSyncStatus("success");
      setSyncMsg("✅ Semua data berhasil disinkronkan ke Firebase!");
      setLastSync(new Date().toLocaleString("id-ID"));
    } catch(err) {
      setSyncStatus("error");
      setSyncMsg("❌ Gagal sinkron: " + err.message);
    }
    setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 4000);
  };

  const loadFromSheets = () => {
    setSyncStatus("syncing");
    setSyncMsg("🔄 Memuat ulang data dari Firebase...");
    // Data sudah auto-load via onSnapshot listener, cukup trigger feedback
    setTimeout(() => {
      setSyncStatus("success");
      setSyncMsg("✅ Data diperbarui dari Firebase (realtime aktif)");
      setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 3000);
    }, 1000);
  };

  const [deleteConfirm, setDeleteConfirm] = useState(null); // { collection, id, label }
  const deleteItem = (collection, id, label = "") => {
    setDeleteConfirm({ collection, id, label });
  };
  const confirmDelete = () => {
    if (!deleteConfirm) return;
    const { collection: collKey, id } = deleteConfirm;
    // Update state lokal - hapus item
    setData(d => ({ ...d, [collKey]: d[collKey].filter(i => i.id !== id) }));
    setDeleteConfirm(null);
    // Hapus dari Firebase
    const fbColl = FB_COLLECTIONS[collKey];
    if (fbColl && window.__firebase?.ready) {
      window.__firebase.db.collection(fbColl).doc(String(id)).delete()
        .catch(err => console.error("Delete error:", err));
    }
  };

  // ── RENDER ───────────────────────────────────────────────────────────────────
  if (!user) return <LoginPage loginRole={loginRole} setLoginRole={setLoginRole} loginForm={loginForm} setLoginForm={setLoginForm} loginError={loginError} handleLogin={handleLogin} data={data} loginConfig={loginConfig} />;

  // ── Custom delete confirm dialog ─────────────────────────────────────────
  const DeleteModal = () => deleteConfirm ? (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ background:"white", borderRadius:20, padding:28, maxWidth:360, width:"90%", boxShadow:"0 20px 60px rgba(0,0,0,.3)" }}>
        <div style={{ fontSize:40, textAlign:"center", marginBottom:12 }}>🗑️</div>
        <div style={{ fontWeight:800, fontSize:18, textAlign:"center", marginBottom:8 }}>Hapus Data?</div>
        <div style={{ fontSize:14, color:"#666", textAlign:"center", marginBottom:24 }}>
          {deleteConfirm.label ? `"${deleteConfirm.label}"` : "Data ini"} akan dihapus secara permanen dan tidak bisa dikembalikan.
        </div>
        <div style={{ display:"flex", gap:12 }}>
          <button className="btn btn-outline w-full" onClick={() => setDeleteConfirm(null)} style={{ flex:1 }}>Batal</button>
          <button className="btn btn-danger w-full" onClick={confirmDelete} style={{ flex:1 }}>Ya, Hapus</button>
        </div>
      </div>
    </div>
  ) : null;

  const guruMenus = [
    { id: "dashboard", label: "📈 Dashboard" },
    { id: "data-sheets", label: "📊 Data Siswa" },
    { id: "kontrol", label: "🎛️ Kontrol Data" },
    { id: "absensi-siswa", label: "📋 Absensi Siswa" },
    { id: "absensi-guru",  label: "🗒️ Absensi Guru" },
    { id: "jurnal", label: "📝 Jurnal Mengajar" },
    { id: "rekap-nilai", label: "📈 Rekap Nilai" },
    { id: "cetak-rapor", label: "📄 Cetak Rapor" },
    ...(canAccess("master-guru") ? [{ id: "master-guru", label: "📚 Master Guru" }] : []),
    ...(canAccess("kelola-pintasan") ? [{ id: "kelola-pintasan", label: "🔗 Pintasan" }] : []),
    ...(canAccess("pengaturan-mapel") ? [{ id: "pengaturan-mapel", label: "⚙️ Mapel" }] : []),
  ];

  const siswaMenus = [
    { id: "dashboard", label: "📊 Dashboard" },
    { id: "harian", label: "📝 Laporan Harian" },
    { id: "kegiatan", label: "🎯 Laporan Kegiatan" },
    { id: "target", label: "📈 Target" },
    { id: "ziyadah", label: "📖 Ziyadah" },
    ...(canAccess("master-siswa") ? [{ id: "siswa", label: "📖 Master Siswa" }] : []),
  ];

  const waliMenus = [
    { id: "dashboard",    label: "🏠 Dashboard" },
    { id: "notifikasi",   label: "🔔 Notifikasi" },
    { id: "absensi",      label: "📋 Absensi" },
    { id: "harian",       label: "📝 Harian" },
    { id: "nilai",        label: "📊 Nilai" },
    { id: "kegiatan",     label: "🎯 Kegiatan" },
    { id: "target",       label: "🏆 Target" },
    { id: "hafalan",      label: "📖 Hafalan" },
  ];

  const activeMenus = portal === "guru" ? guruMenus : portal === "siswa" ? siswaMenus : waliMenus;
  const menuActiveClass = portal === "guru" ? "active" : portal === "siswa" ? "active-blue" : "active-purple";

  return (
    <div className="app">
      {/* styles moved to head */}
      <DeleteModal />

      {/* Sync Status Banner */}
      {syncStatus !== "idle" && syncMsg && (
        <div style={{
          position:"fixed", top:0, left:0, right:0, zIndex:10000,
          background: syncStatus === "success" ? "#065f46" : syncStatus === "error" ? "#991b1b" : "#1d4ed8",
          color:"white", padding:"10px 20px", fontSize:13, fontWeight:600,
          display:"flex", alignItems:"center", justifyContent:"center", gap:10,
          boxShadow:"0 2px 12px rgba(0,0,0,.3)"
        }}>
          {syncStatus === "syncing" && <span style={{animation:"spin 1s linear infinite", display:"inline-block"}}>⟳</span>}
          {syncMsg}
        </div>
      )}

      {/* Header */}
      <header className="header">
        <div className="header-brand">
          <div className="header-logo">
            {loginConfig.logoUrl
              ? <img src={loginConfig.logoUrl} alt="Logo" style={{ width:36, height:36, borderRadius:"50%", objectFit:"cover" }} />
              : "🕌"
            }
          </div>
          <div>
            <div className="header-title">{loginConfig.eduTag || "Portal Pendidikan"}</div>
            <div className="header-sub">{loginConfig.namaSekolah || "Bunayya Islamic School"}</div>
          </div>
        </div>
        <div className="header-user">
          <div className="header-user-info">
            <div className="header-user-name">{user.name}</div>
            <div className="header-user-role">{user.role}</div>
          </div>
          {(user?.role === "admin" || user?.role === "teacher") && (
            <div style={{ display:"flex", flexDirection:"column", gap:3, alignItems:"flex-start" }}>
              <button
                title="Sinkronkan semua data ke Firebase Firestore"
                onClick={syncAllToSheets}
                disabled={syncStatus === "syncing"}
                style={{
                  display:"flex", alignItems:"center", gap:3,
                  padding:"3px 8px", fontSize:10, fontWeight:700,
                  border:"none", borderRadius:7, cursor:"pointer",
                  background: syncStatus === "syncing" ? "#1d4ed8" : syncStatus === "success" ? "#065f46" : "rgba(255,255,255,.2)",
                  color:"white", whiteSpace:"nowrap", transition:"all .2s"
                }}
              >
                {syncStatus === "syncing"
                  ? <><span style={{display:"inline-block", animation:"spin 1s linear infinite"}}>⟳</span> Sinkron...</>
                  : <><span>🔥</span> Firebase</>
                }
              </button>
              <button
                title="Muat ulang data dari Firebase"
                onClick={loadFromSheets}
                disabled={syncStatus === "syncing"}
                style={{
                  display:"flex", alignItems:"center", gap:3,
                  padding:"3px 8px", fontSize:10, fontWeight:700,
                  border:"none", borderRadius:7, cursor:"pointer",
                  background:"rgba(255,255,255,.2)",
                  color:"white", whiteSpace:"nowrap", transition:"all .2s"
                }}
              >
                <span>📥</span> Muat
              </button>
            </div>
          )}
          {lastSync && (
            <div style={{fontSize:9, color:"rgba(255,255,255,.6)", textAlign:"left", whiteSpace:"nowrap", lineHeight:1.4}}>
              🔥 Realtime<br/>{lastSync.split(",")[1]?.trim() || lastSync}
            </div>
          )}
          <button className="btn-logout" onClick={handleLogout} title="Logout"><Icon.Logout /></button>
          {!window.matchMedia("(display-mode:standalone)").matches && !navigator.standalone && (
            <button
              title="Pasang aplikasi di layar utama HP"
              onClick={() => {
                if (window._pwaInstall) window._pwaInstall();
                else {
                  var ov = document.getElementById("_pwa_overlay");
                  if (ov) { ov.style.display="flex"; }
                  else if (window.__showPwaOverlay) window.__showPwaOverlay();
                }
              }}
              style={{
                background:"rgba(255,255,255,.2)", border:"1px solid rgba(255,255,255,.4)",
                borderRadius:8, color:"white", width:36, height:36,
                display:"flex", alignItems:"center", justifyContent:"center",
                cursor:"pointer", fontSize:18, flexShrink:0
              }}
            >📲</button>
          )}
        </div>
      </header>

      {/* Portal tabs */}
      <div className="portal-bar">
        {(user.role === "admin" || user.role === "teacher") && (
          <button className={`portal-tab ${portal === "guru" ? "active-guru" : ""}`} onClick={() => { setPortal("guru"); setMenu("dashboard"); }}>
            📚 Portal Guru
          </button>
        )}
        {(user.role === "admin" || user.role === "teacher") && (
          <button className={`portal-tab ${portal === "siswa" ? "active-siswa" : ""}`} onClick={() => { setPortal("siswa"); setMenu("dashboard"); }}>
            🏫 Portal Siswa
          </button>
        )}
        <button className={`portal-tab ${portal === "wali" ? "active-wali" : ""}`} onClick={() => { setPortal("wali"); setMenu("dashboard"); }}>
          📋 Portal Wali
        </button>
      </div>

      {/* Menu bar */}
      <div className="menu-bar">
        <div className="flex scroll-x min-w-max" style={{ padding: "0 24px", gap: 2 }}>
          {activeMenus.map(m => (
            <button key={m.id} className={`menu-btn ${menu === m.id ? menuActiveClass : ""}`} onClick={() => setMenu(m.id)}>
              {m.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="content">
        {portal === "guru" && (
          <PortalGuru menu={menu} data={data} setData={setData} patchData={patchData} formData={formData} patchForm={patchForm} selectedKelas={selectedKelas} setSelectedKelas={setSelectedKelas} searchQuery={searchQuery} setSearchQuery={setSearchQuery} user={user} canAccess={canAccess} saveAbsensiSiswa={saveAbsensiSiswa} saveAbsensiGuru={saveAbsensiGuru} saveJurnal={saveJurnal} saveNilaiKelas={saveNilaiKelas} deleteItem={deleteItem} addDialog={addDialog} setAddDialog={setAddDialog} loginConfig={loginConfig} saveLoginConfig={saveLoginConfig} writeDoc={writeDoc} />
        )}
        {portal === "siswa" && (
          <PortalSiswa menu={menu} data={data} setData={setData} patchData={patchData} formData={formData} patchForm={patchForm} user={user} canAccess={canAccess} saveHarian={saveHarian} saveKegiatan={saveKegiatan} saveKegiatanKelas={saveKegiatanKelas} saveTarget={saveTarget} saveZiyadah={saveZiyadah} selectedKelas={selectedKelas} setSelectedKelas={setSelectedKelas} deleteItem={deleteItem} writeDoc={writeDoc} />
        )}
        {portal === "wali" && (
          <PortalWali menu={menu} data={data} formData={formData} patchForm={patchForm} user={user} />
        )}
      </div>

      {loading && (
        <div className="loading-overlay">
          <div className="loading-card">
            <div className="spinner" />
            <div>Memproses...</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── LOGIN PAGE ───────────────────────────────────────────────────────────────
function LoginPage({ loginRole, setLoginRole, loginForm, setLoginForm, loginError, handleLogin, data, loginConfig = {} }) {
  const [bannerSlide, setBannerSlide] = useState(0);

  const defaultSlides = [
    { title: "Selamat Datang", sub: "Portal Pendidikan Bunayya", bg: "linear-gradient(135deg,#1a8a5a,#27ae60)", imgUrl: null },

// ─── PORTAL GURU ─────────────────────────────────────────────────────────────
function PortalGuru({ menu, data, setData, patchData, formData, patchForm, selectedKelas, setSelectedKelas, searchQuery, setSearchQuery, user, canAccess, saveAbsensiSiswa, saveAbsensiGuru, saveJurnal, saveNilaiKelas, deleteItem, loginConfig = {}, saveLoginConfig, writeDoc }) {

  const todayStr = today();

  // Dashboard
  if (menu === "dashboard") {

    // ── BarChart vertikal SVG ─────────────────────────────────────────────
    const BarChart = ({ items, color = "#1d7a5f", maxOverride }) => {
      const W = 52, GAP = 10, H = 130, PAD_LEFT = 32, PAD_BOT = 72, PAD_TOP = 16;
      const totalMax = items.reduce((a,i) => a + i.val, 0);

      // Jika semua nilai 0, tampilkan pesan kosong — tidak render grafik
      if (totalMax === 0) return (
        <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>
          📭 Belum ada data pada rentang tanggal ini
        </div>
      );

      const rawMax = maxOverride || Math.max(...items.map(i => i.val), 1);

      // Garis Y dinamis — bertambah sesuai data
      const niceStep = (max) => {
        if (max <= 5)   return 1;
        if (max <= 10)  return 2;
        if (max <= 20)  return 5;
        if (max <= 50)  return 10;
        if (max <= 100) return 20;
        return Math.ceil(max / 5 / 10) * 10;
      };
      const step   = niceStep(rawMax);
      const maxVal = Math.ceil(rawMax / step) * step;
      const yTicks = [];
      for (let v = 0; v <= maxVal; v += step) yTicks.push(v);

      const totalW = items.length * W + (items.length - 1) * GAP + PAD_LEFT + 16;

      return (
        <svg width="100%" viewBox={"0 0 " + totalW + " " + (H + PAD_BOT + PAD_TOP)}
          style={{ overflow:"visible", display:"block" }}>

          {/* Grid lines horizontal — dinamis */}
          {yTicks.map(v => {
            const y = PAD_TOP + H - (v / maxVal) * H;
            return (
              <g key={v}>
                <line x1={PAD_LEFT} y1={y} x2={totalW} y2={y} stroke="#e8e8e8" strokeWidth="1" strokeDasharray={v===0?"0":"4 3"} />
                <text x={PAD_LEFT-4} y={y+4} textAnchor="end" fontSize="9" fill="#999">{v}</text>
              </g>
            );
          })}

          {/* Bars */}
          {items.map((item, i) => {
            const x    = PAD_LEFT + i * (W + GAP);
            const barH = maxVal > 0 ? Math.max((item.val/maxVal)*H, item.val>0?4:0) : 0;
            const barY = PAD_TOP + H - barH;
            return (
              <g key={i}>
                <rect x={x+3} y={barY+3} width={W} height={barH} rx="5" fill="rgba(0,0,0,.06)" />
                <rect x={x} y={barY} width={W} height={barH} rx="5" fill={color} />
                {item.val > 0 && (
                  <text x={x+W/2} y={barY-6} textAnchor="middle" fontSize="14" fontWeight="900" fill={color}>{item.val}</text>
                )}
                {/* Label miring -45 derajat */}
                <text x={x+W/2} y={PAD_TOP+H+8} textAnchor="end" fontSize="14" fontWeight="900" fill="#333"
                  transform={"rotate(-45,"+(x+W/2)+","+(PAD_TOP+H+8)+")"}>
                  {item.lbl}
                </text>
              </g>
            );
          })}

          {/* Baseline */}
          <line x1={PAD_LEFT} y1={PAD_TOP+H} x2={totalW} y2={PAD_TOP+H} stroke="#ccc" strokeWidth="1.5" />
        </svg>
      );
    };

    // ── Data chart ───────────────────────────────────────────────────────
    const kelasList = KELAS_LIST.filter(k => k !== "Semua");
    const dashDari   = formData.dash_dari   ?? todayStr;
    const dashSampai = formData.dash_sampai ?? todayStr;
    const inDashRange = tgl => (!dashDari || tgl >= dashDari) && (!dashSampai || tgl <= dashSampai);

    const absSiswaPerKelas  = kelasList.map(k => ({ lbl: k, val: data.studentAttendance.filter(a => a.kelas === k && inDashRange(a.tanggal)).length }));
    const absGuruPerNama    = data.teachers.map(t => ({ lbl: t.nama, val: data.teacherAttendance.filter(a => a.teacherId === t.id && inDashRange(a.tanggal)).length }));
    const jurnalPerGuru     = data.teachers.map(t => ({ lbl: t.nama, val: data.journals.filter(j => j.teacherId === t.id && inDashRange(j.tanggal)).length }));
    const harianPerKelas    = kelasList.map(k => ({ lbl: k, val: data.dailyReports.filter(r => r.kelas === k && inDashRange(r.tanggal)).length }));
    const nilaiPerKelas     = kelasList.map(k => ({ lbl: k, val: data.grades.filter(g => g.kelas === k && inDashRange(g.tanggal)).length }));
    const kegiatanPerKelas  = kelasList.map(k => ({ lbl: k, val: data.activities.filter(a => a.kelas === k && inDashRange(a.tanggal)).length }));
    const targetPerKelas    = kelasList.map(k => ({ lbl: k, val: data.targets.filter(t => t.kelas === k && inDashRange(t.tanggal)).length }));
    const ziyadahPerKelas   = kelasList.map(k => ({ lbl: k, val: data.ziyadah.filter(z => z.kelas === k && inDashRange(z.tanggal)).length }));

    const CHART_COLORS = {
      absSiswa:"#1d7a5f", absGuru:"#2563a8", jurnal:"#7c3aed",
      harian:"#d97706", kegiatan:"#0891b2", target:"#dc2626",
      ziyadah:"#059669", nilai:"#9333ea"
    };

    const ChartCard = ({ title, items, color, maxOverride }) => (
      <div className="card">
        <div className="card-header">
          <div className="card-title">{title}</div>
          <div className="flex gap-2 items-center">
            <span style={{ fontSize:12, color:"#888" }}>{items.reduce((a,i)=>a+i.val,0)} total</span>
          </div>
        </div>
        <div className="card-body" style={{ overflowX:"auto" }}>
          {items.length === 0
            ? <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>📭 Belum ada data</div>
            : <BarChart items={items} color={color} maxOverride={maxOverride} />
          }

      </div>
    );

    return (
      <div>
        {/* Stat cards */}
        <div className="card mb-4">
          <div className="card-header">
            <div>
              <div className="card-title">📈 Dashboard Statistik</div>
              <div className="card-sub">Data dari database sekolah</div>
            </div>
            <div className="flex gap-2 items-center" style={{flexWrap:"wrap", gap:8}}>
              <span style={{fontSize:12, color:"#64748b", fontWeight:600}}>Dari</span>
              <input type="date" className="input" style={{width:140, fontSize:13, padding:"5px 8px"}}
                value={formData.dash_dari ?? todayStr}
                onChange={e => patchForm({dash_dari: e.target.value})} />
              <span style={{fontSize:12, color:"#64748b", fontWeight:600}}>Sampai</span>
              <input type="date" className="input" style={{width:140, fontSize:13, padding:"5px 8px"}}
                value={formData.dash_sampai ?? todayStr}
                onChange={e => patchForm({dash_sampai: e.target.value})} />
              <button onClick={() => patchForm({dash_dari: todayStr, dash_sampai: todayStr})}
                style={{padding:"5px 10px", fontSize:12, fontWeight:700, background:"#e0f2fe", color:"#0369a1", border:"none", borderRadius:8, cursor:"pointer"}}>Hari Ini</button>
              <button onClick={() => patchForm({dash_dari: "", dash_sampai: ""})}
                style={{padding:"5px 10px", fontSize:12, fontWeight:700, background:"#f1f5f9", color:"#475569", border:"none", borderRadius:8, cursor:"pointer"}}>Semua</button>
            </div>
          </div>
          <div className="card-body">
            {(() => {
              const dari   = formData.dash_dari   ?? todayStr;
              const sampai = formData.dash_sampai ?? todayStr;
              const inRange = tgl => (!dari || tgl >= dari) && (!sampai || tgl <= sampai);
              const stats = [
                { icon: "📖", label: "Total Siswa",   value: data.students.length,                                        bg:"#dbeafe", c:"#1e40af" },
                { icon: "✏️", label: "Total Guru",    value: data.teachers.length,                                        bg:"#d1fae5", c:"#065f46" },
                { icon: "📊", label: "Data Nilai",    value: data.grades.filter(g => inRange(g.tanggal)).length,          bg:"#ede9fe", c:"#5b21b6" },
                { icon: "📋", label: "Absensi Siswa", value: data.studentAttendance.filter(a => inRange(a.tanggal)).length, bg:"#ecfdf5", c:"#065f46" },
                { icon: "🗒️", label: "Absensi Guru", value: data.teacherAttendance.filter(a => inRange(a.tanggal)).length, bg:"#eff6ff", c:"#1e40af" },
                { icon: "📝", label: "Lap. Harian",  value: data.dailyReports.filter(r => inRange(r.tanggal)).length,    bg:"#fef3c7", c:"#92400e" },
                { icon: "📒", label: "Jurnal",        value: data.journals.filter(j => inRange(j.tanggal)).length,        bg:"#f5f3ff", c:"#5b21b6" },

              return (

                      <div style={{ fontSize:22, fontWeight:800, color:s.c }}>{s.value}</div>
                      <div style={{ fontSize:11, color:s.c, opacity:.8, marginTop:2 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        </div>

        {/* 8 diagram vertikal kebawah, full width */}
        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          <ChartCard title="📋 Absensi Siswa per Kelas"       items={absSiswaPerKelas} color={CHART_COLORS.absSiswa} />
          <ChartCard title="🗒️ Absensi Guru per Nama"        items={absGuruPerNama}   color={CHART_COLORS.absGuru} />
          <ChartCard title="📝 Jurnal per Guru"               items={jurnalPerGuru}    color={CHART_COLORS.jurnal} />
          <ChartCard title="📄 Laporan Harian per Kelas"      items={harianPerKelas}   color={CHART_COLORS.harian} />
          <ChartCard title="📊 Rekap Nilai per Kelas"         items={nilaiPerKelas}    color={CHART_COLORS.nilai} />
          <ChartCard title="🎯 Laporan Kegiatan per Kelas"    items={kegiatanPerKelas} color={CHART_COLORS.kegiatan} />
          <ChartCard title="🎯 Target Pencapaian per Kelas"   items={targetPerKelas}   color={CHART_COLORS.target} />
          <ChartCard title="📖 Ziyadah Hafalan per Kelas"     items={ziyadahPerKelas}  color={CHART_COLORS.ziyadah} />
        </div>


      </div>
    );
  }

  // Data Sheets
  if (menu === "data-sheets") {
    const filtered = data.students.filter(s =>

      (!searchQuery || s.nama.toLowerCase().includes(searchQuery.toLowerCase()) || s.nis.includes(searchQuery))

      const btn = document.getElementById("btn-download-rapor");
      if (btn) { btn.disabled = true; btn.innerText = "⏳ Memproses..."; }

      const waitReady = (cb, tries) => {
        tries = tries || 0;
        if (typeof html2canvas !== "undefined" && (typeof window.jspdf !== "undefined" || typeof jspdf !== "undefined")) return cb();
        if (tries > 40) { alert("Library belum siap, pastikan internet aktif lalu refresh."); if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; } return; }
        setTimeout(() => waitReady(cb, tries + 1), 200);
      };

      waitReady(() => {
        html2canvas(el, {
          scale: 3, useCORS: true, allowTaint: true,
          backgroundColor: "#ffffff", logging: false,
        }).then(canvas => {
          const jsPDFLib = (window.jspdf || jspdf).jsPDF;
          const pdf    = new jsPDFLib({ orientation: "portrait", unit: "mm", format: "a4" });
          const pageW  = pdf.internal.pageSize.getWidth();
          const pageH  = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const usableW = pageW - margin * 2;
          const imgW   = canvas.width;
          const imgH   = canvas.height;
          const scale  = usableW / (imgW / 3);
          const imgHmm = (imgH / 3) * scale;
          const imgData = canvas.toDataURL("image/jpeg", 0.97);

          const maxH = pageH - margin * 2;
          if (imgHmm <= maxH) {
            pdf.addImage(imgData, "JPEG", margin, margin, usableW, imgHmm);
          } else {
            let srcY = 0;
            let firstPage = true;
            while (srcY < imgH) {
              const sliceH = Math.min((maxH / scale) * 3, imgH - srcY);
              const sc = document.createElement("canvas");
              sc.width = imgW; sc.height = sliceH;
              sc.getContext("2d").drawImage(canvas, 0, srcY, imgW, sliceH, 0, 0, imgW, sliceH);
              if (!firstPage) { pdf.addPage(); }
              pdf.addImage(sc.toDataURL("image/jpeg", 0.97), "JPEG", margin, margin, usableW, (sliceH / 3) * scale);
              srcY += sliceH;
              firstPage = false;
            }
          }

          const s  = data.students.find(s => s.id === formData.rapor_siswa);
          const nm = (s?.nama || "siswa").replace(/ /g, "-");
          pdf.save(`Rapor-${nm}-${formData.rapor_semester || "Sem1"}-${formData.rapor_tahun || "2025-2026"}.pdf`);
          if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
        }).catch(err => {
          alert("Gagal: " + err.message);
          if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
        });
      });
    };

            return (
              <div id="rapor-preview" style={{ background:"#fff", borderRadius:16, padding:28, border:"2px solid #e0e0e0", maxWidth:620, margin:"0 auto", fontFamily:"Arial,sans-serif" }}>

                        <td style={{ padding:"8px 10px" }}>RATA-RATA</td>
                        <td style={{ padding:"8px 10px", textAlign:"center", color:"#065f46" }}>{avg}</td>

        )}
      </div>
    );
  }

  // Pintasan & Pengumuman
  if (menu === "kelola-pintasan") {
    // Kompres gambar ke max 400px, kualitas 0.7 agar muat di Firestore (<1MB)
    const compressImage = (file, maxW = 400, quality = 0.7) => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width  = img.width  * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    const openAddLink = () => patchForm({ showLinkDialog: true, editLinkId: null, newLinkTitle: "", newLinkUrl: "", newLinkIcon: "🔗" });
    const openEditLink = (l) => patchForm({ showLinkDialog: true, editLinkId: l.id, newLinkTitle: l.title, newLinkUrl: l.url, newLinkIcon: l.icon });
    const saveLink = () => {
      if (!formData.newLinkTitle) { alert("Judul link wajib diisi!"); return; }
      if (formData.editLinkId) {
        const editId = formData.editLinkId;
        const updated = {
          ...data.quickLinks.find(l => l.id === editId),
          title: formData.newLinkTitle,
          url:   formData.newLinkUrl || "#",
          icon:  formData.newLinkIcon || "🔗"
        };
        setData(d => {
          const next = { ...d, quickLinks: d.quickLinks.map(l => l.id === editId ? updated : l) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("quickLinks", updated);
      } else {
        const rec = { id: genId(), title: formData.newLinkTitle, url: formData.newLinkUrl || "#", icon: formData.newLinkIcon || "🔗" };
        setData(d => {
          const next = { ...d, quickLinks: [...d.quickLinks, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("quickLinks", rec);
      }
      patchForm({ showLinkDialog: false });
    };
    const openAddAnn = () => patchForm({ showAnnDialog: true, editAnnId: null, newAnnJudul: "", newAnnDeskripsi: "", newAnnIcon: "📢" });
    const openEditAnn = (a) => patchForm({ showAnnDialog: true, editAnnId: a.id, newAnnJudul: a.judul, newAnnDeskripsi: a.deskripsi, newAnnIcon: a.icon });
    const saveAnn = () => {
      if (!formData.newAnnJudul) { alert("Judul pengumuman wajib diisi!"); return; }
      if (formData.editAnnId) {
        const editId = formData.editAnnId;
        const updated = { ...data.announcements.find(a => a.id === editId), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: d.announcements.map(a => a.id === editId ? updated : a) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("announcements", updated);
      } else {
        const rec = { id: genId(), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: [...d.announcements, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("announcements", rec);
      }
      patchForm({ showAnnDialog: false });
    };
    const ICON_OPTS = ["🔗","📋","💰","❤️","📢","🏫","📖","🎓","✏️","🗓️","📌","⭐","🔔","📣","📝","🏆","🌙","👍","🕌","🌟","📱","💻","🎯","🌿"];
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
        {/* Link Cepat */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🔗 Link Cepat</div>
            <button className="btn btn-primary btn-sm" onClick={openAddLink}><Icon.Plus /> Tambah Link</button>
          </div>
          <div className="card-body">
            {data.quickLinks.length === 0 ? <div className="empty-state">Belum ada link cepat</div> : (
              <div className="row-list">
                {data.quickLinks.map(l => (
                  <div key={l.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{l.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{l.title}</div>
                        <div className="text-xs text-muted">{l.url}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" title="Buka Link" onClick={() => window.open(l.url, "_blank")}>🔗</button>
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditLink(l)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("quickLinks", l.id, l.title)}><Icon.Trash /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Pengumuman */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">📢 Pengumuman</div>
            <button className="btn btn-primary btn-sm" onClick={openAddAnn}><Icon.Plus /> Tambah Pengumuman</button>
          </div>
          <div className="card-body">
            {data.announcements.length === 0 ? <div className="empty-state">Belum ada pengumuman</div> : (
              <div className="row-list">
                {data.announcements.map(a => (
                  <div key={a.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{a.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{a.judul}</div>
                        <div className="text-xs text-muted">{a.deskripsi}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditAnn(a)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("announcements", a.id, a.judul)}><Icon.Trash /></button>

          </div>
        </div>

        {/* Dialog Link */}
        {formData.showLinkDialog && (

            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Nama link" value={formData.newLinkTitle || ""} onChange={e => patchForm({ newLinkTitle: e.target.value })} /></div>

        {/* Dialog Pengumuman */}
        {formData.showAnnDialog && (
          <Dialog open title={formData.editAnnId ? "✏️ Edit Pengumuman" : "➕ Tambah Pengumuman"} onClose={() => patchForm({ showAnnDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showAnnDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveAnn}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Pilih Ikon</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:4 }}>
                {ICON_OPTS.map(ic => <button key={ic} onClick={() => patchForm({ newAnnIcon: ic })} style={{ width:38, height:38, fontSize:20, border: formData.newAnnIcon===ic ? "2px solid #27ae60":"1.5px solid #e8e8e8", borderRadius:10, cursor:"pointer", background: formData.newAnnIcon===ic ? "#e8f5e9":"#f8f9fa" }}>{ic}</button>)}
              </div>
            </div>
            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Judul pengumuman" value={formData.newAnnJudul || ""} onChange={e => patchForm({ newAnnJudul: e.target.value })} /></div>
            <div className="form-group"><label className="label">Deskripsi</label><textarea className="textarea" rows={3} placeholder="Keterangan pengumuman..." value={formData.newAnnDeskripsi || ""} onChange={e => patchForm({ newAnnDeskripsi: e.target.value })} /></div>
          </Dialog>
        )}

        {/* ── Pengaturan Tampilan Login ── */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🎨 Pengaturan Tampilan Login</div>
          </div>
          <div className="card-body" style={{ display:"flex", flexDirection:"column", gap:16 }}>

            {/* Preview */}
            <div style={{ background:"linear-gradient(135deg,#1a8a5a,#27ae60)", borderRadius:16, padding:"24px 20px", textAlign:"center", color:"white" }}>
              <div style={{ marginBottom:10 }}>
                {(loginConfig.logoUrl)
                  ? <img src={loginConfig.logoUrl} alt="Logo" style={{ width:72, height:72, borderRadius:"50%", objectFit:"cover", border:"3px solid rgba(255,255,255,.4)", display:"inline-block" }} />
                  : <div style={{ fontSize:48 }}>🏫</div>
                }
              </div>
              <div style={{ fontSize:11, opacity:.7, letterSpacing:2, marginBottom:2 }}>{loginConfig.eduTag || "EDUCATION PORTAL"}</div>
              <div style={{ fontSize:22, fontWeight:700, fontFamily:"Amiri,serif", marginBottom:2 }}>{loginConfig.namaSekolah || "Bunayya Islamic School"}</div>
              <div style={{ fontSize:13, opacity:.75 }}>{loginConfig.tagline || "Menuju Generasi Qur'ani"}</div>
            </div>

            {/* Upload Logo */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">📷 Logo Sekolah</label>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                {loginConfig.logoUrl && (
                  <img src={loginConfig.logoUrl} alt="Logo" style={{ width:52, height:52, borderRadius:"50%", objectFit:"cover", border:"2px solid #e0e0e0" }} />
                )}
                <label style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 16px", background:"#f0fdf4", border:"1.5px dashed #27ae60", borderRadius:10, cursor:"pointer", fontSize:13, fontWeight:600, color:"#27ae60" }}>
                  📁 Pilih Foto
                  <input type="file" accept="image/*" style={{ display:"none" }} onChange={e => {
                    const file = e.target.files?.[0];
                    if (!file) return;
