    /* ─── BUAT ICON 512x512 via Canvas (logo di atas bg putih) ──────── */
    function makeIconBlob(cb) {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement("canvas");
        c.width = c.height = 512;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 512, 512);
        // Gambar logo bulat di tengah
        var pad = 20;
        ctx.save();
        ctx.beginPath();
        ctx.arc(256, 256, 256 - pad, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, pad, pad, 512 - pad*2, 512 - pad*2);
        ctx.restore();
        c.toBlob(function(blob) { cb(URL.createObjectURL(blob), c.toDataURL("image/png")); }, "image/png");
      };
      img.onerror = function() { cb(LOGO, LOGO); };
      img.src = LOGO;
    }

    /* ─── MANIFEST + APPLE ICON ──────────────────────────────────────── */
    function registerManifest(iconUrl) {
      var manifest = {
        name: "Bunayya SMILE Hub",
        short_name: "Bunayya",
        description: "Portal Manajemen Pendidikan Bunayya Islamic School",
        start_url: location.href,
        display: "standalone",
        background_color: "#f5c800",
        theme_color: "#1d7a5f",
        orientation: "portrait-primary",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      var mb = new Blob([JSON.stringify(manifest)], {type:"application/json"});
      var ml = document.createElement("link");
      ml.rel = "manifest"; ml.href = URL.createObjectURL(mb);
      document.head.appendChild(ml);

      // Apple touch icon
      var al = document.createElement("link");
      al.rel = "apple-touch-icon"; al.href = iconUrl;
      document.head.appendChild(al);

      console.log("✅ Manifest registered with logo icon");
    }

    // Jalankan: buat icon dulu, lalu register manifest
    makeIconBlob(function(blobUrl) {
      registerManifest(blobUrl);
    });

        'const C="bny-v3";',

        'self.addEventListener("activate",function(e){',
        '  e.waitUntil(caches.keys().then(function(ks){',
        '    return Promise.all(ks.filter(function(k){return k!==C;}).map(function(k){return caches.delete(k);}));',
        '  }));self.clients.claim();',
        '});',
        'self.addEventListener("fetch",function(e){',
        '  if(e.request.mode==="navigate"){',
        '    e.respondWith(fetch(e.request).catch(function(){return new Response("")}));',
        '  }',
        '});'
      ].join("\n");
      try {
        var swBlob = new Blob([swCode], {type:"text/javascript"});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob), {scope:"./"})
          .then(function(r){ console.log("✅ SW:", r.scope); })
          .catch(function(e){ console.warn("SW err:", e); });
      } catch(e) { console.warn("SW:", e); }

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().split("T")[0];
const currentMonth = () => String(new Date().getMonth() + 1).padStart(2, "0");
const previousMonth = () => {
  const d = new Date();
  d.setMonth(d.getMonth() - 1);
  return String(d.getMonth() + 1).padStart(2, "0");
};

// Filter tanggal berdasarkan mode: "bulan" (bulan tertentu), "hari" (hari ini),
// "2bulan" (bulan sekarang + 1 bulan sebelumnya), "semua" (semua data)
const filterByDateMode = (tgl, mode, bulan, todayStr) => {
  if (!tgl) return false;
  if (mode === "semua") return true;
  if (mode === "hari") return tgl === todayStr;
  if (mode === "2bulan") {
    const mm = tgl.slice(5, 7);
    return mm === currentMonth() || mm === previousMonth();
  }
  return tgl.slice(5, 7) === bulan;
};

// ── Simpan ke localStorage secara debounce (async, tidak memblokir UI saat klik) ──
let __persistTimer = null;
let __persistPending = null;
function persistDataAsync(next) {
  __persistPending = next;
  if (__persistTimer) clearTimeout(__persistTimer);
  __persistTimer = setTimeout(() => {
    try { localStorage.setItem("bunayya_data", JSON.stringify(__persistPending)); } catch(e) {}
    __persistTimer = null;
    __persistPending = null;
  }, 400);
}

// ── Memoisasi ringan berbasis ref (bukan hook) — aman dipakai di dalam blok
// `if (menu === ...)` yang bercabang, supaya tabel/riwayat besar tidak
// dihitung ulang setiap kali ada klik/ketik di bagian lain halaman yang sama. ──
function createLocalMemo(cacheRef) {
  return function localMemo(key, deps, computeFn) {
    const cache = cacheRef.current[key];
    if (cache && cache.deps.length === deps.length && cache.deps.every((d, i) => d === deps[i])) {
      return cache.value;
    }
    const value = computeFn();
    cacheRef.current[key] = { deps, value };
    return value;
  };
}

// ── Download tabel riwayat sebagai PDF ──────────────────────────────────────
function downloadTablePDF(tableId, judul, namaFile) {
  const el = document.getElementById(tableId);
  if (!el) { alert("Tabel tidak ditemukan."); return; }

  const btn = document.getElementById("btn-pdf-" + tableId);
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Memproses..."; }

  // Tunggu html2canvas & jsPDF siap (maks 8 detik)
  const waitReady = (cb, tries) => {
    tries = tries || 0;
    const h2c  = typeof html2canvas !== "undefined";
    const jpdf = typeof window.jspdf !== "undefined" || typeof jspdf !== "undefined";
    if (h2c && jpdf) return cb();
    if (tries > 40) {
      alert("Library PDF belum siap. Pastikan koneksi internet aktif lalu refresh halaman.");
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
      return;
    }
    setTimeout(() => waitReady(cb, tries + 1), 200);
  };

  waitReady(() => {

  html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false })
    .then(canvas => {
      const jsPDFLib = (window.jspdf || jspdf).jsPDF;
      const imgW = canvas.width;
      const imgH = canvas.height;
      // A4 landscape jika tabel lebar
      const isLandscape = imgW > imgH;
      const pdf = new jsPDFLib({ orientation: isLandscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const usableW = pageW - margin * 2;
      const scale = usableW / (imgW / 2); // /2 karena scale:2 di html2canvas
      const imgHmm = (imgH / 2) * scale;

      // Header
      pdf.setFontSize(13);
      pdf.setFont("helvetica", "bold");
      pdf.text("BUNAYYA ISLAMIC SCHOOL", pageW / 2, margin + 4, { align: "center" });
      pdf.setFontSize(10);
      pdf.setFont("helvetica", "normal");
      pdf.text(judul, pageW / 2, margin + 9, { align: "center" });
      pdf.setFontSize(8);
      pdf.text("Dicetak: " + new Date().toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" }), pageW / 2, margin + 13, { align: "center" });

      // Garis pemisah
      const startY = margin + 16;
      pdf.setDrawColor(29, 122, 95);
      pdf.setLineWidth(0.5);
      pdf.line(margin, startY, pageW - margin, startY);

      // Tabel sebagai gambar
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      let y = startY + 3;
      const maxH = pageH - y - margin;

      if (imgHmm <= maxH) {
        pdf.addImage(imgData, "JPEG", margin, y, usableW, imgHmm);
      } else {
        // Multi-page jika tabel panjang
        let srcY = 0;
        while (srcY < imgH) {
          const sliceH = Math.min((maxH / scale) * 2, imgH - srcY);
          const sliceCanvas = document.createElement("canvas");
          sliceCanvas.width = imgW;
          sliceCanvas.height = sliceH;
          sliceCanvas.getContext("2d").drawImage(canvas, 0, srcY, imgW, sliceH, 0, 0, imgW, sliceH);
          pdf.addImage(sliceCanvas.toDataURL("image/jpeg", 0.95), "JPEG", margin, y, usableW, (sliceH / 2) * scale);
          srcY += sliceH;
          if (srcY < imgH) { pdf.addPage(); y = margin; }
        }
      }

      pdf.save(namaFile + ".pdf");
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    })
    .catch(err => {
      alert("Gagal: " + err.message);
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    });
  }); // end waitReady
}

  // ── SAVE HANDLERS ────────────────────────────────────────────────────────────

    return {
      ...r,
      namaSiswa: student?.nama || r.student?.nama || "",
      namaGuru:  teacher?.nama || r.teacher?.nama  || "",
    };
  });

  // ── Firebase sync helpers (menggantikan Google Sheets) ───────────────────
  const jsonpPost = () => Promise.resolve(); // legacy stub, tidak dipakai

  const syncCollection = async (fbColl, records) => {
    if (!window.__firebase?.ready) return;
    const { db } = window.__firebase;
    try {
      const snap = await db.collection(fbColl).get();
      const existingIds = new Set(snap.docs.map(d => d.id));
      const batch = db.batch();
      records.forEach(item => {
        const ref = db.collection(fbColl).doc(String(item.id));
        if (!existingIds.has(String(item.id))) {
          batch.set(ref, item);
        }
      });
      await batch.commit();
    } catch(e) { console.error("syncCollection error:", e); }
  };

  const syncDelete = async (fbColl, id) => {
    if (!window.__firebase?.ready) return;
    try {
      await window.__firebase.db.collection(fbColl).doc(String(id)).delete();
    } catch(e) { console.error("syncDelete error:", e); }
  };

  // ── Firebase: Sync semua data sekaligus ─────────────────────────────────
  const syncAllToSheets = async () => {
    if (!window.__firebase?.ready) {
      alert("⚠️ Firebase belum terhubung, tunggu sebentar lalu coba lagi.");
      return;
    }
    setSyncStatus("syncing");
    setSyncMsg("🔄 Menyinkronkan semua data ke Firebase...");
    const { db } = window.__firebase;
    try {
      for (const [stateKey, fbColl] of Object.entries(FB_COLLECTIONS)) {
        const items = data[stateKey] || [];
        const snap = await db.collection(fbColl).get();
        const existingIds = new Set(snap.docs.map(d => d.id));
        const batch = db.batch();
        items.forEach(item => {
          const ref = db.collection(fbColl).doc(String(item.id));
          if (!existingIds.has(String(item.id))) {
            batch.set(ref, item);
          }
        });
        await batch.commit();
      }
      setSyncStatus("success");
      setSyncMsg("✅ Semua data berhasil disinkronkan ke Firebase!");
      setLastSync(new Date().toLocaleString("id-ID"));
    } catch(err) {
      setSyncStatus("error");
      setSyncMsg("❌ Gagal sinkron: " + err.message);
    }
    setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 4000);
  };

    setTimeout(() => {
      setSyncStatus("success");
      setSyncMsg("✅ Data diperbarui dari Firebase (realtime aktif)");

    if (!deleteConfirm) return;

    // Hapus dari Firebase
    const fbColl = FB_COLLECTIONS[collKey];

// ── Komponen diagram batang (top-level, agar tidak dibuat ulang tiap render) ──
const BarChart = ({ items, color = "#1d7a5f", maxOverride }) => {
  const W = 52, GAP = 10, H = 130, PAD_LEFT = 32, PAD_BOT = 72, PAD_TOP = 16;
  const totalMax = items.reduce((a,i) => a + i.val, 0);

  // Jika semua nilai 0, tampilkan pesan kosong — tidak render grafik
  if (totalMax === 0) return (
    <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>
      📭 Belum ada data pada rentang tanggal ini
    </div>
  );

  const rawMax = maxOverride || Math.max(...items.map(i => i.val), 1);

  // Garis Y dinamis — bertambah sesuai data
  const niceStep = (max) => {
    if (max <= 5)   return 1;
    if (max <= 10)  return 2;
    if (max <= 20)  return 5;
    if (max <= 50)  return 10;
    if (max <= 100) return 20;
    return Math.ceil(max / 5 / 10) * 10;
  };
  const step   = niceStep(rawMax);
  const maxVal = Math.ceil(rawMax / step) * step;
  const yTicks = [];
  for (let v = 0; v <= maxVal; v += step) yTicks.push(v);

  const totalW = items.length * W + (items.length - 1) * GAP + PAD_LEFT + 16;

  return (
    <svg width="100%" viewBox={"0 0 " + totalW + " " + (H + PAD_BOT + PAD_TOP)}
      style={{ overflow:"visible", display:"block" }}>

      {/* Grid lines horizontal — dinamis */}
      {yTicks.map(v => {
        const y = PAD_TOP + H - (v / maxVal) * H;
        return (
          <g key={v}>
            <line x1={PAD_LEFT} y1={y} x2={totalW} y2={y} stroke="#e8e8e8" strokeWidth="1" strokeDasharray={v===0?"0":"4 3"} />
            <text x={PAD_LEFT-4} y={y+4} textAnchor="end" fontSize="9" fill="#999">{v}</text>
          </g>
        );
      })}

      {/* Bars */}
      {items.map((item, i) => {
        const x    = PAD_LEFT + i * (W + GAP);
        const barH = maxVal > 0 ? Math.max((item.val/maxVal)*H, item.val>0?4:0) : 0;
        const barY = PAD_TOP + H - barH;
        return (
          <g key={i}>
            <rect x={x+3} y={barY+3} width={W} height={barH} rx="5" fill="rgba(0,0,0,.06)" />
            <rect x={x} y={barY} width={W} height={barH} rx="5" fill={color} />
            {item.val > 0 && (
              <text x={x+W/2} y={barY-6} textAnchor="middle" fontSize="14" fontWeight="900" fill={color}>{item.val}</text>
            )}
            {/* Label miring -45 derajat */}
            <text x={x+W/2} y={PAD_TOP+H+8} textAnchor="end" fontSize="14" fontWeight="900" fill="#333"
              transform={"rotate(-45,"+(x+W/2)+","+(PAD_TOP+H+8)+")"}>
              {item.lbl}
            </text>
          </g>
        );
      })}

      {/* Baseline */}
      <line x1={PAD_LEFT} y1={PAD_TOP+H} x2={totalW} y2={PAD_TOP+H} stroke="#ccc" strokeWidth="1.5" />
    </svg>
  );
};

// ── Diagram garis SVG (dipakai untuk tren per tanggal guru terpilih, top-level) ──
const PGLineChart = ({ items, color = "#1d7a5f" }) => {
  const H = 140, PAD_LEFT = 34, PAD_BOT = 60, PAD_TOP = 20, MIN_STEP_X = 56;
  const total = items.reduce((a,i)=>a+i.val,0);
  if (items.length === 0 || total === 0) return <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>📭 Belum ada data pada rentang ini</div>;
  const rawMax = Math.max(...items.map(i => i.val), 1);
  const niceStep = (max) => (max<=5?1: max<=10?2: max<=20?5: max<=50?10: Math.ceil(max/5/10)*10);
  const step = niceStep(rawMax);
  const maxVal = Math.ceil(rawMax / step) * step;
  const yTicks = []; for (let v = 0; v <= maxVal; v += step) yTicks.push(v);
  const totalW = Math.max(items.length * MIN_STEP_X, 260) + PAD_LEFT + 16;
  const stepX = items.length > 1 ? (totalW - PAD_LEFT - 16) / (items.length - 1) : 0;
  const points = items.map((item, i) => ({
    x: PAD_LEFT + i * stepX,
    y: PAD_TOP + H - (maxVal > 0 ? (item.val/maxVal)*H : 0),
    ...item
  }));
  const pathD = points.map((p,i) => (i===0 ? "M":"L") + p.x + " " + p.y).join(" ");
  return (
    <svg width="100%" viewBox={"0 0 " + totalW + " " + (H + PAD_BOT + PAD_TOP)} style={{ overflow:"visible", display:"block" }}>
      {yTicks.map(v => {
        const y = PAD_TOP + H - (v / maxVal) * H;
        return (
          <g key={v}>
            <line x1={PAD_LEFT} y1={y} x2={totalW} y2={y} stroke="#e8e8e8" strokeWidth="1" strokeDasharray={v===0?"0":"4 3"} />
            <text x={PAD_LEFT-4} y={y+4} textAnchor="end" fontSize="9" fill="#999">{v}</text>
          </g>
        );
      })}
      <path d={pathD} fill="none" stroke={color} strokeWidth="2.5" />
      {points.map((p,i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4" fill={color} />
          {p.val > 0 && <text x={p.x} y={p.y-10} textAnchor="middle" fontSize="12" fontWeight="900" fill={color}>{p.val}</text>}
          <text x={p.x} y={PAD_TOP+H+8} textAnchor="end" fontSize="11" fontWeight="700" fill="#333"
            transform={"rotate(-45,"+p.x+","+(PAD_TOP+H+8)+")"}>{p.lbl}</text>
        </g>
      ))}
      <line x1={PAD_LEFT} y1={PAD_TOP+H} x2={totalW} y2={PAD_TOP+H} stroke="#ccc" strokeWidth="1.5" />
    </svg>
  );
};

  </div>
);

              </div>
              <div className="select-wrap" style={{ width:170 }}>
                <select className="select" style={{ fontSize:13 }} value={formData.rw_guru_nama || ""} onChange={e => patchForm({ rw_guru_nama: e.target.value })}>

                  {data.teachers.map(t => <option key={t.id} value={t.id}>{t.nama}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{ width:160 }}>
                <select className="select" style={{ fontSize:13 }} value={formData.rw_guru_bulan !== undefined ? formData.rw_guru_bulan : currentMonthStr} onChange={e => patchForm({ rw_guru_bulan: e.target.value })}>
                  <option value="">Semua Bulan</option>
                  {["01","02","03","04","05","06","07","08","09","10","11","12"].map((m,i) => (
                    <option key={m} value={m}>{["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][i]}</option>
                  ))}

            <div className="table-wrap">
              <table id="tbl-abs-guru">

                  {(() => {
                    const rwGuruBulanAktif = formData.rw_guru_bulan !== undefined ? formData.rw_guru_bulan : currentMonthStr;
                    const fg = localMemo("rw-abs-guru", [data.teacherAttendance, formData.rw_guru_kelas, formData.rw_guru_nama, rwGuruBulanAktif], () =>
                      data.teacherAttendance.filter(a =>
                        (formData.rw_guru_kelas === "Semua" || !formData.rw_guru_kelas || a.kelas === formData.rw_guru_kelas) &&
                        (!formData.rw_guru_nama || a.teacherId === formData.rw_guru_nama) &&
                        (!rwGuruBulanAktif || (a.tanggal && a.tanggal.slice(5,7) === rwGuruBulanAktif))
                      ).sort((a,b) => (b.tanggal||"").localeCompare(a.tanggal||""))
                    );
                    return fg.length === 0
                      ? <tr><td colSpan={5} className="empty-state">Belum ada data absensi guru</td></tr>
                      : fg.map(a => (
                        <tr key={a.id}>
                          <td style={{ fontWeight:600 }}>{a.teacher?.nama}</td>
                          <td><Badge variant="blue">{a.kelas}</Badge></td>
                          <td>{a.tanggal}</td>

              </table>
            </div>
          </div>
        </div>
      </div>

  }

  // Jurnal Mengajar
  if (menu === "jurnal") {
    // Setiap "gaya" berisi Kegiatan (5 Uraian) & Catatan yang saling berpasangan,
    // sehingga hasil generate selalu konsisten satu sama lain.
    const jurnalStyles = [
      {
        kegiatan: (topik, mapel) => [
          `1. Pembukaan dengan doa bersama dan apersepsi materi "${topik}"`,
          `2. Guru menjelaskan konsep dasar ${topik} secara interaktif`,
          `3. Siswa mengerjakan latihan mandiri tentang ${topik}`,
          `4. Diskusi kelompok dan presentasi hasil belajar`,
          `5. Penutup: refleksi, kesimpulan, dan pemberian tugas rumah`
        ],
        catatan: (topik) => `Sebagian besar siswa memahami materi ${topik} dengan baik.\nPerlu pengulangan pada beberapa siswa yang masih kesulitan.`
      },
      {
        kegiatan: (topik, mapel) => [
          `1. Salam pembuka, doa, dan review materi ${mapel || "sebelumnya"}`,
          `2. Penyampaian tujuan pembelajaran topik "${topik}"`,
          `3. Demonstrasi dan tanya jawab langsung bersama siswa`,
          `4. Siswa mempraktikkan secara berpasangan atau berkelompok`,
          `5. Evaluasi lisan dan penutup dengan motivasi belajar`
        ],
        catatan: (topik) => `Pembelajaran ${topik} berjalan kondusif dan antusias.\nBeberapa siswa perlu pendampingan lebih lanjut di rumah.`
      },
      {
        kegiatan: (topik, mapel) => [
          `1. Ice breaking dan motivasi awal sebelum masuk materi`,
          `2. Pengantar topik "${topik}" dengan media visual/gambar`,
          `3. Penjelasan bertahap disertai contoh nyata dalam kehidupan`,
          `4. Kuis singkat untuk mengukur pemahaman siswa`,
          `5. Penutup: doa, pengumuman tugas, dan salam`
        ],
        catatan: (topik) => `Respon siswa terhadap topik ${topik} sangat positif.\nDisarankan latihan tambahan agar pemahaman semakin kuat.`
      },
      {
        kegiatan: (topik, mapel) => [
          `1. Pembukaan: doa, absensi, dan cek kesiapan belajar`,
          `2. Apersepsi: mengaitkan "${topik}" dengan pengalaman siswa`,
          `3. Eksplorasi materi melalui diskusi dan tanya jawab aktif`,
          `4. Penugasan tertulis/lisan sesuai indikator pembelajaran`,
          `5. Simpulan bersama dan penguatan oleh guru, lalu salam penutup`
        ],
        catatan: (topik) => `Materi ${topik} tersampaikan sesuai rencana pembelajaran.\nSiswa aktif bertanya dan berdiskusi selama kegiatan.`
      },
      {
        kegiatan: (topik, mapel) => [
          `1. Berdoa, mengecek kehadiran, dan menyiapkan bahan ajar`,
          `2. Stimulasi: guru memberikan pertanyaan pemantik tentang "${topik}"`,
          `3. Siswa mengamati, membaca, atau mendengarkan penjelasan materi`,
          `4. Latihan soal / praktik langsung sesuai topik ${topik}`,
          `5. Feedback dari guru, koreksi bersama, dan penutup`
        ],
        catatan: (topik) => `Proses pembelajaran ${topik} berjalan efektif.\nPerlu tindak lanjut untuk siswa yang belum mencapai KKM.`
      },
    ];

    // Menghasilkan Kegiatan (5 Uraian) & Catatan dari gaya yang SAMA,
    // supaya laporan yang tersimpan selalu sesuai dengan hasil generate.
    const genJurnal = (topik, mapel) => {
      const style = jurnalStyles[Math.floor(Math.random() * jurnalStyles.length)];
      return {
        kegiatan: style.kegiatan(topik, mapel).join("\n"),
        catatan: style.catatan(topik)
      };
    };

      <div className="card">
        <div className="card-header"><div className="card-title">📝 Jurnal Mengajar</div></div>
        <div className="card-body">
          <div className="grid grid-3 mb-4">
            <div className="form-group">
              <label className="label">Nama Guru *</label>
              <div className="select-wrap"><select className="select" value={formData.j_teacher || ""} onChange={e => patchForm({ j_teacher: e.target.value })}>
                <option value="">-- Pilih Guru --</option>
                {data.teachers.map(t => <option key={t.id} value={t.id}>{t.nama}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Tanggal *</label>
              <input className="input" type="date" value={formData.j_tanggal || todayStr} onChange={e => patchForm({ j_tanggal: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="label">Kelas *</label>
              <div className="select-wrap"><select className="select" value={formData.j_kelas || ""} onChange={e => patchForm({ j_kelas: e.target.value })}>
                <option value="">-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Mata Pelajaran</label>
              <div className="select-wrap"><select className="select" value={formData.j_mapel || ""} onChange={e => patchForm({ j_mapel: e.target.value })}>
                <option value="">-- Pilih Mapel --</option>
                {data.subjects.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
              </select></div>
            </div>
            <div className="form-group" style={{ gridColumn: "span 2" }}>
              <label className="label">Topik ✨ Auto-isi kegiatan & catatan</label>
              <div style={{ display:"flex", gap:8 }}>
                <input className="input" placeholder="Contoh: Surat Al-Fatihah, Perkalian 1-10..." value={formData.j_topik || ""} onChange={e => {
                  const topik = e.target.value;
                  const gen = topik ? genJurnal(topik, formData.j_mapel) : { kegiatan: "", catatan: "" };
                  patchForm({ j_topik: topik, j_kegiatan: gen.kegiatan, j_catatan: gen.catatan });
                }} style={{ flex:1 }} />
                {formData.j_topik && (
                  <button type="button" title="Acak ulang isi" onClick={() => { const gen = genJurnal(formData.j_topik, formData.j_mapel); patchForm({ j_kegiatan: gen.kegiatan, j_catatan: gen.catatan }); }}
                    style={{ padding:"0 14px", fontSize:18, background:"#e8f5e9", border:"1.5px solid #a7f3d0", borderRadius:8, cursor:"pointer", whiteSpace:"nowrap" }}>🔀</button>
                )}
              </div>
            </div>
          </div>
          <div className="form-group">
            <label className="label">Kegiatan (5 Uraian)</label>
            <textarea className="textarea" rows={5} value={formData.j_kegiatan || ""} onChange={e => patchForm({ j_kegiatan: e.target.value })} placeholder="Terisi otomatis dari topik..." />
          </div>
          <div className="form-group">
            <label className="label">Catatan</label>
            <textarea className="textarea" rows={2} value={formData.j_catatan || ""} onChange={e => patchForm({ j_catatan: e.target.value })} placeholder="Terisi otomatis dari topik..." />
          </div>
          <div className="flex gap-2">
            <button className="btn btn-primary" onClick={saveJurnal} disabled={!formData.j_teacher || !formData.j_kelas || !formData.j_topik}><Icon.Save /> Simpan Jurnal</button>

          <div className="mt-6">
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
              <div style={{ fontWeight:700 }}>Riwayat Jurnal</div>

            </div>
            <div className="flex gap-2 items-center mb-3" style={{flexWrap:"wrap", gap:8}}>
              <div className="select-wrap" style={{width:140}}>
                <select className="select" style={{fontSize:13}} value={formData.rw_jrn_kelas || "Semua"} onChange={e => patchForm({rw_jrn_kelas: e.target.value, rw_jrn_nama: ""})}>
                  {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{width:170}}>
                <select className="select" style={{fontSize:13}} value={formData.rw_jrn_nama || ""} onChange={e => patchForm({rw_jrn_nama: e.target.value})}>
                  <option value="">Semua Guru</option>
                  {data.teachers.map(t => <option key={t.id} value={t.id}>{t.nama}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{width:150}}>
                <select className="select" style={{fontSize:13}} value={formData.rw_jrn_bulan !== undefined ? formData.rw_jrn_bulan : currentMonthStr} onChange={e => patchForm({rw_jrn_bulan: e.target.value})}>
                  {["01","02","03","04","05","06","07","08","09","10","11","12"].map(m => (
                    <option key={m} value={m}>{["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][parseInt(m)-1]}</option>
                  ))}
                  <option value="">Semua Bulan</option>
                </select>
              </div>
            </div>
            <div id="tbl-jurnal" className="row-list">
              {(() => { const jrnBulanAktif = formData.rw_jrn_bulan !== undefined ? formData.rw_jrn_bulan : currentMonthStr;
                const fj = data.journals.filter(j =>
                (formData.rw_jrn_kelas === "Semua" || !formData.rw_jrn_kelas || j.kelas === formData.rw_jrn_kelas) &&
                (!formData.rw_jrn_nama || j.teacherId === formData.rw_jrn_nama) &&
                (!jrnBulanAktif || (j.tanggal && j.tanggal.slice(5,7) === jrnBulanAktif))
              ).slice().sort((a, b) => String(b.id).localeCompare(String(a.id))); return fj.length === 0
                ? <div className="empty-state" style={{padding:20,textAlign:"center",color:"#999"}}>Belum ada data jurnal</div>
                : fj.map(j => (
                <div key={j.id} className="row-item" style={{ alignItems: "flex-start", flexDirection: "column", gap: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", width: "100%" }}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 14 }}>📌 Topik: {j.topik}</div>
                      <div className="text-xs text-muted">{j.teacher?.nama} — {j.kelas} — {j.mataPelajaran}</div>
                    </div>
                    <div className="flex gap-2 items-center">
                      <span className="text-xs text-muted">{j.tanggal}</span>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("journals", j.id, j.topik)}><Icon.Trash /></button>
                    </div>
                  </div>
                  {j.kegiatan && (
                    <div style={{ width: "100%", background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 8, padding: "8px 12px" }}>
                      <div style={{ fontWeight: 700, fontSize: 12, color: "#334155", marginBottom: 4 }}>📋 Kegiatan (5 Uraian):</div>
                      <div style={{ fontSize: 12, color: "#475569", whiteSpace: "pre-line", lineHeight: 1.6 }}>{j.kegiatan}</div>
                    </div>
                  )}
                  {j.catatan && (
                    <div style={{ width: "100%", background: "#fefce8", border: "1px solid #fde68a", borderRadius: 8, padding: "8px 12px" }}>
                      <div style={{ fontWeight: 700, fontSize: 12, color: "#854d0e", marginBottom: 4 }}>📝 Catatan:</div>
                      <div style={{ fontSize: 12, color: "#78350f", whiteSpace: "pre-line", lineHeight: 1.6 }}>{j.catatan}</div>
                    </div>
                  )}
                </div>
              ))})()}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Rekap Nilai
  if (menu === "rekap-nilai") {
    return (
      <div>
        {/* Per Kelas Cards */}
        <div className="grid grid-3">
          {KELAS_LIST.filter(k => k !== "Semua").map(kelas => {
            const students = data.students.filter(s => s.class_name === kelas);
            const kelasGrades = data.grades.filter(g => g.kelas === kelas);
            const isOpen = formData.expandedKelas === kelas;
            return (
              <div key={kelas} className="card" style={isOpen ? { gridColumn: "span 3" } : {}}>
                <div className="card-header">
                  <div className="flex gap-3 items-center">
                    <div style={{ width: 40, height: 40, background: "#dbeafe", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>📚</div>
                    <div>
                      <div className="card-title">{kelas}</div>
                      <div className="card-sub">{students.length} siswa · {kelasGrades.length} nilai</div>
                    </div>
                  </div>
                  <button className="btn btn-outline btn-sm" onClick={() => patchForm({ expandedKelas: isOpen ? null : kelas })}>
                    {isOpen ? "Tutup" : "Input Nilai"}

                </div>
                {isOpen && (
                  <div className="card-body">
                    <div className="grid grid-2">
                      <div style={{ background: "#eff6ff", borderRadius: 12, padding: 16 }}>
                        <div style={{ fontWeight: 700, marginBottom: 12, color: "#1e40af" }}>⚙️ Pengaturan Input</div>
                        <div className="grid grid-2" style={{ gap: 10 }}>
                          <div className="form-group" style={{ gridColumn: "span 2" }}>
                            <label className="label">Guru *</label>
                            <div className="select-wrap"><select className="select" value={formData[`nm_guru_${kelas}`] ?? resolveGuruId(kelas, "nm") ?? ""} onChange={e => patchForm({ [`nm_guru_${kelas}`]: e.target.value })}>
                              <option value="">-- Pilih Guru --</option>
                              {data.teachers.map(t => <option key={t.id} value={t.id}>{t.nama}</option>)}
                            </select></div>
                          </div>
                          <div className="form-group">
                            <label className="label">Mapel *</label>
                            <div className="select-wrap"><select className="select" value={formData[`nm_mapel_${kelas}`] || ""} onChange={e => patchForm({ [`nm_mapel_${kelas}`]: e.target.value })}>
                              <option value="">-- Pilih --</option>
                              {data.subjects.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                            </select></div>
                          </div>
                          <div className="form-group">
                            <label className="label">Jenis *</label>
                            <div className="select-wrap"><select className="select" value={formData[`nm_jenis_${kelas}`] || ""} onChange={e => patchForm({ [`nm_jenis_${kelas}`]: e.target.value })}>
                              <option value="">-- Pilih --</option>
                              {JENIS_NILAI.map(j => <option key={j} value={j}>{j}</option>)}
                            </select></div>
                          </div>
                          <div className="form-group">
                            <label className="label">Tanggal</label>
                            <input className="input" type="date" value={formData[`nm_tanggal_${kelas}`] || todayStr} onChange={e => patchForm({ [`nm_tanggal_${kelas}`]: e.target.value })} />
                          </div>
                          <div className="form-group" style={{ display: "flex", alignItems: "flex-end" }}>
                            <button className="btn btn-blue w-full" onClick={() => saveNilaiKelas(kelas)}><Icon.Save /> Simpan Semua</button>
                          </div>
                        </div>
                        <div style={{ maxHeight: 240, overflowY: "auto" }}>
                          <table>
                            <thead><tr><th style={{ width: 30 }}>No</th><th>NIS</th><th>Nama</th><th>Nilai</th></tr></thead>
                            <tbody>
                              {students.map((s, i) => (
                                <tr key={s.id}>
                                  <td>{i + 1}</td><td className="text-sm">{s.nis}</td><td>{s.nama}</td>
                                  <td><input className="input" type="number" min="0" max="100" style={{ width: 70 }} placeholder="0-100" value={formData[`nm_v_${kelas}_${s.id}`] || ""} onChange={e => patchForm({ [`nm_v_${kelas}_${s.id}`]: e.target.value })} /></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                      <div>
                        <div style={{ fontWeight: 700, marginBottom: 12 }}>📊 Nilai Terbaru</div>
                        <div className="table-wrap" style={{ maxHeight: 300, overflowY: "auto" }}>
                          <table>
                            <thead><tr><th>Nama</th><th>Mapel</th><th>Nilai</th><th></th></tr></thead>
                            <tbody>
                              {kelasGrades.slice(0, 15).map(g => (
                                <tr key={g.id}>
                                  <td className="text-sm">{g.student?.nama}</td>
                                  <td className="text-sm">{g.mataPelajaran}</td>
                                  <td style={{ fontWeight: 700 }}>{g.skor}</td>
                                  <td><button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("grades", g.id, g.student?.nama || g.mataPelajaran)}><Icon.Trash /></button></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Riwayat */}
        <div className="card mb-4">
          <div className="card-header">
            <div className="card-title">📋 Riwayat Nilai</div>
              <button id="btn-pdf-tbl-nilai" onClick={() => downloadTablePDF("tbl-nilai","Riwayat Rekap Nilai","Rekap-Nilai")} style={{ padding:"5px 12px", fontSize:12, fontWeight:700, background:"#dc2626", color:"white", border:"none", borderRadius:8, cursor:"pointer" }}>⬇️ PDF</button>
            <div className="flex gap-2 wrap">
              {[["filterNilaiKelas","kelas"],["filterNilaiMapel","mapel"]].map(([key,type]) => (
                <div key={key} className="select-wrap" style={{ width:150 }}>
                  <select className="select" value={formData[key] || "Semua"} onChange={e => patchForm({ [key]: e.target.value, ...(type==="kelas" ? {filterNilaiNama:""} : {}) })}>
                    {type==="kelas"
                      ? KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)
                      : [<option key="s" value="Semua">Semua Mapel</option>, ...data.subjects.map(s => <option key={s.id} value={s.name}>{s.name}</option>)]}
                  </select>
                </div>
              ))}
              <div className="select-wrap" style={{ width:170 }}>
                <select className="select" value={formData.filterNilaiNama || ""} onChange={e => patchForm({filterNilaiNama: e.target.value})}>
                  <option value="">Semua Nama</option>
                  {data.students.filter(s => !formData.filterNilaiKelas || formData.filterNilaiKelas === "Semua" || s.class_name === formData.filterNilaiKelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
