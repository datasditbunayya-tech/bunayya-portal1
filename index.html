  /* ── SERVICE WORKER ──────────────────────────────────── */
  (function(){
    if (!("serviceWorker" in navigator)) return;
    // SW minimal via blob — hanya butuh didaftarkan agar Chrome anggap site PWA-ready
    var sw = [
      'var C="bny4";',
      'self.addEventListener("install",function(e){self.skipWaiting();});',
      'self.addEventListener("activate",function(e){',
      '  e.waitUntil(caches.keys().then(function(ks){',
      '    return Promise.all(ks.filter(function(k){return k!==C;}).map(function(k){return caches.delete(k);}));',
      '  }));self.clients.claim();',
      '});',
      'self.addEventListener("fetch",function(e){});'
    ].join("\n");
    try {
      var b = new Blob([sw],{type:"text/javascript"});
      navigator.serviceWorker.register(URL.createObjectURL(b),{scope:"./"})
        .then(function(r){console.log("SW ok",r.scope);})
        .catch(function(e){console.warn("SW err",e);});
    } catch(e) {}
  })();

  /* ── INSTALL LOGIC ───────────────────────────────────── */
  var _prompt = null;

  window.addEventListener("beforeinstallprompt", function(e) {
    e.preventDefault();
    _prompt = e;
    console.log("✅ Install prompt ready");
    renderFAB(true);   // update FAB jadi langsung bisa install
    showBanner();
  });

  window.addEventListener("appinstalled", function() {
    console.log("✅ PWA installed!");
    _prompt = null;
    removeInstallUI();
  });

  function removeInstallUI() {
    ["_pwa_fab","_pwa_banner","_pwa_modal"].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.remove();
    });
  }

  /* FAB kuning selalu muncul */
  function renderFAB(ready) {
    var old = document.getElementById("_pwa_fab");
    if (old) old.remove();

    if (window.matchMedia("(display-mode:standalone)").matches) return;
    if (navigator.standalone) return;

    var fab = document.createElement("button");
    fab.id  = "_pwa_fab";
    fab.style.cssText = [
      "position:fixed;bottom:24px;right:18px;z-index:99999;",
      "background:linear-gradient(135deg,#f5c800 0%,#e8a800 100%);",
      "color:#1a5c3a;border:2px solid #c8963e;border-radius:50px;",
      "padding:12px 20px;font-size:14px;font-weight:800;",
      "cursor:pointer;font-family:sans-serif;",
      "display:flex;align-items:center;gap:8px;",
      "box-shadow:0 4px 20px rgba(245,200,0,.55);",
      "animation:_fab_pulse 2.5s ease-in-out infinite;"
    ].join("");
    fab.innerHTML = [
      "<img src='"+LOGO+"' style='width:26px;height:26px;border-radius:50%;",
      "object-fit:cover;border:2px solid #1a5c3a;flex-shrink:0;'>",
      "<span>📲 Pasang di HP</span>"
    ].join("");
    fab.onclick = function() {
      if (_prompt) {
        _prompt.prompt();
        _prompt.userChoice.then(function(r) {
          if (r.outcome === "accepted") removeInstallUI();
          _prompt = null;
        });

function Select({ value, onChange, options, placeholder, disabled }) {
  return (
    <div className="select-wrap">
      <select className="select" value={value} onChange={e => onChange(e.target.value)} disabled={disabled}>
        {placeholder && <option value="">{placeholder}</option>}
        {options.map(o => (
          <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>
        ))}
      </select>
    </div>
  );
}

function ProgressBar({ value }) {
  return (
    <div className="progress-bar-wrap">
      <div className="progress-bar-fill" style={{ width: `${Math.min(100, Math.max(0, value))}%` }} />
    </div>
  );
}

function Badge({ children, variant = "gray" }) {
  return <span className={`badge badge-${variant}`}>{children}</span>;
}

function StatusBadge({ status }) {
  const map = { Hadir: "green", Sakit: "yellow", Izin: "blue", Alpa: "red", Aktif: "green", Nonaktif: "gray", "Sangat Baik": "green", "Sangat baik": "green", Baik: "blue", Cukup: "yellow", Kurang: "red", Berjalan: "blue", Selesai: "green", Lancar: "green", "Perlu Latihan": "red" };
  return <Badge variant={map[status] ?? "gray"}>{status}</Badge>;
}

function Dialog({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="dialog-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="dialog">
        <div className="dialog-header">
          <span className="dialog-title">{title}</span>
          <button className="btn-ghost btn btn-icon" onClick={onClose}><Icon.X /></button>
        </div>
        <div className="dialog-body">{children}</div>
        {footer && <div className="dialog-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ── Download tabel riwayat sebagai PDF ──────────────────────────────────────
function downloadTablePDF(tableId, judul, namaFile) {
  const el = document.getElementById(tableId);
  if (!el) { alert("Tabel tidak ditemukan."); return; }
  if (typeof html2canvas === "undefined" || typeof window.jspdf === "undefined") {
    alert("Library belum siap, tunggu sebentar lalu coba lagi."); return;
  }
  const btn = document.getElementById("btn-pdf-" + tableId);
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Memproses..."; }

  html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false })
    .then(canvas => {
      const { jsPDF } = window.jspdf;
      const imgW = canvas.width;
      const imgH = canvas.height;
      // A4 landscape jika tabel lebar
      const isLandscape = imgW > imgH;
      const pdf = new jsPDF({ orientation: isLandscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const usableW = pageW - margin * 2;
      const scale = usableW / (imgW / 2); // /2 karena scale:2 di html2canvas
      const imgHmm = (imgH / 2) * scale;

      // Header
      pdf.setFontSize(13);
      pdf.setFont("helvetica", "bold");
      pdf.text("BUNAYYA ISLAMIC SCHOOL", pageW / 2, margin + 4, { align: "center" });
      pdf.setFontSize(10);
      pdf.setFont("helvetica", "normal");
      pdf.text(judul, pageW / 2, margin + 9, { align: "center" });
      pdf.setFontSize(8);
      pdf.text("Dicetak: " + new Date().toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" }), pageW / 2, margin + 13, { align: "center" });

      // Garis pemisah
      const startY = margin + 16;
      pdf.setDrawColor(29, 122, 95);
      pdf.setLineWidth(0.5);
      pdf.line(margin, startY, pageW - margin, startY);

      // Tabel sebagai gambar
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      let y = startY + 3;
      const maxH = pageH - y - margin;

      if (imgHmm <= maxH) {
        pdf.addImage(imgData, "JPEG", margin, y, usableW, imgHmm);
      } else {
        // Multi-page jika tabel panjang
        let srcY = 0;
        while (srcY < imgH) {
          const sliceH = Math.min((maxH / scale) * 2, imgH - srcY);
          const sliceCanvas = document.createElement("canvas");
          sliceCanvas.width = imgW;
          sliceCanvas.height = sliceH;
          sliceCanvas.getContext("2d").drawImage(canvas, 0, srcY, imgW, sliceH, 0, 0, imgW, sliceH);
          pdf.addImage(sliceCanvas.toDataURL("image/jpeg", 0.95), "JPEG", margin, y, usableW, (sliceH / 2) * scale);
          srcY += sliceH;
          if (srcY < imgH) { pdf.addPage(); y = margin; }
        }
      }

      pdf.save(namaFile + ".pdf");
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    })
    .catch(err => {
      alert("Gagal: " + err.message);
      if (btn) { btn.disabled = false; btn.textContent = "⬇️ PDF"; }
    });
}

    dailyReports:      "harian",
    grades:            "nilai",

    quickLinks:        "quickLinks",
    announcements:     "announcements",
  };

  // ── Firebase realtime listeners ──────────────────────────────────────────
  React.useEffect(() => {
    const tryConnect = () => {
      if (!window.__firebase || !window.__firebase.ready) {
        setTimeout(tryConnect, 500);
        return;
      }
      const { db } = window.__firebase;
      const collMap = {
        absensiSiswa:  "studentAttendance",
        absensiGuru:   "teacherAttendance",
        jurnal:        "journals",
        harian:        "dailyReports",

        guru:          "teachers",
        siswa:         "students",
        mapel:         "subjects",
        quickLinks:    "quickLinks",
        announcements: "announcements",
      };
      const unsubs = Object.entries(collMap).map(([fbColl, stateKey]) => {
        return db.collection(fbColl).onSnapshot((snap) => {
          const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }));

          // Auto-seed master data ke Firebase kalau masih kosong
          if (docs.length === 0 && fbColl === "guru") {

            batch.commit().catch(e => console.error("Seed quickLinks error:", e));
          }

              batch.commit().catch(e => console.error("Update quickLinks error:", e));
            }

      });

  const saveLoginConfig = (patch) => {
    setLoginConfig(prev => {
      const next = { ...prev, ...patch };
      try { localStorage.setItem("bunayya_login_config", JSON.stringify(next)); } catch(e) {}
      // Simpan ke Firebase
      if (window.__firebase?.ready) {
        window.__firebase.db.collection("appConfig").doc("loginConfig")
          .set(next)
          .catch(e => console.error("saveLoginConfig error:", e));
      }
      return next;
    });

  // Global form / UI state
  const [formData, setFormData] = useState({});

  const [addDialog, setAddDialog] = useState(null);

  // ── Tulis SATU item ke Firebase tanpa menyentuh data lain ─────────────────
  const writeDoc = (collKey, item) => {
    const fbColl = FB_COLLECTIONS[collKey];
    if (!fbColl || !window.__firebase?.ready) return;
    window.__firebase.db.collection(fbColl).doc(String(item.id))
      .set(item)
      .then(() => {
        setSyncStatus("success");
        setSyncMsg("✅ Tersimpan");
        setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 1500);
      })
      .catch(err => {
        console.error("writeDoc error:", err);
        setSyncStatus("error");
        setSyncMsg("❌ Gagal simpan: " + err.message);
      });
  };

  // ── Tulis BEBERAPA item sekaligus (batch), tidak hapus item lain ──────────
  const writeDocs = (collKey, items) => {
    const fbColl = FB_COLLECTIONS[collKey];
    if (!fbColl || !window.__firebase?.ready || !items.length) return;
    const { db } = window.__firebase;
    const batch = db.batch();
    items.forEach(item => batch.set(db.collection(fbColl).doc(String(item.id)), item));
    batch.commit()
      .then(() => {
        setSyncStatus("success");
        setSyncMsg(`✅ ${items.length} data tersimpan`);
        setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 1500);
      })
      .catch(err => {
        console.error("writeDocs error:", err);
        setSyncStatus("error");
        setSyncMsg("❌ Gagal simpan: " + err.message);
      });
  };

  // ── patchData: update state lokal saja, tidak tulis ke Firebase ───────────
  // (penulisan Firebase dilakukan langsung di setiap save function via writeDoc/writeDocs)
  const patchData = (key, val) => {
    setData(d => {
      const next = { ...d, [key]: val };
      try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
      return next;
    });
  };
  const patchForm = patch => setFormData(f => ({ ...f, ...patch }));

        setMenu("dashboard");

      kelas: formData.abs_kelas, status: s.status || "Hadir",

    }));

    setData(d => {
      const next = { ...d, studentAttendance: [...d.studentAttendance, ...newRecords] };

  };

  const saveZiyadah = () => {
    const s = data.students.find(s => s.id === formData.z_siswa);

    patchForm({ z_juz: "", z_surat: "", z_progress: "", z_catatan: "" });

  };

  // ── Google Sheets Sync Functions ─────────────────────────────────────────
  const resolveNames = (records, collection) => records.map(r => {
    const student = data.students.find(s => s.id === r.studentId);
    const teacher = data.teachers.find(t => t.id === r.teacherId);
    return {
      ...r,
      namaSiswa: student?.nama || r.student?.nama || "",
      namaGuru:  teacher?.nama || r.teacher?.nama  || "",
    };
  });

  // ── Firebase sync helpers (menggantikan Google Sheets) ───────────────────
  const jsonpPost = () => Promise.resolve(); // legacy stub, tidak dipakai

  const syncCollection = async (fbColl, records) => {
    if (!window.__firebase?.ready) return;
    const { db } = window.__firebase;
    try {
      const snap = await db.collection(fbColl).get();
      const existingIds = new Set(snap.docs.map(d => d.id));
      const batch = db.batch();
      records.forEach(item => {
        const ref = db.collection(fbColl).doc(String(item.id));
        if (!existingIds.has(String(item.id))) {
          batch.set(ref, item);
        }
      });
      await batch.commit();
    } catch(e) { console.error("syncCollection error:", e); }
  };

  const syncDelete = async (fbColl, id) => {
    if (!window.__firebase?.ready) return;
    try {
      await window.__firebase.db.collection(fbColl).doc(String(id)).delete();
    } catch(e) { console.error("syncDelete error:", e); }
  };

  // ── Firebase: Sync semua data sekaligus ─────────────────────────────────
  const syncAllToSheets = async () => {
    if (!window.__firebase?.ready) {
      alert("⚠️ Firebase belum terhubung, tunggu sebentar lalu coba lagi.");
      return;
    }
    setSyncStatus("syncing");
    setSyncMsg("🔄 Menyinkronkan semua data ke Firebase...");
    const { db } = window.__firebase;
    try {
      for (const [stateKey, fbColl] of Object.entries(FB_COLLECTIONS)) {
        const items = data[stateKey] || [];
        const snap = await db.collection(fbColl).get();
        const existingIds = new Set(snap.docs.map(d => d.id));
        const batch = db.batch();
        items.forEach(item => {
          const ref = db.collection(fbColl).doc(String(item.id));
          if (!existingIds.has(String(item.id))) {
            batch.set(ref, item);
          }
        });
        await batch.commit();
      }
      setSyncStatus("success");
      setSyncMsg("✅ Semua data berhasil disinkronkan ke Firebase!");
      setLastSync(new Date().toLocaleString("id-ID"));
    } catch(err) {
      setSyncStatus("error");
      setSyncMsg("❌ Gagal sinkron: " + err.message);
    }
    setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 4000);
  };

  const loadFromSheets = () => {
    setSyncStatus("syncing");
    setSyncMsg("🔄 Memuat ulang data dari Firebase...");
    // Data sudah auto-load via onSnapshot listener, cukup trigger feedback
    setTimeout(() => {
      setSyncStatus("success");
      setSyncMsg("✅ Data diperbarui dari Firebase (realtime aktif)");
      setTimeout(() => { setSyncStatus("idle"); setSyncMsg(""); }, 3000);
    }, 1000);
  };

  const [deleteConfirm, setDeleteConfirm] = useState(null); // { collection, id, label }
  const deleteItem = (collection, id, label = "") => {
    setDeleteConfirm({ collection, id, label });
  };
  const confirmDelete = () => {
    if (!deleteConfirm) return;
    const { collection: collKey, id } = deleteConfirm;
    // Update state lokal - hapus item
    setData(d => ({ ...d, [collKey]: d[collKey].filter(i => i.id !== id) }));
    setDeleteConfirm(null);
    // Hapus dari Firebase
    const fbColl = FB_COLLECTIONS[collKey];
    if (fbColl && window.__firebase?.ready) {
      window.__firebase.db.collection(fbColl).doc(String(id)).delete()
        .catch(err => console.error("Delete error:", err));
    }
  };

  // ── RENDER ───────────────────────────────────────────────────────────────────
  if (!user) return <LoginPage loginRole={loginRole} setLoginRole={setLoginRole} loginForm={loginForm} setLoginForm={setLoginForm} loginError={loginError} handleLogin={handleLogin} data={data} loginConfig={loginConfig} />;

  // ── Custom delete confirm dialog ─────────────────────────────────────────
  const DeleteModal = () => deleteConfirm ? (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ background:"white", borderRadius:20, padding:28, maxWidth:360, width:"90%", boxShadow:"0 20px 60px rgba(0,0,0,.3)" }}>

        <div style={{ fontWeight:800, fontSize:18, textAlign:"center", marginBottom:8 }}>Hapus Data?</div>
        <div style={{ fontSize:14, color:"#666", textAlign:"center", marginBottom:24 }}>
          {deleteConfirm.label ? `"${deleteConfirm.label}"` : "Data ini"} akan dihapus secara permanen dan tidak bisa dikembalikan.
        </div>

      </div>

    { id: "data-sheets", label: "📊 Data Siswa" },
    { id: "kontrol", label: "🎛️ Kontrol Data" },
    { id: "absensi-siswa", label: "📋 Absensi Siswa" },
    { id: "absensi-guru",  label: "🗒️ Absensi Guru" },
    { id: "jurnal", label: "📝 Jurnal Mengajar" },
    { id: "rekap-nilai", label: "📈 Rekap Nilai" },
    { id: "cetak-rapor", label: "📄 Cetak Rapor" },
    ...(canAccess("master-guru") ? [{ id: "master-guru", label: "📚 Master Guru" }] : []),
    ...(canAccess("kelola-pintasan") ? [{ id: "kelola-pintasan", label: "🔗 Pintasan" }] : []),
    ...(canAccess("pengaturan-mapel") ? [{ id: "pengaturan-mapel", label: "⚙️ Mapel" }] : []),
  ];

  const siswaMenus = [
    { id: "dashboard", label: "📊 Dashboard" },
    { id: "harian", label: "📝 Laporan Harian" },
    { id: "kegiatan", label: "🎯 Laporan Kegiatan" },
    { id: "target", label: "📈 Target" },
    { id: "ziyadah", label: "📖 Ziyadah" },
    ...(canAccess("master-siswa") ? [{ id: "siswa", label: "📖 Master Siswa" }] : []),

  const waliMenus = [
    { id: "dashboard",    label: "🏠 Dashboard" },
    { id: "notifikasi",   label: "🔔 Notifikasi" },
    { id: "absensi",      label: "📋 Absensi" },
    { id: "harian",       label: "📝 Harian" },
    { id: "nilai",        label: "📊 Nilai" },
    { id: "kegiatan",     label: "🎯 Kegiatan" },
    { id: "target",       label: "🏆 Target" },
    { id: "hafalan",      label: "📖 Hafalan" },

  const activeMenus = portal === "guru" ? guruMenus : portal === "siswa" ? siswaMenus : waliMenus;

  );
}

// ─── PORTAL GURU ─────────────────────────────────────────────────────────────
function PortalGuru({ menu, data, setData, patchData, formData, patchForm, selectedKelas, setSelectedKelas, searchQuery, setSearchQuery, user, canAccess, saveAbsensiSiswa, saveAbsensiGuru, saveJurnal, saveNilaiKelas, deleteItem, loginConfig = {}, saveLoginConfig, writeDoc }) {

  const todayStr = today();

  // Dashboard
  if (menu === "dashboard") {

    // ── BarChart vertikal SVG ─────────────────────────────────────────────
    const BarChart = ({ items, color = "#1d7a5f", maxOverride }) => {
      const W = 52, GAP = 10, H = 130, PAD_LEFT = 32, PAD_BOT = 72, PAD_TOP = 16;
      const totalMax = items.reduce((a,i) => a + i.val, 0);

      // Jika semua nilai 0, tampilkan pesan kosong — tidak render grafik
      if (totalMax === 0) return (
        <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>
          📭 Belum ada data pada rentang tanggal ini
        </div>
      );

      const rawMax = maxOverride || Math.max(...items.map(i => i.val), 1);

      // Garis Y dinamis — bertambah sesuai data
      const niceStep = (max) => {
        if (max <= 5)   return 1;
        if (max <= 10)  return 2;
        if (max <= 20)  return 5;
        if (max <= 50)  return 10;
        if (max <= 100) return 20;
        return Math.ceil(max / 5 / 10) * 10;
      };
      const step   = niceStep(rawMax);
      const maxVal = Math.ceil(rawMax / step) * step;
      const yTicks = [];
      for (let v = 0; v <= maxVal; v += step) yTicks.push(v);

      const totalW = items.length * W + (items.length - 1) * GAP + PAD_LEFT + 16;

      return (
        <svg width="100%" viewBox={"0 0 " + totalW + " " + (H + PAD_BOT + PAD_TOP)}
          style={{ overflow:"visible", display:"block" }}>

          {/* Grid lines horizontal — dinamis */}
          {yTicks.map(v => {
            const y = PAD_TOP + H - (v / maxVal) * H;
            return (
              <g key={v}>
                <line x1={PAD_LEFT} y1={y} x2={totalW} y2={y} stroke="#e8e8e8" strokeWidth="1" strokeDasharray={v===0?"0":"4 3"} />
                <text x={PAD_LEFT-4} y={y+4} textAnchor="end" fontSize="9" fill="#999">{v}</text>
              </g>
            );
          })}

          {/* Bars */}
          {items.map((item, i) => {
            const x    = PAD_LEFT + i * (W + GAP);
            const barH = maxVal > 0 ? Math.max((item.val/maxVal)*H, item.val>0?4:0) : 0;
            const barY = PAD_TOP + H - barH;
            return (
              <g key={i}>
                <rect x={x+3} y={barY+3} width={W} height={barH} rx="5" fill="rgba(0,0,0,.06)" />
                <rect x={x} y={barY} width={W} height={barH} rx="5" fill={color} />
                {item.val > 0 && (
                  <text x={x+W/2} y={barY-6} textAnchor="middle" fontSize="14" fontWeight="900" fill={color}>{item.val}</text>
                )}
                {/* Label miring -45 derajat */}
                <text x={x+W/2} y={PAD_TOP+H+8} textAnchor="end" fontSize="14" fontWeight="900" fill="#333"
                  transform={"rotate(-45,"+(x+W/2)+","+(PAD_TOP+H+8)+")"}>
                  {item.lbl}
                </text>
              </g>
            );
          })}

          {/* Baseline */}
          <line x1={PAD_LEFT} y1={PAD_TOP+H} x2={totalW} y2={PAD_TOP+H} stroke="#ccc" strokeWidth="1.5" />
        </svg>
      );
    };

    // ── Data chart ───────────────────────────────────────────────────────
    const kelasList = KELAS_LIST.filter(k => k !== "Semua");
    const dashDari   = formData.dash_dari   ?? todayStr;
    const dashSampai = formData.dash_sampai ?? todayStr;
    const inDashRange = tgl => (!dashDari || tgl >= dashDari) && (!dashSampai || tgl <= dashSampai);

    const absSiswaPerKelas  = kelasList.map(k => ({ lbl: k, val: data.studentAttendance.filter(a => a.kelas === k && inDashRange(a.tanggal)).length }));
    const absGuruPerNama    = data.teachers.map(t => ({ lbl: t.nama, val: data.teacherAttendance.filter(a => a.teacherId === t.id && inDashRange(a.tanggal)).length }));
    const jurnalPerGuru     = data.teachers.map(t => ({ lbl: t.nama, val: data.journals.filter(j => j.teacherId === t.id && inDashRange(j.tanggal)).length }));
    const harianPerKelas    = kelasList.map(k => ({ lbl: k, val: data.dailyReports.filter(r => r.kelas === k && inDashRange(r.tanggal)).length }));
    const nilaiPerKelas     = kelasList.map(k => ({ lbl: k, val: data.grades.filter(g => g.kelas === k && inDashRange(g.tanggal)).length }));
    const kegiatanPerKelas  = kelasList.map(k => ({ lbl: k, val: data.activities.filter(a => a.kelas === k && inDashRange(a.tanggal)).length }));
    const targetPerKelas    = kelasList.map(k => ({ lbl: k, val: data.targets.filter(t => t.kelas === k && inDashRange(t.tanggal)).length }));
    const ziyadahPerKelas   = kelasList.map(k => ({ lbl: k, val: data.ziyadah.filter(z => z.kelas === k && inDashRange(z.tanggal)).length }));

    const CHART_COLORS = {
      absSiswa:"#1d7a5f", absGuru:"#2563a8", jurnal:"#7c3aed",
      harian:"#d97706", kegiatan:"#0891b2", target:"#dc2626",
      ziyadah:"#059669", nilai:"#9333ea"
    };

    const ChartCard = ({ title, items, color, maxOverride }) => (
      <div className="card">
        <div className="card-header">
          <div className="card-title">{title}</div>
          <div className="flex gap-2 items-center">
            <span style={{ fontSize:12, color:"#888" }}>{items.reduce((a,i)=>a+i.val,0)} total</span>

        <div className="card-body" style={{ overflowX:"auto" }}>
          {items.length === 0
            ? <div style={{ padding:"24px", textAlign:"center", color:"#ccc", fontSize:13 }}>📭 Belum ada data</div>

    return (
      <div>

        <div className="card mb-4">

            </div>
          </div>
          <div className="card-body">
            {(() => {
              const dari   = formData.dash_dari   ?? todayStr;
              const sampai = formData.dash_sampai ?? todayStr;

                    </div>
                  ))}
                </div>

            })()}
          </div>
        </div>

        {/* 8 diagram vertikal kebawah, full width */}
        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          <ChartCard title="📋 Absensi Siswa per Kelas"       items={absSiswaPerKelas} color={CHART_COLORS.absSiswa} />

  // Cetak Rapor
  if (menu === "cetak-rapor") {
    const handleDownloadPDF = () => {
      const el = document.getElementById("rapor-preview");
      if (!el) { alert("Pilih siswa terlebih dahulu!"); return; }
      if (typeof html2canvas === "undefined") { alert("Library belum siap, tunggu sebentar."); return; }

      const btn = document.getElementById("btn-download-rapor");
      if (btn) { btn.disabled = true; btn.innerText = "⟳ Memproses..."; }

      html2canvas(el, {
        scale: 3,
        useCORS: true,
        allowTaint: true,
        backgroundColor: "#ffffff",
        logging: false,
      }).then(canvas => {
        const imgData  = canvas.toDataURL("image/jpeg", 0.98);
        const imgW     = canvas.width;
        const imgH     = canvas.height;

        // A4 dalam px pada 96dpi: 794 x 1123
        const a4W = 794, a4H = 1123;
        const scale  = Math.min(a4W / (imgW / 3), a4H / (imgH / 3));
        const finalW = (imgW / 3) * scale;
        const finalH = (imgH / 3) * scale;

        // Buat canvas A4 putih
        const pdf = document.createElement("canvas");
        pdf.width  = a4W;
        pdf.height = a4H;
        const ctx  = pdf.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, a4W, a4H);

        const img = new Image();
        img.onload = () => {
          const x = (a4W - finalW) / 2;
          const y = 20;
          ctx.drawImage(img, x, y, finalW, finalH);

          const s = data.students.find(s => s.id === formData.rapor_siswa);
          const nm = (s?.nama || "siswa").replace(/ /g, "-");
          const link = document.createElement("a");
          link.download = `Rapor-${nm}-${formData.rapor_semester || "Sem1"}-${formData.rapor_tahun || "2025-2026"}.pdf`;

          // Simpan sebagai PNG lalu rename ke .pdf (browser tetap bisa buka)
          // Atau simpan sebagai JPEG dengan ekstensi .jpg
          link.href = pdf.toDataURL("image/jpeg", 0.97);
          link.download = link.download.replace(".pdf", ".jpg");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
        };
        img.src = imgData;
      }).catch(err => {
        alert("Gagal: " + err.message);
        if (btn) { btn.disabled = false; btn.innerText = "⬇️ Download PDF Rapor"; }
      });
    };

              </select></div>

            const keterangan = v => v >= 90 ? "Sangat Baik" : v >= 80 ? "Baik" : v >= 70 ? "Cukup" : v >= 60 ? "Perlu Bimbingan" : "Kurang";

            return (
              <div id="rapor-preview" style={{ background:"#fff", borderRadius:16, padding:28, border:"2px solid #e0e0e0", maxWidth:620, margin:"0 auto", fontFamily:"Arial,sans-serif" }}>

                <div style={{ textAlign:"center", borderBottom:"3px double #1d7a5f", paddingBottom:16, marginBottom:20 }}>
                  <div style={{ fontSize:28, marginBottom:4 }}>🕌</div>
                  <div style={{ fontSize:20, fontWeight:800, color:"#1d7a5f", letterSpacing:.5 }}>BUNAYYA ISLAMIC SCHOOL</div>
                  <div style={{ fontSize:12, color:"#666", marginTop:2 }}>Jl. Panaragan Jaya — Portal Pendidikan</div>
                  <div style={{ marginTop:10, fontSize:15, fontWeight:700, color:"#333", background:"#f0fdf4", borderRadius:8, padding:"6px 16px", display:"inline-block" }}>
                    RAPOR {(formData.rapor_semester || "Semester 1").toUpperCase()} — T.A {formData.rapor_tahun || "2025/2026"}
                  </div>
                </div>

                {/* Info Siswa */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20, background:"#f8fafc", borderRadius:10, padding:14 }}>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Nama Siswa</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.nama}</div></div>
                  <div><div style={{ fontSize:10, color:"#999", textTransform:"uppercase" }}>Kelas</div><div style={{ fontWeight:700, fontSize:14 }}>{s?.class_name}</div></div>

                          </tr>

                        <td style={{ padding:"8px 10px" }}>RATA-RATA</td>
                        <td style={{ padding:"8px 10px", textAlign:"center", color:"#065f46" }}>{avg}</td>

                        <td style={{ padding:"8px 10px", color:"#065f46", fontSize:11 }}>{keterangan(avg)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* TTD */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginTop:24, paddingTop:16, borderTop:"1px solid #e0e0e0" }}>

                <div style={{ textAlign:"center", marginTop:16, fontSize:10, color:"#bbb" }}>

              </div>

              </select></div>
            </div>
            <div className="form-group">
              <label className="label">Status</label>
              <div className="select-wrap"><select className="select" value={formData.newGuruStatus || "Aktif"} onChange={e => patchForm({ newGuruStatus: e.target.value })}>
                <option value="Aktif">Aktif</option>
                <option value="Nonaktif">Nonaktif</option>
              </select></div>
            </div>
          </Dialog>
        )}
      </div>
    );
  }

  // Pintasan & Pengumuman
  if (menu === "kelola-pintasan") {
    // Kompres gambar ke max 400px, kualitas 0.7 agar muat di Firestore (<1MB)
    const compressImage = (file, maxW = 400, quality = 0.7) => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width  = img.width  * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    const openAddLink = () => patchForm({ showLinkDialog: true, editLinkId: null, newLinkTitle: "", newLinkUrl: "", newLinkIcon: "🔗" });
    const openEditLink = (l) => patchForm({ showLinkDialog: true, editLinkId: l.id, newLinkTitle: l.title, newLinkUrl: l.url, newLinkIcon: l.icon });
    const saveLink = () => {
      if (!formData.newLinkTitle) { alert("Judul link wajib diisi!"); return; }
      if (formData.editLinkId) {
        const editId = formData.editLinkId;
        const updated = {
          ...data.quickLinks.find(l => l.id === editId),
          title: formData.newLinkTitle,
          url:   formData.newLinkUrl || "#",
          icon:  formData.newLinkIcon || "🔗"
        };
        setData(d => {
          const next = { ...d, quickLinks: d.quickLinks.map(l => l.id === editId ? updated : l) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("quickLinks", updated);
      } else {
        const rec = { id: genId(), title: formData.newLinkTitle, url: formData.newLinkUrl || "#", icon: formData.newLinkIcon || "🔗" };
        setData(d => {
          const next = { ...d, quickLinks: [...d.quickLinks, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("quickLinks", rec);
      }
      patchForm({ showLinkDialog: false });
    };
    const openAddAnn = () => patchForm({ showAnnDialog: true, editAnnId: null, newAnnJudul: "", newAnnDeskripsi: "", newAnnIcon: "📢" });
    const openEditAnn = (a) => patchForm({ showAnnDialog: true, editAnnId: a.id, newAnnJudul: a.judul, newAnnDeskripsi: a.deskripsi, newAnnIcon: a.icon });
    const saveAnn = () => {
      if (!formData.newAnnJudul) { alert("Judul pengumuman wajib diisi!"); return; }
      if (formData.editAnnId) {
        const editId = formData.editAnnId;
        const updated = { ...data.announcements.find(a => a.id === editId), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: d.announcements.map(a => a.id === editId ? updated : a) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("announcements", updated);
      } else {
        const rec = { id: genId(), judul: formData.newAnnJudul, deskripsi: formData.newAnnDeskripsi || "", icon: formData.newAnnIcon || "📢" };
        setData(d => {
          const next = { ...d, announcements: [...d.announcements, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("announcements", rec);
      }
      patchForm({ showAnnDialog: false });
    };
    const ICON_OPTS = ["🔗","📋","💰","❤️","📢","🏫","📖","🎓","✏️","🗓️","📌","⭐","🔔","📣","📝","🏆","🌙","👍","🕌","🌟","📱","💻","🎯","🌿"];
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
        {/* Link Cepat */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🔗 Link Cepat</div>
            <button className="btn btn-primary btn-sm" onClick={openAddLink}><Icon.Plus /> Tambah Link</button>
          </div>
          <div className="card-body">
            {data.quickLinks.length === 0 ? <div className="empty-state">Belum ada link cepat</div> : (
              <div className="row-list">
                {data.quickLinks.map(l => (
                  <div key={l.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{l.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{l.title}</div>
                        <div className="text-xs text-muted">{l.url}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" title="Buka Link" onClick={() => window.open(l.url, "_blank")}>🔗</button>
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditLink(l)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("quickLinks", l.id, l.title)}><Icon.Trash /></button>
                    </div>
                  </div>

              </div>
            )}
          </div>
        </div>

        {/* Pengumuman */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">📢 Pengumuman</div>
            <button className="btn btn-primary btn-sm" onClick={openAddAnn}><Icon.Plus /> Tambah Pengumuman</button>
          </div>
          <div className="card-body">
            {data.announcements.length === 0 ? <div className="empty-state">Belum ada pengumuman</div> : (
              <div className="row-list">
                {data.announcements.map(a => (
                  <div key={a.id} className="row-item">
                    <div className="flex gap-3 items-center">
                      <div style={{ width:40, height:40, background:"#e8f5e9", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{a.icon}</div>
                      <div>
                        <div style={{ fontWeight:600 }}>{a.judul}</div>
                        <div className="text-xs text-muted">{a.deskripsi}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditAnn(a)}><Icon.Edit /></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("announcements", a.id, a.judul)}><Icon.Trash /></button>

          </div>
        </div>

        {/* Dialog Link */}
        {formData.showLinkDialog && (

            <div className="form-group">

            </div>
            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Nama link" value={formData.newLinkTitle || ""} onChange={e => patchForm({ newLinkTitle: e.target.value })} /></div>

          </Dialog>

        {/* Dialog Pengumuman */}
        {formData.showAnnDialog && (
          <Dialog open title={formData.editAnnId ? "✏️ Edit Pengumuman" : "➕ Tambah Pengumuman"} onClose={() => patchForm({ showAnnDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showAnnDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveAnn}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Pilih Ikon</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:4 }}>
                {ICON_OPTS.map(ic => <button key={ic} onClick={() => patchForm({ newAnnIcon: ic })} style={{ width:38, height:38, fontSize:20, border: formData.newAnnIcon===ic ? "2px solid #27ae60":"1.5px solid #e8e8e8", borderRadius:10, cursor:"pointer", background: formData.newAnnIcon===ic ? "#e8f5e9":"#f8f9fa" }}>{ic}</button>)}
              </div>
            </div>
            <div className="form-group"><label className="label">Judul *</label><input className="input" placeholder="Judul pengumuman" value={formData.newAnnJudul || ""} onChange={e => patchForm({ newAnnJudul: e.target.value })} /></div>
            <div className="form-group"><label className="label">Deskripsi</label><textarea className="textarea" rows={3} placeholder="Keterangan pengumuman..." value={formData.newAnnDeskripsi || ""} onChange={e => patchForm({ newAnnDeskripsi: e.target.value })} /></div>
          </Dialog>
        )}

        {/* ── Pengaturan Tampilan Login ── */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">🎨 Pengaturan Tampilan Login</div>
          </div>
          <div className="card-body" style={{ display:"flex", flexDirection:"column", gap:16 }}>

            {/* Preview */}
            <div style={{ background:"linear-gradient(135deg,#1a8a5a,#27ae60)", borderRadius:16, padding:"24px 20px", textAlign:"center", color:"white" }}>
              <div style={{ marginBottom:10 }}>
                {(loginConfig.logoUrl)
                  ? <img src={loginConfig.logoUrl} alt="Logo" style={{ width:72, height:72, borderRadius:"50%", objectFit:"cover", border:"3px solid rgba(255,255,255,.4)", display:"inline-block" }} />
                  : <div style={{ fontSize:48 }}>🏫</div>
                }
              </div>
              <div style={{ fontSize:11, opacity:.7, letterSpacing:2, marginBottom:2 }}>{loginConfig.eduTag || "EDUCATION PORTAL"}</div>
              <div style={{ fontSize:22, fontWeight:700, fontFamily:"Amiri,serif", marginBottom:2 }}>{loginConfig.namaSekolah || "Bunayya Islamic School"}</div>
              <div style={{ fontSize:13, opacity:.75 }}>{loginConfig.tagline || "Menuju Generasi Qur'ani"}</div>
            </div>

            {/* Upload Logo */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">📷 Logo Sekolah</label>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                {loginConfig.logoUrl && (
                  <img src={loginConfig.logoUrl} alt="Logo" style={{ width:52, height:52, borderRadius:"50%", objectFit:"cover", border:"2px solid #e0e0e0" }} />
                )}
                <label style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 16px", background:"#f0fdf4", border:"1.5px dashed #27ae60", borderRadius:10, cursor:"pointer", fontSize:13, fontWeight:600, color:"#27ae60" }}>
                  📁 Pilih Foto
                  <input type="file" accept="image/*" style={{ display:"none" }} onChange={e => {
                    const file = e.target.files?.[0];
                    if (!file) return;

                  }} />
                </label>
                {loginConfig.logoUrl && (
                  <button onClick={() => saveLoginConfig({ logoUrl: null })} style={{ padding:"6px 12px", fontSize:12, background:"#fee2e2", color:"#dc2626", border:"none", borderRadius:8, cursor:"pointer", fontWeight:600 }}>🗑️ Hapus</button>
                )}
              </div>
            </div>

            {/* Nama Sekolah */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">🏫 Nama Sekolah</label>
              <input className="input" placeholder="Bunayya Islamic School"
                value={formData.cfg_namaSekolah ?? (loginConfig.namaSekolah || "")}
                onChange={e => patchForm({ cfg_namaSekolah: e.target.value })} />
            </div>

            {/* Tagline */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">✨ Tagline / Slogan</label>
              <input className="input" placeholder="Menuju Generasi Qur'ani"
                value={formData.cfg_tagline ?? (loginConfig.tagline || "")}
                onChange={e => patchForm({ cfg_tagline: e.target.value })} />
            </div>

            {/* Education Tag */}
            <div className="form-group" style={{ margin:0 }}>
              <label className="label">🏷️ Label Atas (Education Tag)</label>
              <input className="input" placeholder="EDUCATION PORTAL"
                value={formData.cfg_eduTag ?? (loginConfig.eduTag || "")}
                onChange={e => patchForm({ cfg_eduTag: e.target.value })} />
            </div>

            <button
              onClick={() => {
                saveLoginConfig({
                  namaSekolah: formData.cfg_namaSekolah ?? loginConfig.namaSekolah ?? "Bunayya Islamic School",
                  tagline:     formData.cfg_tagline     ?? loginConfig.tagline     ?? "Menuju Generasi Qur'ani",
                  eduTag:      formData.cfg_eduTag      ?? loginConfig.eduTag      ?? "EDUCATION PORTAL",
                });
                patchForm({ cfg_namaSekolah: undefined, cfg_tagline: undefined, cfg_eduTag: undefined });
                alert("✅ Pengaturan tampilan login berhasil disimpan!");
              }}
              className="btn btn-primary"
            >
              💾 Simpan Pengaturan
            </button>
          </div>
        </div>

        {/* ── Pengaturan Slide ── */}
        {(() => {
          const defaultSlides = [
            { title: "Selamat Datang",     sub: "Portal Pendidikan Bunayya", bg: "linear-gradient(135deg,#1a8a5a,#27ae60)", imgUrl: null },
            { title: "Pantau Perkembangan", sub: "Anak Anda setiap hari",    bg: "linear-gradient(135deg,#1565c0,#1e88e5)", imgUrl: null },
            { title: "Generasi Qur'ani",   sub: "Berakhlak & Berprestasi",  bg: "linear-gradient(135deg,#6a1b9a,#9c27b0)", imgUrl: null },
          ];
          const slides = (loginConfig.slides && loginConfig.slides.length > 0) ? loginConfig.slides : defaultSlides;

          const updateSlide = (idx, patch) => {
            const next = slides.map((s, i) => i === idx ? { ...s, ...patch } : s);
            saveLoginConfig({ slides: next });
          };
          const uploadImage = (idx, file) => {
            if (!file) return;
            compressImage(file, 600, 0.75).then(dataUrl => updateSlide(idx, { imgUrl: dataUrl }));
          };

          return (
            <div className="card">
              <div className="card-header">
                <div className="card-title">🖼️ Pengaturan Slide Banner</div>
              </div>
              <div className="card-body" style={{ display:"flex", flexDirection:"column", gap:20 }}>
                {slides.map((slide, idx) => (
                  <div key={idx} style={{ border:"1.5px solid #e8e8e8", borderRadius:14, overflow:"hidden" }}>
                    {/* Preview mini */}
                    <div style={{
                      height:80, background: slide.imgUrl ? `url(${slide.imgUrl}) center/cover` : slide.bg,
                      display:"flex", alignItems:"center", padding:"0 16px", position:"relative"
                    }}>
                      {slide.imgUrl && <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,.4)", borderRadius:0 }} />}
                      <div style={{ position:"relative", zIndex:1 }}>
                        <div style={{ fontWeight:700, fontSize:14, color:"white" }}>{slide.title || "Judul Slide"}</div>
                        <div style={{ fontSize:11, color:"rgba(255,255,255,.8)" }}>{slide.sub || "Sub judul"}</div>

                      <div style={{ position:"absolute", top:8, right:8, fontSize:11, background:"rgba(0,0,0,.4)", color:"white", padding:"2px 8px", borderRadius:99 }}>Slide {idx+1}</div>

                            onChange={e => updateSlide(idx, { title: e.target.value })} />
                        </div>
                        <div className="form-group" style={{ margin:0 }}>
                          <label className="label" style={{ fontSize:11 }}>Sub Judul</label>
                          <input className="input" style={{ fontSize:12 }} value={slide.sub || ""}
                            onChange={e => updateSlide(idx, { sub: e.target.value })} />
                        </div>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>

                          <input type="file" accept="image/*" style={{ display:"none" }}
                            onChange={e => uploadImage(idx, e.target.files?.[0])} />
                        </label>
                        {slide.imgUrl && (
                          <button onClick={() => updateSlide(idx, { imgUrl: null })}
                            style={{ padding:"6px 12px", fontSize:11, background:"#fee2e2", color:"#dc2626", border:"none", borderRadius:8, cursor:"pointer", fontWeight:600 }}>
                            🗑️ Hapus Gambar
                          </button>
                        )}
                        {slide.imgUrl
                          ? <span style={{ fontSize:11, color:"#27ae60", fontWeight:600 }}>✅ Gambar terpasang</span>
                          : <span style={{ fontSize:11, color:"#aaa" }}>Menggunakan warna gradient</span>
                        }
                      </div>
                    </div>
                  </div>
                ))}
                <div style={{ fontSize:11, color:"#aaa", textAlign:"center" }}>💡 Perubahan langsung tersimpan otomatis</div>
              </div>
            </div>
          );
        })()}

      </div>
    );
  }

  // Pengaturan Mapel
  if (menu === "pengaturan-mapel") {
    const openAddMapel = () => patchForm({ showMapelDialog: true, editMapelId: null, newMapelNama: "" });
    const openEditMapel = (s) => patchForm({ showMapelDialog: true, editMapelId: s.id, newMapelNama: s.name });
    const saveMapel = () => {
      if (!formData.newMapelNama) { alert("Nama mapel wajib diisi!"); return; }
      if (formData.editMapelId) {
        const editId = formData.editMapelId;
        const updated = { ...data.subjects.find(s => s.id === editId), name: formData.newMapelNama };
        setData(d => {
          const next = { ...d, subjects: d.subjects.map(s => s.id === editId ? updated : s) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("subjects", updated);
      } else {
        const rec = { id: genId(), name: formData.newMapelNama };
        setData(d => {
          const next = { ...d, subjects: [...d.subjects, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("subjects", rec);
      }
      patchForm({ showMapelDialog: false });
    };
    const MAPEL_COLORS = ["#e8f5e9","#e3f2fd","#fff3e0","#fce4ec","#ede7f6","#e0f7fa","#f3e5f5","#fff8e1"];
    return (
      <div>
        <div className="card">
          <div className="card-header">
            <div className="card-title">📖 Pengaturan Mata Pelajaran</div>
            <button className="btn btn-primary btn-sm" onClick={openAddMapel}><Icon.Plus /> Tambah Mapel</button>
          </div>
          <div className="card-body">
            <div className="flex gap-3 wrap">
              {data.subjects.map((s, i) => (
                <div key={s.id} style={{ display:"flex", alignItems:"center", gap:8, background: MAPEL_COLORS[i % MAPEL_COLORS.length], borderRadius:12, padding:"10px 16px", border:"1.5px solid rgba(0,0,0,.06)" }}>
                  <span style={{ fontSize:14, fontWeight:700 }}>{s.name}</span>
                  <div className="flex gap-1">
                    <button onClick={() => openEditMapel(s)} style={{ background:"rgba(0,0,0,.06)", border:"none", cursor:"pointer", borderRadius:6, padding:"3px 6px", fontSize:12, display:"flex", alignItems:"center" }}><Icon.Edit /></button>
                    <button onClick={() => deleteItem("subjects", s.id, s.name)} style={{ background:"#fee2e2", border:"none", cursor:"pointer", color:"#c0392b", borderRadius:6, padding:"3px 6px", fontSize:12, display:"flex", alignItems:"center" }}><Icon.Trash /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>

        {formData.showMapelDialog && (
          <Dialog open title={formData.editMapelId ? "✏️ Edit Mata Pelajaran" : "➕ Tambah Mata Pelajaran"} onClose={() => patchForm({ showMapelDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showMapelDialog: false })}>Batal</button><button className="btn btn-primary" onClick={saveMapel}><Icon.Save /> Simpan</button></>}>
            <div className="form-group">
              <label className="label">Nama Mata Pelajaran *</label>
              <input className="input" placeholder="Contoh: Al-Qur'an, Matematika..." value={formData.newMapelNama || ""} onChange={e => patchForm({ newMapelNama: e.target.value })} onKeyDown={e => e.key === "Enter" && saveMapel()} />

          </Dialog>
        )}
      </div>
    );
  }

  return null;
}

                  {(() => {

    if (menu === "ziyadah") {

        <div className="card-header"><div className="card-title">📖 Input Ziyadah Hafalan</div></div>
        <div className="card-body">
          <div className="grid grid-2 mb-4">
            <div className="form-group"><label className="label">Kelas *</label><div className="select-wrap"><select className="select" value={formData.z_kelas || ""} onChange={e => patchForm({ z_kelas: e.target.value, z_siswa: "" })}><option value="">-- Pilih --</option>{KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}</select></div></div>
            <div className="form-group"><label className="label">Siswa *</label><div className="select-wrap"><select className="select" value={formData.z_siswa || ""} onChange={e => patchForm({ z_siswa: e.target.value })} disabled={!formData.z_kelas}><option value="">{formData.z_kelas ? "-- Pilih --" : "Pilih kelas dulu"}</option>{data.students.filter(s => s.class_name === formData.z_kelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}</select></div></div>
            <div className="form-group"><label className="label">Tanggal *</label><input className="input" type="date" value={formData.z_tanggal || todayStr} onChange={e => patchForm({ z_tanggal: e.target.value })} /></div>
            <div className="form-group"><label className="label">Juz *</label><div className="select-wrap"><select className="select" value={formData.z_juz || ""} onChange={e => patchForm({ z_juz: e.target.value, z_surat: "" })}><option value="">-- Pilih --</option>{JUZ_LIST.filter(j => j !== "Semua").map(j => <option key={j} value={j}>{j}</option>)}</select></div></div>
            <div className="form-group"><label className="label">Surat</label><div className="select-wrap"><select className="select" value={formData.z_surat || ""} onChange={e => patchForm({ z_surat: e.target.value })} disabled={!formData.z_juz}><option value="">-- Pilih Surat --</option>{data.surahs.filter(s => s.juz === formData.z_juz).map(s => <option key={s.id} value={s.nama}>{s.nama} ({s.ayat} ayat)</option>)}</select></div></div>
            <div className="form-group"><label className="label">Hasil *</label><div className="select-wrap"><select className="select" value={formData.z_hasil || ""} onChange={e => patchForm({ z_hasil: e.target.value })}><option value="">-- Pilih --</option>{HASIL_HAFALAN.map(h => <option key={h} value={h}>{h}</option>)}</select></div></div>
            <div className="form-group" style={{ gridColumn: "span 2" }}><label className="label">Progress (misal: Ayat 1-10)</label><input className="input" value={formData.z_progress || ""} onChange={e => patchForm({ z_progress: e.target.value })} /></div>
          </div>
          <div className="form-group"><label className="label">Catatan</label><textarea className="textarea" value={formData.z_catatan || ""} onChange={e => patchForm({ z_catatan: e.target.value })} /></div>

          <div className="mt-6">

              <div style={{ fontWeight:700 }}>📖 Riwayat Ziyadah</div>
              <button id="btn-pdf-tbl-ziyadah" onClick={() => downloadTablePDF("tbl-ziyadah","Riwayat Ziyadah","Ziyadah")} style={{ padding:"5px 12px", fontSize:12, fontWeight:700, background:"#dc2626", color:"white", border:"none", borderRadius:8, cursor:"pointer" }}>⬇️ PDF</button>

            <div className="flex gap-2 items-center mb-3" style={{flexWrap:"wrap",gap:8}}>
              <div className="select-wrap" style={{width:140}}>
                <select className="select" style={{fontSize:13}} value={formData.zy_fkelas || "Semua"} onChange={e => patchForm({zy_fkelas: e.target.value, zy_fnama: ""})}>
                  {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{width:180}}>
                <select className="select" style={{fontSize:13}} value={formData.zy_fnama || ""} onChange={e => patchForm({zy_fnama: e.target.value})}>
                  <option value="">Semua Nama</option>
                  {data.students.filter(s => !formData.zy_fkelas || formData.zy_fkelas === "Semua" || s.class_name === formData.zy_fkelas).map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
                </select>
              </div>
              <div className="select-wrap" style={{width:150}}>
                <select className="select" style={{fontSize:13}} value={formData.zy_fbulan || ""} onChange={e => patchForm({zy_fbulan: e.target.value})}>
                  <option value="">Semua Bulan</option>
                  {["01","02","03","04","05","06","07","08","09","10","11","12"].map(bln => (
                    <option key={bln} value={bln}>{["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][parseInt(bln)-1]}</option>

                </select>
              </div>
            </div>
            <div id="tbl-ziyadah" className="row-list">
              {(() => {

                  const s = data.students.find(s => s.id === z.studentId);
                  return (!formData.zy_fkelas || formData.zy_fkelas === "Semua" || z.kelas === formData.zy_fkelas)
                    && (!formData.zy_fnama || z.studentId === formData.zy_fnama)
                    && (!formData.zy_fbulan || (z.tanggal && z.tanggal.slice(5,7) === formData.zy_fbulan));

                return fzy.map(z => {
                  const s = data.students.find(s => s.id === z.studentId);
                  return (
                    <div key={z.id} className="row-item">
                      <div>
                        <div style={{ fontWeight:600 }}>{z.surat || z.juz}</div>
                        <div className="text-xs text-muted">{s?.nama} — {z.juz} — {z.tanggal}</div>

                        <StatusBadge status={z.hasil} />

            </div>
          </div>
        </div>
      </div>

  }

  if (menu === "siswa") {

    const openEditSiswa = (s) => patchForm({ showSiswaDialog: true, editSiswaId: s.id, newSiswaNis: s.nis, newSiswaNama: s.nama, newSiswaKelas: s.class_name });
    const saveSiswa = () => {
      if (!formData.newSiswaNis || !formData.newSiswaNama || !formData.newSiswaKelas) {
        alert("NIS, Nama, dan Kelas wajib diisi!"); return;
      }
      if (formData.editSiswaId) {
        const editId = formData.editSiswaId;
        const updated = { ...data.students.find(s => s.id === editId), nis: formData.newSiswaNis, nama: formData.newSiswaNama, class_name: formData.newSiswaKelas };
        setData(d => {
          const next = { ...d, students: d.students.map(s => s.id === editId ? updated : s) };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("students", updated);
      } else {
        const rec = { id: genId(), nis: formData.newSiswaNis, nama: formData.newSiswaNama, class_name: formData.newSiswaKelas };
        setData(d => {
          const next = { ...d, students: [...d.students, rec] };
          try { localStorage.setItem("bunayya_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });
        writeDoc("students", rec);
      }
      patchForm({ showSiswaDialog: false });
    };
    return (
      <div>
        <div className="card">
          <div className="card-header">
            <div className="card-title">📖 Master Data Siswa</div>
            <div className="flex gap-2">
              <button className="btn btn-outline btn-sm"><Icon.Download /> Export</button>
              <button className="btn btn-blue btn-sm" onClick={openAddSiswa}><Icon.Plus /> Tambah Siswa</button>
            </div>
          </div>
          <div className="card-body">
            <div className="table-wrap">
              <table>
                <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Aksi</th></tr></thead>

                  {data.students.length === 0 ? (
                    <tr><td colSpan={5} className="empty-state">Belum ada data siswa</td></tr>
                  ) : data.students.map((s, i) => (
                    <tr key={s.id}>
                      <td>{i+1}</td>
                      <td className="text-sm">{s.nis}</td>
                      <td style={{fontWeight:600}}>{s.nama}</td>
                      <td><Badge variant="blue">{s.class_name}</Badge></td>
                      <td>
                        <div className="flex gap-2">
                          <button className="btn btn-outline btn-sm btn-icon" onClick={() => openEditSiswa(s)}><Icon.Edit /></button>
                          <button className="btn btn-danger btn-sm btn-icon" onClick={() => deleteItem("students", s.id, s.nama)}><Icon.Trash /></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        {formData.showSiswaDialog && (
          <Dialog open title={formData.editSiswaId ? "✏️ Edit Data Siswa" : "➕ Tambah Siswa Baru"} onClose={() => patchForm({ showSiswaDialog: false })}
            footer={<><button className="btn btn-outline" onClick={() => patchForm({ showSiswaDialog: false })}>Batal</button><button className="btn btn-blue" onClick={saveSiswa}><Icon.Save /> {formData.editSiswaId ? "Simpan Perubahan" : "Tambah Siswa"}</button></>}>
            <div className="form-group">
              <label className="label">NIS *</label>
              <input className="input" placeholder="Nomor Induk Siswa" value={formData.newSiswaNis || ""} onChange={e => patchForm({ newSiswaNis: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="label">Nama Lengkap *</label>
              <input className="input" placeholder="Nama lengkap siswa" value={formData.newSiswaNama || ""} onChange={e => patchForm({ newSiswaNama: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="label">Kelas *</label>
              <div className="select-wrap"><select className="select" value={formData.newSiswaKelas || ""} onChange={e => patchForm({ newSiswaKelas: e.target.value })}>
                <option value="">-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k}>{k}</option>)}
              </select></div>
            </div>
          </Dialog>
        )}
      </div>
    );
  }

  return null;
}

// ─── PORTAL WALI ─────────────────────────────────────────────────────────────
function PortalWali({ menu, data, formData, patchForm, user }) {
  const studentData = user?.role === "student"
    ? data.students.find(s => s.nis === user.nis)
    : data.students.find(s => s.id === formData.wali_siswa);

  const sid = studentData?.id || formData.wali_siswa;

  const studentAtt = data.studentAttendance.filter(a => a.studentId === sid);
  const studentGrades = data.grades.filter(g => g.studentId === sid);
  const studentReports = data.dailyReports.filter(r => r.studentId === sid);
  const studentActs = data.activities.filter(a => a.studentId === sid);
  const studentTargets = data.targets.filter(t => t.studentId === sid);
  const studentZiyadah = data.ziyadah.filter(z => z.studentId === sid);

  const hadirCount = studentAtt.filter(a => a.status === "Hadir").length;
  const attPct = studentAtt.length > 0 ? Math.round((hadirCount / studentAtt.length) * 100) : 0;
  const avgGrade = studentGrades.length > 0 ? Math.round(studentGrades.reduce((a, g) => a + g.skor, 0) / studentGrades.length) : 0;

  const attColors = { Hadir: "#065f46", Sakit: "#92400e", Izin: "#1e40af", Alpa: "#991b1b" };
  const attBg = { Hadir: "#d1fae5", Sakit: "#fef3c7", Izin: "#dbeafe", Alpa: "#fee2e2" };

  return (
    <div>
      {/* Hero */}
      <div className="hero-card hero-card-purple" style={{ marginBottom: 20 }}>
        <h2 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>🏡 Pantau Perkembangan Anak</h2>
        {user?.role !== "student" && (
          <div className="grid grid-2" style={{ gap: 12 }}>
            <div className="form-group" style={{ margin: 0 }}>
              <label className="label" style={{ color: "rgba(255,255,255,.8)" }}>Kelas</label>
              <div className="select-wrap"><select className="select" style={{ background: "rgba(255,255,255,.15)", border: "1px solid rgba(255,255,255,.3)", color: "white" }} value={formData.wali_kelas || ""} onChange={e => patchForm({ wali_kelas: e.target.value, wali_siswa: "" })}>
                <option value="" style={{ color: "#1a1a1a" }}>-- Pilih Kelas --</option>
                {KELAS_LIST.filter(k => k !== "Semua").map(k => <option key={k} value={k} style={{ color: "#1a1a1a" }}>{k}</option>)}
              </select></div>
            </div>
            <div className="form-group" style={{ margin: 0 }}>
              <label className="label" style={{ color: "rgba(255,255,255,.8)" }}>Siswa</label>
              <div className="select-wrap"><select className="select" style={{ background: "rgba(255,255,255,.15)", border: "1px solid rgba(255,255,255,.3)", color: "white" }} value={formData.wali_siswa || ""} onChange={e => patchForm({ wali_siswa: e.target.value })} disabled={!formData.wali_kelas}>
                <option value="" style={{ color: "#1a1a1a" }}>{formData.wali_kelas ? "-- Pilih Siswa --" : "Pilih kelas dulu"}</option>
                {data.students.filter(s => s.class_name === formData.wali_kelas).map(s => <option key={s.id} value={s.id} style={{ color: "#1a1a1a" }}>{s.nama}</option>)}
              </select></div>
            </div>
          </div>
        )}
        {studentData && (
          <div style={{ marginTop: user?.role !== "student" ? 12 : 0 }}>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,.75)" }}>{studentData.class_name}</div>
            <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "Amiri, serif" }}>{studentData.nama}</div>
          </div>
        )}
      </div>

      {/* Dashboard */}
      {menu === "dashboard" && (
        <div>
          {/* Tombol Download */}
          {(() => {
            const [downloading, setDownloading] = React.useState(false);
            const handleDownload = () => {
              const el = document.getElementById("wali-dashboard-capture");
              if (!el) { alert("Konten belum siap, coba lagi."); return; }
              if (typeof html2canvas === "undefined") { alert("Library belum siap, tunggu sebentar lalu coba lagi."); return; }
              setDownloading(true);
              html2canvas(el, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#ffffff",
                logging: false,
                onclone: (doc) => {
                  // Pastikan semua elemen visible di clone
                  doc.getElementById("wali-dashboard-capture").style.display = "block";
                }
              }).then(canvas => {
                const link = document.createElement("a");
                link.download = `rekap-${(studentData?.nama||"siswa").replace(/ /g,"-")}-${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setDownloading(false);
              }).catch(err => {
                console.error("Download error:", err);
                alert("Gagal download: " + err.message);
                setDownloading(false);
              });
            };
            return (
              <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:12 }}>
                <button onClick={handleDownload} disabled={downloading}
                  style={{ display:"flex", alignItems:"center", gap:6, padding:"8px 18px", fontSize:13, fontWeight:700, background: downloading ? "#aaa" : "#1d7a5f", color:"white", border:"none", borderRadius:10, cursor: downloading ? "not-allowed" : "pointer", transition:"all .2s" }}>
                  {downloading ? <><span style={{ display:"inline-block", animation:"spin 1s linear infinite" }}>⟳</span> Memproses...</> : <>⬇️ Download JPG</>}
                </button>
              </div>
            );
          })()}
          <div id="wali-dashboard-capture" style={{ padding:8, background:"#f8fafc", borderRadius:12 }}>
          {/* Info siswa di capture */}
          {studentData && (
            <div style={{ background:"linear-gradient(135deg,#1d7a5f,#065f46)", borderRadius:16, padding:"16px 20px", marginBottom:16, color:"white" }}>
              <div style={{ fontSize:12, opacity:.75 }}>{studentData.class_name}</div>
              <div style={{ fontSize:20, fontWeight:700, fontFamily:"Amiri,serif" }}>{studentData.nama}</div>
              <div style={{ fontSize:11, opacity:.6, marginTop:4 }}>Rekap per {new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</div>

          <div className="grid grid-5 mb-4" style={{ gap: 12 }}>
            {[
              { icon: "✅", label: "Kehadiran", val: `${attPct}%` },

              { icon: "📝", label: "Laporan Harian", val: studentReports.length },
              { icon: "🏆", label: "Target", val: studentTargets.length },
              { icon: "📖", label: "Surat Dihafal", val: studentZiyadah.length },
            ].map(s => (
              <div key={s.label} className="stat-card">
                <div className="stat-icon">{s.icon}</div>
                <div className="stat-value">{s.val}</div>
                <div className="stat-label">{s.label}</div>
              </div>
            ))}
          </div>
          <div className="grid grid-2">
            <div className="card">
              <div className="card-header"><div className="card-title">📋 Rekap Absensi</div></div>
              <div className="card-body">
                {studentAtt.length === 0 ? <div className="empty-state">Belum ada data absensi</div> : (
                  <div className="flex gap-3" style={{ justifyContent: "center" }}>
                    {STATUS_ABSENSI.map(st => {
                      const count = studentAtt.filter(a => a.status === st).length;
                      return (
                        <div key={st} style={{ textAlign: "center" }}>
                          <div style={{ width: 52, height: 52, borderRadius: "50%", background: attBg[st], border: `2px solid ${attColors[st]}`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 4px", fontWeight: 700, fontSize: 18, color: attColors[st] }}>{count}</div>
                          <div style={{ fontSize: 11, color: attColors[st] }}>{st}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
            <div className="card">
              <div className="card-header"><div className="card-title">📝 Laporan Harian Terbaru</div></div>
              <div className="card-body">
                {studentReports.length === 0 ? <div className="empty-state">Belum ada laporan</div> : (
                  <div className="row-list">
                    {studentReports.slice(0, 4).map(r => (
                      <div key={r.id} className="row-item">
                        <div><div style={{ fontWeight: 600, fontSize: 13 }}>{r.bahasan}</div><div className="text-xs text-muted">{r.tanggal}</div></div>
                        <StatusBadge status={r.hasil} />

                  </div>

            </div>
            <div className="card">
              <div className="card-header"><div className="card-title">📊 Nilai Terbaru</div></div>
              <div className="card-body">
                {studentGrades.length === 0 ? <div className="empty-state">Belum ada nilai</div> : (
                  <div className="grid grid-2" style={{ gap: 10 }}>
                    {studentGrades.slice(0, 4).map(g => (
                      <div key={g.id} style={{ background: "#f8fafc", borderRadius: 10, padding: 12, textAlign: "center" }}>
                        <div className="text-xs text-muted">{g.mataPelajaran}</div>

                          <span className="text-xs text-muted">{t.progressSaatIni}/{t.progressTotal} {t.satuan}</span>
